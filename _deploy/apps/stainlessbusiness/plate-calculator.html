  function calculate() {
    var thickness = Math.max(parseFloat(document.getElementById('thickness').value) || 0, 0.01);
    var width = Math.max(parseFloat(document.getElementById('width').value) || 0, 1);
    var length = Math.max(parseFloat(document.getElementById('length').value) || 0, 1);
    var quantity = Math.max(parseInt(document.getElementById('quantity').value) || 1, 1);
    var rawPrice = Math.max(parseFloat(document.getElementById('rawPrice').value) || 0, 0);
    var dist = Math.max(parseFloat(document.getElementById('distance').value) || 0, 0);
    var logRate = Math.max(parseFloat(document.getElementById('logisticsRate').value) || 0, 0);
    var handleC = Math.max(parseFloat(document.getElementById('handlingCost').value) || 0, 0);
    var profitPct = Math.max(parseFloat(document.getElementById('profitRate').value) || 0, 0);
    var material = document.getElementById('materialInput').value;
    var DENSITY = getDensity(material);
    
    var areaSqm = (width / 1000) * (length / 1000);
    var volumeCm3 = (width / 10) * (length / 10) * thickness;
    var weightKg = volumeCm3 * DENSITY / 1000;
    var totalArea = areaSqm * quantity;
    var totalWeight = weightKg * quantity;
    document.getElementById('weightDisplay').value = totalWeight.toFixed(2);
    var matCost = totalWeight * rawPrice;
    var processCostPerSqm = 0;
    selectedProcesses.forEach(function(id) { var p = processes.find(function(x) { return x.id === id; }); if (p) processCostPerSqm += p.costPerSqm; });
    var processCost = processCostPerSqm * totalArea;
    var packTotal = 0;
    var packNames = [];
    selectedPacks.forEach(function(id) { if (id !== 'none') { var p = packOptions.find(function(x) { return x.id === id; }); if (p) { packTotal += p.totalCost; packNames.push(p.name + '(' + p.totalCost.toFixed(2) + '元)'); } } });
    var packCostPerKg = totalWeight > 0 ? packTotal / totalWeight : 0;
    document.getElementById('packTotalDisplay').textContent = packTotal.toFixed(2);
    document.getElementById('packKgDisplay').textContent = packCostPerKg.toFixed(2);
    var logEnabled = document.getElementById('logisticsToggle').checked;
    var logCost = 0;
    if (logEnabled) { logCost = totalWeight * logRate * dist + totalWeight * handleC; }
    var grandTotal = matCost + processCost + packTotal + logCost;
    var unitPricePerSqm = totalArea > 0 ? grandTotal / totalArea : 0;
    var unitPricePerKg = totalWeight > 0 ? grandTotal / totalWeight : 0;
    var profitAmount = grandTotal * profitPct / 100;
    var quoteTotal = grandTotal + profitAmount;
    var quotePerKg = totalWeight > 0 ? quoteTotal / totalWeight : 0;
    var quotePerSqm = totalArea > 0 ? quoteTotal / totalArea : 0;
    document.getElementById('statArea').textContent = totalArea.toFixed(2);
    document.getElementById('statWeight').textContent = totalWeight.toFixed(2);
    document.getElementById('statUnitPrice').textContent = (grandTotal / quantity).toFixed(2);
    document.getElementById('statTotal').textContent = grandTotal.toFixed(2);
    var rows = []; var total = grandTotal || 1;
    if (matCost > 0) rows.push({ name:'原材料', detail: rawPrice + ' 元/公斤 × ' + totalWeight.toFixed(2) + ' 公斤', cost: matCost, color:'#c9a96e' });
    var processNames = [];
    selectedProcesses.forEach(function(id) { var p = processes.find(function(x) { return x.id === id; }); if (p && p.id !== 'none') processNames.push(p.name + '(' + p.costPerSqm + ')'); });
    if (processCost > 0) rows.push({ name:'加工工艺', detail: processNames.join(' + ') + '，' + processCostPerSqm + ' 元/m² × ' + totalArea.toFixed(2) + ' m²', cost: processCost, color:'#4a90d9' });
    if (packTotal > 0) rows.push({ name:'包装费用', detail: packNames.join(' + ') + ' = ' + packTotal.toFixed(2) + ' 元，折合 ' + packCostPerKg.toFixed(2) + ' 元/公斤', cost: packTotal, color:'#67b168' });
    if (logCost > 0) rows.push({ name:'物流运输', detail: logRate + ' 元/公斤·km × ' + totalWeight.toFixed(2) + ' 公斤 × ' + dist + ' km' + (handleC > 0 ? ' + 装卸' : ''), cost: logCost, color:'#d97b4a' });
    var tbody = document.getElementById('breakdownBody'); tbody.innerHTML = '';
    rows.forEach(function(r) { var tr = document.createElement('tr'); var pct = (r.cost / total * 100).toFixed(2); tr.innerHTML = '<td><span class="dot" style="background:' + r.color + '"></span>' + r.name + '</td><td>' + r.detail + '</td><td>' + r.cost.toFixed(2) + '</td><td>' + pct + '%</td>'; tbody.appendChild(tr); });
    var trTotal = document.createElement('tr'); trTotal.className = 'row-total'; trTotal.innerHTML = '<td><span class="dot" style="background:' + accentColor + '"></span>合计</td><td>' + quantity + ' 张</td><td>' + grandTotal.toFixed(2) + '</td><td>100.00%</td>'; tbody.appendChild(trTotal);
    var trKg = document.createElement('tr'); trKg.className = 'row-sub'; trKg.innerHTML = '<td></td><td style="color:var(--ink)">成本单价</td><td style="color:var(--ink)">' + unitPricePerKg.toFixed(2) + ' 元/公斤</td><td></td>'; tbody.appendChild(trKg);
    var trProfit = document.createElement('tr'); trProfit.className = 'row-sub'; trProfit.innerHTML = '<td></td><td style="color:var(--ink)">利润（' + profitPct + '%）</td><td style="color:var(--success)">+' + profitAmount.toFixed(2) + ' 元</td><td></td>'; tbody.appendChild(trProfit);
    var trQuote = document.createElement('tr'); trQuote.className = 'row-quote'; trQuote.innerHTML = '<td><span class="dot" style="background:var(--accent2)"></span>报价单价</td><td>' + quotePerSqm.toFixed(2) + ' 元/m²</td><td style="font-size:1.05em">' + quotePerKg.toFixed(2) + ' 元/公斤</td><td></td>'; tbody.appendChild(trQuote);
    var chartData = rows.map(function(r) { return { name: r.name, value: parseFloat(r.cost.toFixed(2)), itemStyle: { color: r.color } }; });
    chart.setOption({ animation: false, tooltip: { trigger: 'item', appendToBody: true, formatter: '{b}: {c} 元 ({d}%)' }, legend: { bottom: 0, textStyle: { color: '#8b8fa3', fontSize: 12 } }, series: [{ type: 'pie', radius: ['40%', '70%'], center: ['50%', '45%'], avoidLabelOverlap: true, itemStyle: { borderRadius: 6, borderColor: '#1a1d27', borderWidth: 2 }, label: { color: '#e8eaed', fontSize: 12, formatter: '{b}\n{d}%' }, labelLine: { lineStyle: { color: '#2e3345' } }, data: chartData.length > 0 ? chartData : [{ name: '暂无数据', value: 0, itemStyle: { color: '#2e3345' } }] }] });
    document.getElementById('formulaBlock').innerHTML = '<strong style="color:var(--ink)">计算公式：</strong><br>' + '• 单张面积 = ' + (width/1000).toFixed(2) + ' m × ' + (length/1000).toFixed(2) + ' m = <strong style="color:var(--accent)">' + areaSqm.toFixed(2) + ' m²</strong><br>' + '• 单张重量 = ' + areaSqm.toFixed(2) + ' m² × ' + thickness + ' mm × ' + DENSITY + ' g/cm³ = <strong style="color:var(--accent)">' + weightKg.toFixed(2) + ' 公斤</strong><br>' + '• 原材料费用 = ' + totalWeight.toFixed(2) + ' 公斤 × ' + rawPrice + ' 元/公斤 = <strong style="color:var(--accent)">' + matCost.toFixed(2) + ' 元</strong><br>' + '• 加工费用 = ' + processCostPerSqm + ' 元/m² × ' + totalArea.toFixed(2) + ' m² = <strong style="color:var(--accent)">' + processCost.toFixed(2) + ' 元</strong><br>' + (packTotal > 0 ? '• 包装费用 = ' + packNames.join(' + ') + ' = ' + packTotal.toFixed(2) + ' 元 ÷ ' + totalWeight.toFixed(2) + ' 公斤 = <strong style="color:var(--accent)">' + packCostPerKg.toFixed(2) + ' 元/公斤</strong><br>' : '') + (logEnabled ? '• 物流费用 = ' + totalWeight.toFixed(2) + ' 公斤 × ' + logRate + ' 元/公斤·km × ' + dist + ' km + 装卸 = <strong style="color:var(--accent)">' + logCost.toFixed(2) + ' 元</strong><br>' : '') + '<hr style="border:none;border-top:1px solid var(--rule);margin:0.4rem 0">' + '• 总成本 = <strong style="color:var(--accent)">' + grandTotal.toFixed(2) + ' 元</strong>（' + unitPricePerKg.toFixed(2) + ' 元/公斤）<br>' + '• 利润（' + profitPct + '%）= <strong style="color:var(--success)">' + profitAmount.toFixed(2) + ' 元</strong><br>' + '• 报价 = ' + quotePerKg.toFixed(2) + ' 元/公斤 / ' + quotePerSqm.toFixed(2) + ' 元/m²';
    
    lastResult = {
      material: material, thickness: thickness, width: width, length: length, quantity: quantity,
      rawPrice: rawPrice, dist: dist, logRate: logRate, handleC: handleC, profitPct: profitPct,
      logEnabled: logEnabled, selectedProcesses: Array.from(selectedProcesses), selectedPacks: Array.from(selectedPacks),
      DENSITY: DENSITY, totalArea: totalArea, totalWeight: totalWeight, grandTotal: grandTotal,
      unitPricePerKg: unitPricePerKg, quotePerKg: quotePerKg, quotePerSqm: quotePerSqm
    };
  }
  
  var lastResult = null;
  var savedResults = [];
  
  function loadSavedResults() {
    try {
      var savedStr = localStorage.getItem('plateCalculatorSavedResults');
      savedResults = savedStr ? JSON.parse(savedStr) : [];
      renderSavedResults();
    } catch (e) { savedResults = []; }
  }
  
  function saveCurrentResult() {
    if (!lastResult) return;
    var record = {
      id: Date.now(), timestamp: new Date().toLocaleString('zh-CN'),
      material: lastResult.material, thickness: lastResult.thickness, width: lastResult.width,
      length: lastResult.length, quantity: lastResult.quantity, rawPrice: lastResult.rawPrice,
      dist: lastResult.dist, logRate: lastResult.logRate, handleC: lastResult.handleC,
      profitPct: lastResult.profitPct, logEnabled: lastResult.logEnabled,
      selectedProcesses: lastResult.selectedProcesses, selectedPacks: lastResult.selectedPacks,
      DENSITY: lastResult.DENSITY, totalArea: lastResult.totalArea, totalWeight: lastResult.totalWeight,
      grandTotal: lastResult.grandTotal, quotePerKg: lastResult.quotePerKg, quotePerSqm: lastResult.quotePerSqm
    };
    savedResults.unshift(record);
    localStorage.setItem('plateCalculatorSavedResults', JSON.stringify(savedResults));
    renderSavedResults();
    var btn = document.getElementById('saveResultBtn');
    var originalText = btn.textContent;
    btn.textContent = '已保存！';
    setTimeout(function() { btn.textContent = originalText; }, 1500);
  }
  
  function renderSavedResults() {
    var tbody = document.getElementById('savedResultsBody');
    var countEl = document.getElementById('saveCount');
    var card = document.getElementById('savedResultsCard');
    countEl.textContent = savedResults.length + ' 条';
    if (savedResults.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:1rem;">暂无保存的计算结果</td></tr>';
      card.style.display = 'none';
      return;
    }
    card.style.display = 'block';
    tbody.innerHTML = '';
    savedResults.forEach(function(record, index) {
      var tr = document.createElement('tr');
      var unitCost = (record.grandTotal / record.quantity).toFixed(2);
      tr.innerHTML = '<td>' + (index + 1) + '</td><td>' + record.timestamp + '</td><td>' + record.material + '</td><td>' + record.thickness + '×' + record.width + '×' + record.length + '</td><td>' + record.quantity + '</td><td>' + unitCost + '</td><td>' + record.quotePerKg.toFixed(2) + ' 元/公斤</td><td><button class="action-btn load" onclick="window.loadResult(' + record.id + ')">加载</button><button class="action-btn delete" onclick="window.deleteResult(' + record.id + ')">删除</button></td>';
      tbody.appendChild(tr);
    });
  }
  
  function deleteResult(id) {
    savedResults = savedResults.filter(function(r) { return r.id !== id; });
    localStorage.setItem('plateCalculatorSavedResults', JSON.stringify(savedResults));
    renderSavedResults();
  }
  
  function clearAllResults() {
    if (confirm('确定要清空所有保存的计算结果吗？')) {
      savedResults = [];
      localStorage.removeItem('plateCalculatorSavedResults');
      renderSavedResults();
    }
  }
  
  function loadResult(id) {
    var record = savedResults.find(function(r) { return r.id === id; });
    if (!record) return;
    document.getElementById('materialInput').value = record.material;
    document.getElementById('rawPrice').value = record.rawPrice.toFixed(2);
    document.getElementById('thickness').value = record.thickness;
    document.getElementById('width').value = record.width;
    document.getElementById('length').value = record.length;
    document.getElementById('quantity').value = record.quantity;
    document.getElementById('distance').value = record.dist;
    document.getElementById('logisticsRate').value = record.logRate;
    document.getElementById('handlingCost').value = record.handleC;
    document.getElementById('profitRate').value = record.profitPct;
    document.getElementById('logisticsToggle').checked = record.logEnabled;
    document.getElementById('logisticsFields').style.display = record.logEnabled ? 'block' : 'none';
    document.querySelectorAll('#processGrid .selectable-item').forEach(function(el) {
      el.classList.toggle('active', record.selectedProcesses.includes(el.dataset.id));
    });
    selectedProcesses = new Set(record.selectedProcesses);
    document.querySelectorAll('#packGrid .selectable-item').forEach(function(el) {
      el.classList.toggle('active', record.selectedPacks.includes(el.dataset.id));
    });
    selectedPacks = new Set(record.selectedPacks);
    document.getElementById('densityDisplay').textContent = '当前密度：' + record.DENSITY.toFixed(2) + ' g/cm³';
    updateProcessInfo();
    calculate();
  }
  
  document.getElementById('saveResultBtn').addEventListener('click', saveCurrentResult);
  document.getElementById('clearAllBtn').addEventListener('click', clearAllResults);
  window.loadResult = loadResult;
  window.deleteResult = deleteResult;
  
  var batchRecords = [];
  var currentBatchIndex = 0;
  var fromSource = null;
  
  function initFromFormData() {
    try {
      var dataStr = localStorage.getItem('plateCalcData');
      if (!dataStr) return;
      var data = JSON.parse(dataStr);
      fromSource = data.source || null;
      
      if (data.records && Array.isArray(data.records) && data.records.length > 0) {
        batchRecords = data.records;
        currentBatchIndex = data.currentIndex || 0;
        if (batchRecords.length > 1) {
          document.getElementById('batchNavCard').style.display = 'block';
          document.getElementById('batchCountLabel').textContent = '共 ' + batchRecords.length + ' 条';
          updateBatchNav();
        }
        fillFromRecord(batchRecords[currentBatchIndex]);
      } else if (data.record) {
        fillFromRecord(data.record);
      }
      
      if (fromSource) {
        document.getElementById('fillBackBtn').style.display = 'block';
      }
    } catch (e) { console.error('读取表单数据失败:', e); }
  }
  
  function fillFromRecord(record) {
    if (record.product) document.getElementById('productInput').value = record.product;
    if (record.material) document.getElementById('materialInput').value = record.material;
    if (record.thickness) document.getElementById('thickness').value = record.thickness;
    if (record.width) document.getElementById('width').value = record.width;
    if (record.length) document.getElementById('length').value = record.length;
    if (record.quantity) document.getElementById('quantity').value = record.quantity;
    if (record.rawPrice) document.getElementById('rawPrice').value = record.rawPrice;
    if (record.profitPct !== undefined && record.profitPct !== null) document.getElementById('profitRate').value = record.profitPct;
    
    var density = getDensity(record.material || '304');
    document.getElementById('densityDisplay').textContent = '当前密度：' + density.toFixed(2) + ' g/cm³';
    
    calculate();
  }
  
  function updateBatchNav() {
    document.getElementById('batchIndexLabel').textContent = (currentBatchIndex + 1) + ' / ' + batchRecords.length;
    document.getElementById('prevRecordBtn').disabled = currentBatchIndex === 0;
    document.getElementById('nextRecordBtn').disabled = currentBatchIndex === batchRecords.length - 1;
  }
  
  function saveCurrentToBatch() {
    if (batchRecords.length === 0) return;
    batchRecords[currentBatchIndex].product = document.getElementById('productInput').value;
    batchRecords[currentBatchIndex].material = document.getElementById('materialInput').value;
    batchRecords[currentBatchIndex].thickness = parseFloat(document.getElementById('thickness').value) || 0;
    batchRecords[currentBatchIndex].width = parseFloat(document.getElementById('width').value) || 0;
    batchRecords[currentBatchIndex].length = parseFloat(document.getElementById('length').value) || 0;
    batchRecords[currentBatchIndex].quantity = parseInt(document.getElementById('quantity').value) || 1;
    batchRecords[currentBatchIndex].rawPrice = parseFloat(document.getElementById('rawPrice').value) || 0;
    batchRecords[currentBatchIndex].profitPct = parseFloat(document.getElementById('profitRate').value) || 0;
    if (lastResult) {
      batchRecords[currentBatchIndex].costUnitPrice = lastResult.unitPricePerKg;
      batchRecords[currentBatchIndex].quotePerKg = lastResult.quotePerKg;
    }
  }
  
  function prevRecord() {
    if (currentBatchIndex > 0) {
      saveCurrentToBatch();
      currentBatchIndex--;
      fillFromRecord(batchRecords[currentBatchIndex]);
      updateBatchNav();
    }
  }
  
  function nextRecord() {
    if (currentBatchIndex < batchRecords.length - 1) {
      saveCurrentToBatch();
      currentBatchIndex++;
      fillFromRecord(batchRecords[currentBatchIndex]);
      updateBatchNav();
    }
  }
  
  function fillBackToForm() {
    saveCurrentToBatch();
    
    var result = {
      source: fromSource,
      timestamp: Date.now(),
      records: batchRecords.length > 0 ? batchRecords.map(function(r, i) {
        var costUnitPrice = r.costUnitPrice || 0;
        var quotePerKg = r.quotePerKg || 0;
        
        return {
          product: r.product,
          material: r.material,
          thickness: r.thickness,
          width: r.width,
          length: r.length,
          quantity: r.quantity,
          purchasePrice: costUnitPrice.toFixed(2),
          quotePrice: quotePerKg.toFixed(2)
        };
      }) : [],
      currentIndex: currentBatchIndex,
      currentResult: {
        product: document.getElementById('productInput').value,
        material: document.getElementById('materialInput').value,
        thickness: parseFloat(document.getElementById('thickness').value) || 0,
        width: parseFloat(document.getElementById('width').value) || 0,
        length: parseFloat(document.getElementById('length').value) || 0,
        quantity: parseInt(document.getElementById('quantity').value) || 1,
        purchasePrice: lastResult ? lastResult.unitPricePerKg.toFixed(2) : '0',
        quotePrice: lastResult ? lastResult.quotePerKg.toFixed(2) : '0'
      }
    };
    
    localStorage.setItem('plateCalcResult', JSON.stringify(result));
    
    var btn = document.getElementById('fillBackBtn');
    var originalText = btn.textContent;
    btn.textContent = '已回填！';
    setTimeout(function() { btn.textContent = originalText; }, 1500);
  }
  
  document.getElementById('fillBackBtn').addEventListener('click', fillBackToForm);
  window.prevRecord = prevRecord;
  window.nextRecord = nextRecord;
  
  loadProductOptions();
  loadMaterialOptions();
  loadSavedResults();
  initFromFormData();
  calculate();
  window.addEventListener('resize', function() { chart.resize(); });
})();</script>
</body>
</html>
