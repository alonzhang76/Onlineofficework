<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>不锈钢业务管理系统</title>
    <!-- PDF.js库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
    <!-- Supabase 数据同步（自动匿名登录 + localStorage 拦截同步） -->
    <script>window.SUPABASE_APP_ID='stainlessbusiness';</script>
    <script src="../cloudbase-sync.js?v=20260913a"></script>
    <!-- 手机端表格横向滑动：antd 表格默认不启用 scroll，通过 CSS 让 .ant-table-content 可横向滚动 -->
    <style>
      @media (max-width: 768px) {
        .ant-table-content {
          overflow-x: auto !important;
          -webkit-overflow-scrolling: touch;
          touch-action: pan-x pan-y;
          overscroll-behavior-x: contain;
        }
        .ant-table-content > table {
          min-width: 100%;
          width: max-content;
        }
      }
    </style>
    <!-- 首次云端数据同步完成后自动刷新一次：
         React 应用在挂载时一次性读取 localStorage，而云端数据到达较晚；
         同步层已把云端数据写入原生 localStorage，刷新后即可读到完整数据。
         sessionStorage 标记保证每个会话最多刷新一次。 -->
    <script>
      (function () {
        var DONE = '__sbCloudReloaded';
        window.addEventListener('cloud-data-updated', function (e) {
          try {
            var detail = (e && e.detail) || {};
            if (!detail.initial) return;
            if (sessionStorage.getItem(DONE)) return;
            var keys = detail.keys || [];
            if (!keys.length) return;
            sessionStorage.setItem(DONE, '1');
            console.log('[SB] 云端数据已同步，自动刷新页面一次');
            location.reload();
          } catch (err) {}
        });
      })();
    </script>
    <script defer src="./assets/index-BUzWo_C6.js"></script>
    <link rel="stylesheet" href="./assets/index-D8fI8zIA.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
