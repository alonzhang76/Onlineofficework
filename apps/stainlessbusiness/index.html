<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <script src="../auto-scale.js?v=20260917a"></script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>不锈钢业务管理系统</title>
    <!-- PDF.js库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
    <!-- Supabase 数据同步（自动匿名登录 + localStorage 拦截同步） -->
    <script>window.SUPABASE_APP_ID='stainlessbusiness';</script>
    <script src="../cloudbase-sync.js?v=20260918j"></script>
    <script src="../cloudbase-admin.js?v=20260918c"></script>
    <!-- 手机端表格横向滑动：antd 表格默认不启用 scroll，通过 CSS 让 .ant-table-content 可横向滚动 -->
    <style>
      @media (max-width: 768px) {
        .ant-table-content {
          overflow-x: auto !important;
          -webkit-overflow-scrolling: touch;
          touch-action: pan-x pan-y;
          overscroll-behavior-x: contain;
        }
        .ant-table-content > table {
          min-width: 100%;
          width: max-content;
        }
      }
    </style>
    <!-- 首次云端数据同步完成后自动刷新一次：
         React 应用在挂载时一次性读取 localStorage，而云端数据到达较晚；
         同步层已把云端数据写入原生 localStorage，刷新后即可读到完整数据。
         sessionStorage 标记保证每个会话最多刷新一次。 -->
    <script>
      (function () {
        var DONE = '__sbCloudReloaded';
        window.addEventListener('cloud-data-updated', function (e) {
          try {
            var detail = (e && e.detail) || {};
            if (!detail.initial) return;
            if (sessionStorage.getItem(DONE)) return;
            var keys = detail.keys || [];
            if (!keys.length) return;
            sessionStorage.setItem(DONE, '1');
            console.log('[SB] 云端数据已同步，自动刷新页面一次');
            location.reload();
          } catch (err) {}
        });
      })();
    </script>
    <script defer src="./assets/index-BUzWo_C6.js"></script>
    <link rel="stylesheet" href="./assets/index-D8fI8zIA.css">
    <link rel="stylesheet" href="../tablet-compat.css?v=20260915a">
  </head>
  <body>
    <div id="root"></div>
    <!-- 云端数据管理浮动按钮组（React 不接管 body，故此节点不会被卸载） -->
    <script>
      (function () {
        function inject() {
          if (document.getElementById('sb-cloud-admin-fab')) return;
          var box = document.createElement('div');
          box.id = 'sb-cloud-admin-fab';
          box.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:2000;display:flex;flex-direction:column;gap:8px;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;';
          box.innerHTML =
            '<button data-act="pull" style="padding:8px 12px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.18);display:flex;align-items:center;gap:6px;">⬇️ 下载</button>' +
            '<button data-act="push" style="padding:8px 12px;background:#16a34a;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.18);display:flex;align-items:center;gap:6px;">⬆️ 上传</button>' +
            '<button data-act="clear" style="padding:8px 12px;background:#dc2626;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.18);display:flex;align-items:center;gap:6px;">🗑️ 清空云端</button>';
          box.addEventListener('click', function (e) {
            var act = e.target.getAttribute('data-act');
            if (!act) return;
            if (act === 'pull' && window.CloudAdmin) window.CloudAdmin.pullFromCloud();
            if (act === 'push' && window.CloudAdmin) window.CloudAdmin.pushToCloud();
            if (act === 'clear' && window.CloudAdmin) window.CloudAdmin.clearCloudData();
          });
          document.body.appendChild(box);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', inject);
        } else {
          inject();
        }
      })();
    </script>
  </body>
</html>
