<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>应用六</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #cffafe 0%, #a5f3fc 100%);
  color: #155e75;
}
.card {
  text-align: center;
  padding: 60px 48px;
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 10px 40px rgba(6, 182, 212, 0.2);
}
.icon { font-size: 64px; margin-bottom: 20px; }
h1 { font-size: 28px; margin-bottom: 10px; color: #0e7490; }
p { color: #0891b2; font-size: 15px; margin-bottom: 24px; }
.badge {
  display: inline-block;
  padding: 6px 14px;
  background: #cffafe;
  color: #155e75;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔧</div>
  <h1>应用六</h1>
  <p>这是应用六的占位页面</p>
  <span class="badge">占位 · 待开发</span>
</div>
</body>
</html>
