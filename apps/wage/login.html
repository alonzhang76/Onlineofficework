<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 计件工资管理系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
.login-page { width: 100%; max-width: 380px; padding: 20px; }
.login-card {
  background: #fff; border-radius: 16px; padding: 40px 32px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15); text-align: center;
}
.login-logo {
  margin: 0 auto 16px;
  display: flex; align-items: center; justify-content: center;
}
.login-title { font-size: 22px; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
.login-subtitle { font-size: 13px; color: #64748b; margin-bottom: 28px; }
.form-group { margin-bottom: 16px; text-align: left; }
.form-label { display: block; font-size: 13px; font-weight: 500; color: #475569; margin-bottom: 6px; }
.form-input {
  width: 100%; padding: 10px 14px; font-size: 14px;
  border: 1px solid #e2e8f0; border-radius: 8px; outline: none; transition: border-color 0.2s;
  background: #fffde6;
}
.form-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
.login-btn-wrap { text-align: center; margin-top: 8px; }
.login-btn {
  width: 100%; padding: 12px; font-size: 15px; font-weight: 600;
  border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s;
  background: #2563eb; color: #fff;
}
.login-btn:hover { background: #1e40af; }
.login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
#login-message {
  min-height: 18px; margin-top: 12px; font-size: 13px; text-align: center; color: #6b7280;
  white-space: pre-wrap; word-break: break-all;
}
#debug-panel {
  margin-top: 12px; padding: 8px; background: #fffbeb; border: 1px solid #fcd34d;
  border-radius: 4px; font-size: 11px; color: #92400e; max-height: 120px;
  overflow-y: auto; display: none; white-space: pre-wrap; word-break: break-all;
}
@media (max-width: 480px) {
  .login-card { padding: 28px 20px; border-radius: 12px; }
  .login-logo img { max-width: 100px; }
  .login-title { font-size: 18px; }
  .login-subtitle { font-size: 11px; margin-bottom: 20px; }
  .form-input { padding: 12px 14px; font-size: 16px; }
  .login-btn { padding: 14px; font-size: 16px; }
}
</style>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo"><img src="logo.png" alt="Logo" style="max-width:120px;height:auto;" onerror="this.style.display='none'"></div>
    <div class="login-title">计件工资管理系统</div>
    <div class="login-subtitle">Piece-Rate Wage Management System</div>
    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="email">邮箱</label>
        <input type="email" class="form-input" id="email" name="email" placeholder="请输入邮箱地址" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <input type="password" class="form-input" id="password" name="password" placeholder="请输入密码" autocomplete="current-password" required>
      </div>
      <div class="login-btn-wrap">
        <button type="submit" class="login-btn" id="loginBtn">登 录</button>
      </div>
      <div id="login-message" role="status" aria-live="polite"></div>
      <div id="debug-panel"></div>
    </form>
  </div>
</div>
<script type="module" src="js/supabase.js"></script>
<script type="module" src="js/login.js"></script>
<script>
(function checkLoginReady() {
  var tries = 0;
  var timer = setInterval(function() {
    tries++;
    if (typeof window.handleLogin === 'function') { clearInterval(timer); return; }
    if (tries > 30) {
      clearInterval(timer);
      var msg = document.getElementById('login-message');
      var dbg = document.getElementById('debug-panel');
      if (msg) { msg.style.color = '#dc2626'; msg.textContent = '登录模块加载失败，请检查网络连接后刷新页面'; }
      if (dbg) {
        dbg.style.display = 'block';
        dbg.textContent = '调试信息：\n1. 确认 js/supabase.js 中 SUPABASE_URL 和 anon key 已正确填入\n2. 打开浏览器控制台（F12）查看具体错误\n3. 尝试访问 https://esm.sh/@supabase/supabase-js@2 是否可达';
      }
    }
  }, 100);
})();
</script>
</body>
</html>
