    if (!unlocked || applyingRemote) return;
    if (rebuildTimer) clearTimeout(rebuildTimer);
    rebuildTimer = setTimeout(rebuildNow, 600);
  }
  function rebuildNow() {
    if (!unlocked || applyingRemote) return Promise.resolve();
    var bundle = collectBundle();
    var sig;
    try { sig = JSON.stringify(bundle); } catch (e) { return Promise.resolve(); }
    if (sig === lastBundleSig) return Promise.resolve();
    var saltBytes = b64ToBytes(currentSaltB64);
    return encryptVault(currentKey, saltBytes, bundle).then(function (vault) {
      lastBundleSig = sig;
      lastVaultJson = JSON.stringify(vault);
      localStorage.setItem(VAULT_KEY, lastVaultJson);
      scheduleCloudPush(1200);
    }).catch(function (e) {
      console.warn('[RentVault] 加密失败：', e);
    });
  }

  // ---------- 远端保险库更新（其他电脑写入 → 本机解密落地） ----------
  function refreshAppUI() {
    if (typeof _appStarted === 'undefined' || !_appStarted) return;
    loadDB();
    renderView();
    updateTopbar();
  }
  function handleRemoteVault() {
    var raw = localStorage.getItem(VAULT_KEY);
    if (!raw || raw === lastVaultJson) return;
    var vault = safeParse(raw, null);
    if (!vault || !vault.ct) return;
    var pwd = sessionStorage.getItem(PWD_STORE);
    if (!pwd) return;
    decryptVault(vault, pwd).then(function (res) {
      var same;
      try { same = JSON.stringify(res.bundle) === JSON.stringify(collectBundle()); }
      catch (e) { same = false; }
      lastVaultJson = raw;
      if (same) {
        try { lastBundleSig = JSON.stringify(collectBundle()); } catch (e) {}
        return;
      }
      applyBundle(res.bundle);
      currentKey = res.key;
      currentSaltB64 = vault.salt;
      try { lastBundleSig = JSON.stringify(collectBundle()); } catch (e) {}
      refreshAppUI();
      if (typeof toast === 'function') toast('已接收云端最新数据', 'ok');
    }).catch(function () {
      console.warn('[RentVault] 云端保险库解密失败（口令可能已在其他设备修改）');
      if (typeof toast === 'function') toast('云端数据口令不匹配，未加载远程更新', 'bad');
    });
  }
  window.addEventListener('cloud-data-updated', function (e) {
    var keys = (e.detail && e.detail.keys) || [];
    if (keys.indexOf(VAULT_KEY) >= 0) handleRemoteVault();
  });

  // ---------- 本地写入观察（明文键一改 → 重新加密入云） ----------
  function installWrappers() {
    if (wrappersInstalled) return;
    wrappersInstalled = true;
    var origSet = localStorage.setItem.bind(localStorage);
    var origRemove = localStorage.removeItem.bind(localStorage);
    localStorage.setItem = function (key, value) {
      origSet(key, value);
      if (isWatchedKey(key)) scheduleRebuild();
    };
    localStorage.removeItem = function (key) {
      origRemove(key);
      if (isWatchedKey(key)) scheduleRebuild();
    };
    window.addEventListener('storage', function (e) {
      if (e.key && isWatchedKey(e.key)) scheduleRebuild();
    });
  }

  // ---------- 解锁 / 新建 ----------
  function applyUnlocked(vault, res) {
    applyBundle(res.bundle);
    currentKey = res.key;
    currentSaltB64 = vault.salt;
    unlocked = true;
    lastVaultJson = JSON.stringify(vault);
    try { lastBundleSig = JSON.stringify(collectBundle()); } catch (e) {}
    installWrappers();
    rebuildNow();
    scheduleCloudPush(1500); // 保证本机保险库一定上云（首次创建/迁移场景）
  }
  function unlockExisting(pwd) {
    var raw = localStorage.getItem(VAULT_KEY);
    var vault = safeParse(raw, null);
    if (!vault || !vault.ct) return Promise.reject(new Error('未找到加密保险库'));
    return decryptVault(vault, pwd).then(function (res) {
      sessionStorage.setItem(PWD_STORE, pwd);
      applyUnlocked(vault, res);
    });
  }
  function createNewVault(pwd) {
    var saltBytes = window.crypto.getRandomValues(new Uint8Array(16));
    return deriveKey(pwd, saltBytes).then(function (key) {
      var bundle = collectBundle(); // 本机已有数据一并加密（历史数据迁移上云）
      return encryptVault(key, saltBytes, bundle).then(function (vault) {
        sessionStorage.setItem(PWD_STORE, pwd);
        applyUnlocked(vault, { key: key, bundle: bundle });
        scheduleCloudPush(800);
      });
    });
  }

  // ---------- 修改数据口令（设置页入口） ----------
  function changePassword() {
    if (!unlocked) { if (typeof toast === 'function') toast('请先解锁数据口令', 'bad'); return; }
    var oldPwd = prompt('请输入当前数据口令：');
    if (oldPwd === null) return;
    var vault = safeParse(localStorage.getItem(VAULT_KEY), null);
    if (!vault || !vault.ct) { if (typeof toast === 'function') toast('未找到加密保险库', 'bad'); return; }
    decryptVault(vault, oldPwd).then(function () {
      var p1 = prompt('请输入新数据口令（建议 8 位以上，丢令将无法恢复数据）：');
      if (p1 === null) return;
      if (!p1 || p1.length < 6) { if (typeof toast === 'function') toast('口令至少 6 位', 'bad'); return; }
      var p2 = prompt('请再次输入新口令：');
      if (p2 === null) return;
      if (p1 !== p2) { if (typeof toast === 'function') toast('两次输入不一致', 'bad'); return; }
      var saltBytes = window.crypto.getRandomValues(new Uint8Array(16));
      deriveKey(p1, saltBytes).then(function (key) {
        return encryptVault(key, saltBytes, collectBundle()).then(function (nv) {
          localStorage.setItem(VAULT_KEY, JSON.stringify(nv));
          currentKey = key;
          currentSaltB64 = nv.salt;
          lastVaultJson = JSON.stringify(nv);
          try { lastBundleSig = JSON.stringify(collectBundle()); } catch (e) {}
          sessionStorage.setItem(PWD_STORE, p1);
          scheduleCloudPush(800);
          if (typeof toast === 'function') toast('数据口令已修改，密文已重新上传', 'ok');
        });
      });
    }).catch(function () {
      if (typeof toast === 'function') toast('当前口令错误', 'bad');
    });
  }

  // ---------- 口令门 UI ----------
  var GATE_CSS =
    '#rentGate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;' +
    'background:radial-gradient(1100px 560px at 12% 8%,#e6eeff 0%,transparent 62%),' +
    'radial-gradient(900px 520px at 88% 96%,#e4f8f4 0%,transparent 58%),#f4f6fb;' +
    'font-family:"Microsoft YaHei","PingFang SC",-apple-system,"Segoe UI",Roboto,sans-serif;}' +
    '#rentGate .rg-box{background:#fff;border:1px solid #e8ecf5;border-radius:16px;padding:30px 32px;' +
    'width:350px;max-width:92vw;box-shadow:0 28px 70px -32px rgba(18,38,90,.35);}' +
    '#rentGate .rg-logo{font-size:28px;text-align:center;margin-bottom:4px;}' +
    '#rentGate .rg-title{text-align:center;font-size:17px;font-weight:700;color:#1e2633;margin-bottom:4px;}' +
    '#rentGate .rg-sub{text-align:center;font-size:12px;color:#7b879c;margin-bottom:18px;line-height:1.7;}' +
    '#rentGate .rg-field{margin-bottom:13px;}' +
    '#rentGate .rg-field label{display:block;font-size:12px;color:#465269;margin-bottom:5px;font-weight:600;}' +
    '#rentGate .rg-field input{width:100%;box-sizing:border-box;padding:9px 11px;font-size:13.5px;' +
    'border:1px solid #dfe4ee;border-radius:8px;outline:none;background:#fbfcfe;color:#1e2633;}' +
    '#rentGate .rg-field input:focus{border-color:#9dbcf8;background:#fff;box-shadow:0 0 0 3px rgba(47,111,237,.12);}' +
    '#rentGate .rg-btn{width:100%;height:42px;background:linear-gradient(180deg,#3b7bf6,#2f6fed);color:#fff;border:none;' +
    'border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;letter-spacing:.08em;}' +
    '#rentGate .rg-btn:hover{filter:brightness(1.04);}' +
    '#rentGate .rg-err{color:#e04b4b;font-size:12px;min-height:16px;margin-top:8px;text-align:center;}' +
    '#rentGate .rg-link{text-align:center;margin-top:12px;font-size:12px;color:#2f6fed;cursor:pointer;}' +
    '#rentGate .rg-hide{display:none !important;}';

  var styleEl = document.createElement('style');
  styleEl.textContent = GATE_CSS;
  document.head.appendChild(styleEl);

  var gate = document.createElement('div');
  gate.id = 'rentGate';
  gate.innerHTML =
    '<div class="rg-box">' +
      '<div class="rg-logo">🏪</div>' +
      '<div class="rg-title" id="rgTitle">商铺收租登记</div>' +
      '<div class="rg-sub" id="rgSub">数据端侧加密保护</div>' +
      '<div id="rgUnlockForm" class="rg-hide">' +
        '<div class="rg-field"><label>数据口令</label><input id="rgVaultPwd" type="password" autocomplete="off"></div>' +
        '<button class="rg-btn" id="rgUnlockBtn">解锁数据</button>' +
        '<div class="rg-err" id="rgVaultErr"></div>' +
        '<div class="rg-link" id="rgToCreate">首次使用？点此创建数据口令</div>' +
      '</div>' +
      '<div id="rgCreateForm" class="rg-hide">' +
        '<div class="rg-field"><label>设置数据口令（至少 6 位）</label><input id="rgNewPwd1" type="password" autocomplete="off"></div>' +
        '<div class="rg-field"><label>确认数据口令</label><input id="rgNewPwd2" type="password" autocomplete="off"></div>' +
        '<button class="rg-btn" id="rgCreateBtn">创建并进入</button>' +
        '<div class="rg-err" id="rgCreateErr"></div>' +
        '<div class="rg-link" id="rgToUnlock">已有口令？点此解锁</div>' +
        '<div class="rg-sub" style="margin:14px 0 0;font-size:11px;">若你之前已在其他电脑创建过口令，请确认网络畅通后刷新页面，再点「已有口令」解锁。</div>' +
      '</div>' +
    '</div>';
  document.documentElement.appendChild(gate);

  function showPane(id) {
    ['rgUnlockForm', 'rgCreateForm'].forEach(function (p) {
      document.getElementById(p).classList.toggle('rg-hide', p !== id);
    });
  }
  function hideGate() { gate.classList.add('rg-hide'); }
  function showUnlockPane() {
    document.getElementById('rgTitle').textContent = '数据口令解锁';
    document.getElementById('rgSub').textContent = '云端数据已端侧加密，请输入口令解密';
    showPane('rgUnlockForm');
    setTimeout(function () { document.getElementById('rgVaultPwd').focus(); }, 60);
  }
  function showCreatePane() {
    document.getElementById('rgTitle').textContent = '创建数据口令';
    document.getElementById('rgSub').textContent = '口令用于加密全部数据并同步云端，丢失将无法恢复，请妥善保管';
    showPane('rgCreateForm');
    setTimeout(function () { document.getElementById('rgNewPwd1').focus(); }, 60);
  }

  function waitForVault(timeoutMs) {
    return new Promise(function (resolve) {
      var start = Date.now();
      (function tick() {
        var raw = localStorage.getItem(VAULT_KEY);
        if (raw) return resolve(raw);
        if (Date.now() - start >= timeoutMs) return resolve(null);
        setTimeout(tick, 300);
      })();
    });
  }

  function enterSystem() {
    hideGate();
    if (typeof startApp === 'function') startApp();
  }

  function bootVault() {
    var pwd = sessionStorage.getItem(PWD_STORE);
    if (pwd) {
      waitForVault(9000).then(function (raw) {
        if (!raw) { showUnlockPane(); return; }
        unlockExisting(pwd).then(enterSystem).catch(function () {
          sessionStorage.removeItem(PWD_STORE);
          showUnlockPane();
          document.getElementById('rgVaultErr').textContent = '会话口令已失效，请重新输入';
        });
      });
    } else {
      waitForVault(6000).then(function (raw) {
        if (raw) showUnlockPane(); else showCreatePane();
      });
    }
  }

  // ---------- 门事件 ----------
  document.getElementById('rgUnlockBtn').addEventListener('click', function () {
    var pwd = document.getElementById('rgVaultPwd').value;
    var err = document.getElementById('rgVaultErr');
    err.textContent = '解密中…';
    unlockExisting(pwd).then(function () {
      err.textContent = '';
      enterSystem();
    }).catch(function (e) {
      err.textContent = /未找到/.test(e.message) ? '未找到加密保险库，请创建口令' : '口令错误，无法解密';
    });
  });
  document.getElementById('rgVaultPwd').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('rgUnlockBtn').click();
  });
  document.getElementById('rgCreateBtn').addEventListener('click', function () {
    var p1 = document.getElementById('rgNewPwd1').value;
    var p2 = document.getElementById('rgNewPwd2').value;
    var err = document.getElementById('rgCreateErr');
    if (!p1 || p1.length < 6) { err.textContent = '口令至少 6 位'; return; }
    if (p1 !== p2) { err.textContent = '两次输入不一致'; return; }
    err.textContent = '正在加密…';
    createNewVault(p1).then(function () {
      err.textContent = '';
      enterSystem();
    }).catch(function (e) {
      err.textContent = '创建失败：' + (e.message || e);
    });
  });
  document.getElementById('rgNewPwd2').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('rgCreateBtn').click();
  });
  document.getElementById('rgToCreate').addEventListener('click', showCreatePane);
  document.getElementById('rgToUnlock').addEventListener('click', showUnlockPane);

  // ---------- 对外接口 & 启动 ----------
  window.RentVault = { changePassword: changePassword };
  installWrappers();
  bootVault();
})();
</script>
</body>
</html>
