<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../portal-auth-guard.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商铺收租登记系统</title>
<!-- ===== 云端配置（必须在 cloudbase-sync.js 之前）=====
     明文数据键全部排除、永不上云；仅同步端侧加密后的 rent_vault_v1 密文保险库。
     加密口令仅存本会话 sessionStorage，绝不上云（与工资管理系统同一方案）。 -->
<script>
  window.SUPABASE_APP_ID = 'rent';
  window.CLOUDBASE_APP_KEYS = ['rent_vault_v1'];
  window.CLOUDBASE_EXCLUDE_KEYS = [
    'rent_shops_v1', 'rent_tenants_v1', 'rent_contracts_v1', 'rent_leases_v1',
    'rent_meta_v1', 'rent_tpls_v1', 'rent_pwd_hash', 'rent_session', 'rent_remember_user'
  ];
</script>
<script src="../cloudbase-sync.js?v=20261010a"></script>
<style>
:root{
  --brand:#2f6fed; --brand-d:#1d54c4; --brand-l:#eaf1ff;
  --bg:#f5f7fb; --card:#fff; --line:#e5e9f2; --line-2:#f0f3f8;
  --txt:#1e2633; --txt-2:#465269; --muted:#7b879c;
  --ok:#0f9d58; --ok-l:#e9f7ef; --warn:#d97706; --warn-l:#fef5e7; --bad:#e04b4b; --bad-l:#fdecec;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -18px rgba(16,24,40,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  font-family:"Microsoft YaHei","PingFang SC",-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--txt); font-size:14px; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* ================= 登录页 ================= */
#loginPage{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(1100px 560px at 12% 8%,#e6eeff 0%,transparent 62%),
    radial-gradient(900px 520px at 88% 96%,#e4f8f4 0%,transparent 58%),
    #f4f6fb;
}
.login-card{
  width:900px;max-width:100%;display:grid;grid-template-columns:1.02fr 1fr;
  background:#fff;border:1px solid #e8ecf5;border-radius:20px;overflow:hidden;
  box-shadow:0 28px 70px -32px rgba(18,38,90,.35),0 2px 6px rgba(18,38,90,.05);
}
.login-art{
  position:relative;padding:40px 36px;color:#fff;overflow:hidden;
  background:linear-gradient(155deg,#173a9b 0%,#2f6fed 52%,#1aa7bf 100%);
}
.login-art:after{
  content:"";position:absolute;inset:-40% -20% auto auto;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);
}
.la-brand{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.la-logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center}
.la-brand b{font-size:15px;letter-spacing:.02em}
.la-brand i{display:block;font-style:normal;font-size:10.5px;letter-spacing:.16em;opacity:.72;margin-top:2px}
.la-title{position:relative;z-index:1;margin-top:46px;font-size:29px;font-weight:700;letter-spacing:.02em;line-height:1.35}
.la-sub{position:relative;z-index:1;margin-top:12px;font-size:13px;line-height:1.9;opacity:.82;max-width:300px}
.la-feats{position:relative;z-index:1;margin-top:34px;display:flex;flex-direction:column;gap:11px}
.la-feats div{display:flex;align-items:center;gap:9px;font-size:12.5px;opacity:.9}
.la-feats svg{flex:0 0 auto;opacity:.95}
.la-art-svg{position:absolute;right:-26px;bottom:-12px;opacity:.55;z-index:0}

.login-form{padding:44px 44px 34px;display:flex;flex-direction:column;justify-content:center}
.lf-title{font-size:21px;font-weight:700;letter-spacing:.01em}
.lf-tip{margin-top:7px;font-size:12.5px;color:var(--muted)}
.field{margin-top:20px}
.field label{display:block;font-size:12.5px;color:var(--txt-2);margin-bottom:7px;font-weight:600}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap>svg{position:absolute;left:13px;color:#9aa6ba;pointer-events:none}
.input-wrap input{
  width:100%;height:44px;padding:0 42px 0 40px;border:1px solid #dfe4ee;border-radius:10px;
  background:#fbfcfe;color:var(--txt);outline:none;transition:border-color .15s,box-shadow .15s,background .15s;
}
.input-wrap input::placeholder{color:#aab4c6}
.input-wrap input:focus{border-color:#9dbcf8;background:#fff;box-shadow:0 0 0 3px rgba(47,111,237,.12)}
.eye{position:absolute;right:6px;width:34px;height:34px;border:0;background:transparent;color:#9aa6ba;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.eye:hover{background:#f1f4fa;color:#5b6a85}
.lf-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:12.5px;color:var(--txt-2)}
.lf-row label{display:flex;align-items:center;gap:6px;cursor:pointer}
.lf-row input[type=checkbox]{accent-color:var(--brand);width:14px;height:14px}
.lf-btn{
  margin-top:20px;height:46px;width:100%;border:0;border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,#3b7bf6,#2f6fed);color:#fff;font-size:15px;font-weight:600;letter-spacing:.12em;
  box-shadow:0 10px 22px -12px rgba(47,111,237,.9);transition:transform .08s,filter .15s,opacity .15s;
}
.lf-btn:hover{filter:brightness(1.04)}
.lf-btn:active{transform:translateY(1px)}
.lf-btn[disabled]{opacity:.65;cursor:not-allowed;filter:none}
.login-err{margin-top:12px;font-size:12.5px;color:var(--bad);min-height:18px;line-height:1.5}
.lf-foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line-2);font-size:11.5px;color:#9aa6ba;display:flex;justify-content:space-between}
@media (max-width:820px){
  .login-card{grid-template-columns:1fr}
  .login-art{display:none}
  .login-form{padding:32px 26px}
}

/* ================= 应用骨架 ================= */
#appShell{display:flex;min-height:100vh}
.sidebar{
  width:228px;flex:0 0 228px;background:#fff;border-right:1px solid var(--line);
  padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.brand .logo{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,#2f6fed,#1aa7bf);box-shadow:0 8px 16px -10px rgba(47,111,237,.9);
}
.brand b{font-size:14.5px;display:block;letter-spacing:.01em}
.brand i{font-style:normal;font-size:10.5px;color:#9aa6ba;letter-spacing:.1em}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  color:#4a5568;cursor:pointer;font-size:13.5px;user-select:none;border:0;background:transparent;text-align:left;width:100%;
}
.nav-item svg{color:#8c98ad;flex:0 0 auto}
.nav-item:hover{background:#f4f7fd}
.nav-item.on{background:var(--brand-l);color:var(--brand-d);font-weight:600}
.nav-item.on svg{color:var(--brand-d)}
.side-foot{margin-top:auto;padding:12px 10px 4px;border-top:1px solid var(--line-2);font-size:11px;color:#9aa6ba;line-height:1.7}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:62px;flex:0 0 62px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:20;
}
.tb-title{font-size:15px;font-weight:600}
.tb-sub{font-size:12px;color:var(--muted);margin-left:2px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;
  background:#f3f6fc;color:#4a5568;font-size:12.5px;border:1px solid #e8edf7;
}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#2f6fed,#1aa7bf);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:700}
.content{padding:22px 24px 46px;width:100%;max-width:1440px}

/* ================= 通用组件 ================= */
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:19px;font-weight:700;letter-spacing:.01em}
.page-head p{margin-top:5px;font-size:12.5px;color:var(--muted)}
.head-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{
  height:34px;padding:0 14px;border-radius:9px;border:1px solid #dfe4ee;background:#fff;color:var(--txt-2);
  font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:#c9d3e6;background:#fbfcff;color:var(--txt)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 8px 16px -12px rgba(47,111,237,.95)}
.btn-primary:hover{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.btn-sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn-ghost:hover{background:var(--brand-l);border-color:transparent;color:var(--brand-d)}
.btn-danger{color:var(--bad);border-color:#f3d6d6}
.btn-danger:hover{background:var(--bad-l);border-color:#eebcbc;color:#c33}
.link{color:var(--brand);cursor:pointer;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line-2)}
.card-h h3{font-size:14px;font-weight:600}
.card-h .link{margin-left:auto}
.card-b{padding:16px 18px}
.grid-2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-top:16px}
.grid-2e{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1080px){.grid-2,.grid-2e{grid-template-columns:1fr}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:1080px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:24px;font-weight:700;margin-top:9px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat .v i{font-style:normal;font-size:13px;color:var(--muted);font-weight:500}
.stat .s{margin-top:7px;font-size:12px;color:var(--muted)}
.stat .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.stat.green .bar{background:var(--ok)} .stat.red .bar{background:var(--bad)} .stat.amber .bar{background:var(--warn)} .stat.navy .bar{background:#173a9b}
.stat .v.green{color:var(--ok)} .stat .v.red{color:var(--bad)} .stat .v.amber{color:var(--warn)}

.tbl-wrap{overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{
  text-align:left;font-weight:600;color:#6b7688;font-size:12.5px;background:#f8fafc;
  padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr:hover{background:#fafcff}
.tbl tbody tr:last-child td{border-bottom:0}
.cell-main{font-weight:600;color:var(--txt)}
.cell-sub{font-size:12px;color:var(--muted);margin-top:3px}
.ops{white-space:nowrap;text-align:right}
.ops .btn{vertical-align:middle}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500}
.badge:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-l);color:#0b7a45}
.b-warn{background:var(--warn-l);color:#a25b00}
.b-bad{background:var(--bad-l);color:#b83232}
.b-info{background:var(--brand-l);color:var(--brand-d)}
.b-gray{background:#f1f4f9;color:#6b7688}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--txt-2);font-size:14px;margin-bottom:6px;font-weight:600}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.toolbar .sp{margin-left:auto}
.inp{
  height:34px;padding:0 11px;border:1px solid #dfe4ee;border-radius:9px;background:#fbfcfe;color:var(--txt);outline:none;
}
.inp:focus{border-color:#9dbcf8;background:#fff;box-shadow:0 0 0 3px rgba(47,111,237,.1)}
.search{position:relative}
.search svg{position:absolute;left:10px;top:9px;color:#9aa6ba;pointer-events:none}
.search input{padding-left:32px;padding-right:30px;width:230px}
.search-x{
  position:absolute;right:4px;top:4px;width:26px;height:26px;border:0;border-radius:7px;background:transparent;
  color:#9aa6ba;font-size:11px;cursor:pointer;display:grid;place-items:center;line-height:1;padding:0;
}
.search-x:hover{background:#eef2f9;color:#5b6a85}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{
  height:30px;padding:0 11px;border-radius:8px;border:1px solid #e6eaf3;background:#fff;color:#5b6a85;
  font-size:12.5px;cursor:pointer;
}
.chipbtn.on{background:var(--brand-l);border-color:#c9dbff;color:var(--brand-d);font-weight:600}
.chipbtn .c{opacity:.65;margin-left:3px;font-variant-numeric:tabular-nums}

.sumstrip{display:flex;gap:26px;padding:13px 18px;background:#fbfcfe;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.sumstrip div{font-size:12.5px;color:var(--muted)}
.sumstrip b{display:block;font-size:16px;color:var(--txt);margin-top:4px;font-variant-numeric:tabular-nums}

.chart{padding:12px 14px 6px}
.svg-chart{width:100%;height:auto;display:block}
.axis{font-size:11px;fill:#94a1b8}
.legend{margin-left:auto;display:flex;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend span:before{content:"";width:9px;height:9px;border-radius:3px;background:#c9dbff}
.legend .lg-paid:before{background:var(--brand)}

.todo{padding:6px 0}
.todo-item{display:flex;gap:10px;align-items:flex-start;padding:10px 18px;border-bottom:1px dashed var(--line-2)}
.todo-item:last-child{border-bottom:0}
.todo-dot{width:7px;height:7px;border-radius:50%;background:var(--warn);margin-top:6px;flex:0 0 auto}
.todo-main{flex:1;min-width:0}
.todo-main b{font-size:13px;font-weight:600}
.todo-main p{font-size:12px;color:var(--muted);margin-top:3px}
.todo-act{font-size:12px;color:var(--brand);cursor:pointer;white-space:nowrap}

.kv{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line-2);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* ================= 弹窗 ================= */
#modalRoot .mask{
  position:fixed;inset:0;background:rgba(20,30,55,.42);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;padding:24px;z-index:100;animation:fade .12s ease-out;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:560px;max-width:100%;max-height:88vh;display:flex;flex-direction:column;background:#fff;border-radius:16px;
  box-shadow:0 30px 80px -30px rgba(12,25,60,.5);overflow:hidden;animation:pop .14s ease-out;
}
@keyframes pop{from{transform:translateY(8px) scale(.99);opacity:.6}to{transform:none;opacity:1}}
/* 点到遮罩时轻微抖动，提示「要关闭请点取消/✕」 */
.modal.nudge{animation:nudge .32s cubic-bezier(.36,.07,.19,.97)}
@keyframes nudge{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.modal.wide{width:660px}
.modal.full{width:1080px;max-height:92vh}
/* ---------- 合同正文编辑器 / 预览 ---------- */
.tpl-edit-wrap{display:grid;grid-template-columns:300px 1fr;gap:16px;min-height:420px}
.tpl-edit-left{border:1px solid var(--line-2);border-radius:10px;overflow:auto;max-height:56vh;background:#fbfcfe}
.tpl-edit-right{display:flex;flex-direction:column;min-width:0}
.tpl-edit-hd{font-size:12px;color:#7a879e;padding:8px 10px;border-bottom:1px solid var(--line-2);background:#f6f8fc;font-weight:600}
.tpl-edit-right .tpl-edit-hd{border:1px solid var(--line-2);border-radius:10px 10px 0 0}
.tpl-fields{padding:8px}
.tpl-fld{display:block;margin-bottom:9px}
.tpl-fld>span{display:block;font-size:11.5px;color:#7a879e;margin-bottom:3px}
.tpl-fld-row{display:flex;gap:6px;align-items:center}
.tpl-fld-row input,.tpl-fld-row select{flex:1;min-width:0;height:30px;padding:0 8px;border:1px solid #dfe5ef;border-radius:7px;font-size:12.5px;background:#fff;font-family:inherit}
.tpl-fld-row input:focus,.tpl-fld-row select:focus{outline:none;border-color:#2f6fed;box-shadow:0 0 0 3px rgba(47,111,237,.12)}
.tpl-body{flex:1;width:100%;min-height:430px;padding:16px 18px;border:1px solid var(--line-2);border-top:0;border-radius:0 0 10px 10px;font-family:"宋体",serif;font-size:13px;line-height:2;resize:vertical;background:#fff}
.tpl-body:focus{outline:none;border-color:#2f6fed}
.doc-paper{max-width:760px;margin:0 auto;padding:34px 44px;background:#fff;border:1px solid var(--line-2);border-radius:8px;box-shadow:0 2px 14px -6px rgba(20,40,80,.12);font-family:"宋体",SimSun,serif;font-size:13.5px;line-height:2.1;color:#1b2436}
.doc-line{white-space:pre-wrap;word-break:break-word}
.doc-line.ind{text-indent:2em}
.doc-title{text-align:center;font-family:"黑体",SimHei,sans-serif;font-size:18px;font-weight:700;letter-spacing:.12em;margin-bottom:14px;text-indent:0!important}
.doc-blank{height:.9em}
.tpl-blank{color:#c0392b;font-style:normal;border-bottom:1px dashed #e0a9a2}
@media print{
  body.print-contract #printArea{display:block!important;padding:0}
  body.print-contract .doc-paper{border:0;box-shadow:none;padding:0;max-width:none;font-size:10.5pt}
  body.print-contract .doc-line.ind{text-indent:2em}
  body.print-contract .tpl-blank{color:#000;border-bottom:0}
}
.m-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.m-head h3{font-size:15px;font-weight:600}
.m-x{margin-left:auto;width:30px;height:30px;border:0;background:transparent;border-radius:8px;color:#93a0b8;cursor:pointer;font-size:15px}
.m-x:hover{background:#f2f5fa;color:#5b6a85}
.m-body{padding:18px 20px;overflow:auto}
.m-foot{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--line-2);background:#fbfcfe}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.form-grid{grid-template-columns:1fr}}
.fld{display:block}
.fld.span2{grid-column:1/-1}
.fld>span{display:block;font-size:12.5px;color:var(--txt-2);font-weight:600;margin-bottom:6px}
.fld input,.fld select,.fld textarea{
  width:100%;height:38px;padding:0 11px;border:1px solid #dfe4ee;border-radius:9px;background:#fbfcfe;color:var(--txt);outline:none;
}
.fld textarea{height:72px;padding:9px 11px;resize:vertical;line-height:1.6}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#9dbcf8;background:#fff;box-shadow:0 0 0 3px rgba(47,111,237,.1)}
.fld input[readonly]{background:#f6f8fc;color:#5b6a85}
.info-box{background:#f7f9fd;border:1px solid #e8edf7;border-radius:11px;padding:13px 15px;margin-bottom:16px}
.info-box .big{font-size:20px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.info-box .sub{font-size:12.5px;color:var(--muted);margin-top:5px}
.pay-list{margin-top:16px;border-top:1px dashed var(--line-2);padding-top:12px}
.pay-list h4{font-size:12.5px;color:var(--txt-2);margin-bottom:8px}
.pay-line{display:flex;align-items:center;gap:10px;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line-2)}
.pay-line:last-child{border-bottom:0}
.pay-line .del{margin-left:auto;color:var(--bad);cursor:pointer;font-size:12px}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7}

/* ================= Toast ================= */
#toastBox{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center}
.toast{
  padding:10px 16px;border-radius:10px;background:#1f2937;color:#fff;font-size:13px;
  box-shadow:0 12px 30px -12px rgba(0,0,0,.5);animation:tin .18s ease-out;max-width:80vw;
}
.toast.ok{background:#0f7a45}
.toast.bad{background:#c33}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ================= 打印收据 ================= */
#printArea{display:none}
@media print{
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:0}
  .receipt{width:148mm;margin:0 auto;border:1px solid #333;padding:10mm 12mm;color:#000;font-size:12pt}
  .receipt h1{font-size:17pt;text-align:center;letter-spacing:.4em;margin-bottom:4mm;font-weight:700}
  .receipt .rc-no{text-align:right;font-size:9pt;color:#444;margin-bottom:6mm}
  .receipt table{width:100%;border-collapse:collapse}
  .receipt td{padding:3.2mm 0;font-size:11.5pt;border-bottom:1px dotted #999;vertical-align:top}
  .receipt td.k{width:26mm;color:#333}
  .receipt .rc-amount{font-size:15pt;font-weight:700}
  .receipt .rc-sign{margin-top:14mm;display:flex;justify-content:space-between;font-size:11pt}
  .receipt .rc-foot{margin-top:10mm;font-size:8.5pt;color:#666;text-align:center}
}

@media (max-width:900px){
  #appShell{flex-direction:column}
  .sidebar{width:auto;flex:none;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line);padding:10px}

  .side-foot{display:none}
  .topbar{padding:0 14px}
  .content{padding:16px 14px 40px}
  .stats{grid-template-columns:repeat(2,1fr)}
}

<script>
'use strict';
/* ==========================================================
   基础工具
   ========================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.prototype.slice.call(r.querySelectorAll(s));
const pad2 = n => (n < 10 ? '0' : '') + n;
const uid = p => p + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const sum = (arr, f) => arr.reduce((s, x) => s + (f ? num(f(x)) : num(x)), 0);

function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function curYM() { return todayISO().slice(0, 7); }
function daysInMonth(ym) { const p = ym.split('-').map(Number); return new Date(p[0], p[1], 0).getDate(); }
function monthEnd(ym) { return ym + '-' + pad2(daysInMonth(ym)); }
function addDays(iso, n) {
  const p = iso.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1, p[2] + n);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function addMonths(ym, n) {
  const p = ym.split('-').map(Number);
  const d = new Date(p[0], p[1] - 1 + n, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
}
function monthName(ym) { const p = ym.split('-'); return p[0] + '年' + Number(p[1]) + '月'; }
function money(n, withSign) {
  const v = num(n);
  const s = Math.abs(v).toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  return (v < 0 ? '-' : (withSign ? '+' : '')) + '¥' + s;
}
function fmtShort(v) {
  if (v >= 10000) return (v / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  return String(Math.round(v));
}
function daysBetween(a, b) {
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}
function toast(msg, type) {
  const box = $('#toastBox'); if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .2s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 220); }, 2200);
}

/* SHA-256（纯 JS，离线可用，中文/ASCII 均可） */
function sha256(str) {
  function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
  const utf8 = unescape(encodeURIComponent(str));
  const maxWord = Math.pow(2, 32);
  let result = '';
  const words = [];
  const asciiBitLength = utf8.length * 8;
  let hash = sha256.h = sha256.h || [];
  const k = sha256.k = sha256.k || [];
  let primeCounter = k.length;
  const isComposite = {};
  for (let candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (Math.pow(candidate, .5) * maxWord) | 0;
      k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  let s = utf8 + '\x80';
  while (s.length % 64 - 56) s += '\x00';
  for (let i = 0; i < s.length; i++) {
    const j = s.charCodeAt(i);
    if (j >> 8) return '';
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = ((asciiBitLength / maxWord) | 0);
  words[words.length] = asciiBitLength;
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16);
    const oldHash = hash.slice(0);
    let a, e, temp1, temp2;
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2];
      a = hash[0]; e = hash[4];
      temp1 = hash[7]
        + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25))
        + ((e & hash[5]) ^ ((~e) & hash[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (w[i - 16]
          + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3))
          + w[i - 7]
          + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
      temp2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (let i = 0; i < 8; i++) {
    for (let j = 3; j + 1; j--) {
      const b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? 0 : '') + b.toString(16);
    }
  }
  return result;
}

/* ==========================================================
   存储层
   ========================================================== */
const K = {
  shops: 'rent_shops_v1',
  tenants: 'rent_tenants_v1',
  contracts: 'rent_contracts_v1',
  leases: 'rent_leases_v1',
  meta: 'rent_meta_v1',
  tpls: 'rent_tpls_v1',
  pwd: 'rent_pwd_hash',
  sess: 'rent_session',
  remember: 'rent_remember_user'
};
const Store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('本地存储写入失败：' + e.message, 'bad'); return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};

const db = { shops: [], tenants: [], contracts: [], leases: [], meta: {} };

function loadDB() {
  db.shops = Store.get(K.shops, []) || [];
  db.tenants = Store.get(K.tenants, []) || [];
  db.contracts = Store.get(K.contracts, []) || [];
  db.leases = Store.get(K.leases, []) || [];
  db.meta = Store.get(K.meta, {}) || {};
  db.tpls = Store.get(K.tpls, []) || [];
  // 结构兜底，防止老数据缺字段导致渲染中断
  db.shops.forEach(s => {
    s.code = s.code || ''; s.name = s.name || '未命名商铺';
    s.area = num(s.area); s.rent = num(s.rent);
    s.kind = s.kind === 'parking' ? 'parking' : 'shop';
    s.elecNo = s.elecNo || ''; s.waterNo = s.waterNo || '';
  });
  db.contracts.forEach(c => {
    c.rent = num(c.rent); c.deposit = num(c.deposit);
    if (c.rentDay == null) c.rentDay = '';
    if (c.rentMode !== 'fixed' && c.rentMode !== 'varies') c.rentMode = 'varies';
  });
  db.leases.forEach(l => {
    l.rent = num(l.rent);
    if (!Array.isArray(l.payments)) l.payments = [];
    l.payments.forEach(p => { p.amount = num(p.amount); });
  });
}
function saveDB() {
  Store.set(K.shops, db.shops);
  Store.set(K.tenants, db.tenants);
  Store.set(K.contracts, db.contracts);
  Store.set(K.leases, db.leases);
  Store.set(K.meta, db.meta);
  Store.set(K.tpls, db.tpls || []);
}

/* ==========================================================
   业务工具
   ========================================================== */
const shopById = id => db.shops.find(s => s.id === id);
const tenantById = id => db.tenants.find(t => t.id === id);
const contractById = id => db.contracts.find(c => c.id === id);
const leaseById = id => db.leases.find(l => l.id === id);
const isParking = s => !!s && s.kind === 'parking';
const signed = v => (v > 0 ? '+' : v < 0 ? '−' : '');

function leasesOfContract(cid) {
  return db.leases.filter(l => l.contractId === cid).sort((a, b) => String(a.start).localeCompare(String(b.start)));
}
function leasesOfShop(shopId) {
  const cids = db.contracts.filter(c => c.shopId === shopId).map(c => c.id);
  return db.leases.filter(l => cids.indexOf(l.contractId) >= 0)
    .sort((a, b) => String(a.start).localeCompare(String(b.start)));
}
/** 当前（今天）有效的合同：按起止日判断，无重叠 */
function currentContractOfShop(shopId) {
  const t = todayISO();
  return db.contracts.filter(c => c.shopId === shopId && c.start <= t && c.end >= t)
    .sort((a, b) => b.start.localeCompare(a.start))[0];
}
/** 商铺的历史/在租情况 */
function shopState(shopId) {
  const t = todayISO();
  const cur = currentContractOfShop(shopId);
  if (cur) return { k: 'rented', t: '在租' };
  const future = db.contracts.some(c => c.shopId === shopId && c.start > t);
  if (future) return { k: 'future', t: '待起租' };
  const any = db.contracts.some(c => c.shopId === shopId);
  return any ? { k: 'vacant', t: '空置' } : { k: 'none', t: '未签约' };
}
function contractStatus(c) {
  const t = todayISO();
  if (c.start > t) return { k: 'future', t: '未开始', cls: 'b-info' };
  if (c.end < t) return { k: 'ended', t: '已结束', cls: 'b-gray' };
  return { k: 'active', t: '履行中', cls: 'b-ok' };
}
function paidOf(l) { return sum(l.payments || [], p => p.amount); }
function leaseStatus(l) {
  const paid = paidOf(l);
  if (paid >= l.rent - 0.005) return { k: 'paid', t: '已收清', cls: 'b-ok' };
  if (paid > 0.005) return { k: 'part', t: '部分收款', cls: 'b-warn' };
  if (l.end < todayISO()) return { k: 'over', t: '逾期未收', cls: 'b-bad' };
  if (l.start > todayISO()) return { k: 'todo', t: '待收', cls: 'b-gray' };
  return { k: 'unpaid', t: '未收', cls: 'b-gray' };
}
/** 最近一笔收款 / 最近一次缴款日期 */
function lastPayDate(l) {
  const ps = (l.payments || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
  return ps.length ? ps[0].date : '';
}
function shopsOfTenant(tenantId) {
  const ids = db.contracts.filter(c => c.tenantId === tenantId).map(c => c.shopId);
  return db.shops.filter(s => ids.indexOf(s.id) >= 0);
}
function last12(ym) {
  const out = [];
  for (let i = 11; i >= 0; i--) out.push(addMonths(ym, -i));
  return out;
}
/** 年份列表（账期覆盖年份 ∪ 合同覆盖年份 ∪ 当前年起的未来若干年），倒序 */
const FUTURE_YEARS = 6; // 当前年之后额外预留的年数，方便提前登记未来账期
function allYears() {
  const ys = new Set();
  db.leases.forEach(l => { ys.add(Number(String(l.start).slice(0, 4))); ys.add(Number(String(l.end).slice(0, 4))); });
  db.contracts.forEach(c => { ys.add(Number(String(c.start).slice(0, 4))); ys.add(Number(String(c.end).slice(0, 4))); });
  const cy = new Date().getFullYear();
  for (let y = cy + FUTURE_YEARS; y >= cy - 2; y--) ys.add(y);
  return Array.from(ys).filter(y => y > 1990 && !isNaN(y)).sort((a, b) => b - a);
}

/* ==========================================================

   ========================================================== */
const AUTH_USER = 'alonzhang';
const DEFAULT_HASH = '1fb34e66b7b603eefdb51c5a0877a127cd588a5d5a52e42ebb2e7eb521d5585c'; // 'rent$' + 密码
const SALT = 'rent$';
const SESSION_TTL = 7 * 24 * 3600 * 1000;

let failCount = 0, lockUntil = 0, lockTimer = null;

function pwdHash() { return localStorage.getItem(K.pwd) || DEFAULT_HASH; }

function readSession() {
  const raw = sessionStorage.getItem(K.sess) || localStorage.getItem(K.sess);
  if (!raw) return null;
  try {
    const s = JSON.parse(raw);
    if (!s || !s.u || !s.exp) return null;
    if (Date.now() > s.exp) { clearSession(); return null; }
    return s;
  } catch (e) { return null; }
}
function clearSession() {
  sessionStorage.removeItem(K.sess);
  localStorage.removeItem(K.sess);
}

function initLogin() {
  const rem = localStorage.getItem(K.remember);
  if (rem) { $('#loginUser').value = rem; $('#rememberMe').checked = true; }
  $('#loginForm').addEventListener('submit', e => { e.preventDefault(); doLogin(); });
  $('#pwdEye').addEventListener('click', () => {
    const p = $('#loginPwd');
    p.type = p.type === 'password' ? 'text' : 'password';
    $('#pwdEye').style.color = p.type === 'text' ? '#2f6fed' : '#9aa6ba';
  });
  setTimeout(() => { ($('#loginUser').value ? $('#loginPwd') : $('#loginUser')).focus(); }, 60);
}

function doLogin() {
  if (Date.now() < lockUntil) return;
  const un = $('#loginUser').value.trim();
  const pwd = $('#loginPwd').value;
  const err = $('#loginErr');
  err.textContent = '';
  if (!un || !pwd) { err.textContent = '请输入用户名和密码'; return; }
  const okUser = un.toLowerCase() === AUTH_USER;
  const okPwd = sha256(SALT + pwd) === pwdHash();
  if (!okUser || !okPwd) {
    failCount++;
    if (failCount >= 5) { startLock(); return; }
    err.textContent = '用户名或密码错误，还可尝试 ' + (5 - failCount) + ' 次';
    $('#loginPwd').value = '';
    $('#loginPwd').focus();
    return;
  }
  failCount = 0;
  const btn = $('#loginBtn');
  btn.disabled = true; btn.textContent = '登 录 中…';
  const remember = $('#rememberMe').checked;
  const sess = { u: AUTH_USER, name: '阿龙', exp: Date.now() + (remember ? SESSION_TTL : 12 * 3600 * 1000) };
  if (remember) { localStorage.setItem(K.sess, JSON.stringify(sess)); localStorage.setItem(K.remember, un); }
  else { sessionStorage.setItem(K.sess, JSON.stringify(sess)); localStorage.removeItem(K.remember); }
  setTimeout(() => {
    btn.disabled = false; btn.textContent = '登 录';
    enterApp(true);
  }, 260);
}

function startLock() {
  lockUntil = Date.now() + 60000;
  $('#loginBtn').disabled = true;
  $('#loginErr').textContent = '尝试次数过多，请 60 秒后再试';
  clearInterval(lockTimer);
  lockTimer = setInterval(() => {
    const left = Math.ceil((lockUntil - Date.now()) / 1000);
    if (left <= 0) {
      clearInterval(lockTimer); lockUntil = 0; failCount = 0;
      $('#loginBtn').disabled = false; $('#loginErr').textContent = ''; $('#lockTip').textContent = '';
    } else {
      $('#lockTip').textContent = '锁定 ' + left + 's';
    }
  }, 500);
}

/* ==========================================================
   搜索框（独立渲染，输入时只换列表不重建输入框）
   ----------------------------------------------------------
   中文输入法（IME）在拼写阶段输入框处于 composition 状态，
   若此时重建整页 DOM，浏览器会中断组字，拼音/候选字被清空，
   于是「只能输英文/数字，打不出中文」。解决：输入框永不重建，
   仅在其兄弟容器 #srList 内重绘结果。
   ========================================================== */
function searchBoxHTML(id, ph, kw) {
  return `<div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input class="inp" id="${id}" data-search="1" placeholder="${esc(ph)}" autocomplete="off" spellcheck="false" value="${esc(kw || '')}">
    ${kw ? `<button class="search-x" data-act="search-clear" data-for="${id}" title="清空">✕</button>` : ''}
  </div>`;
}
/** 局部重绘：只替换搜索结果区域，输入框本身（含光标、组字状态）保持不动 */
function refreshSearchList() {
  const el = $('#srList');
  if (!el) return false;
  const map = { dash: viewDash, shops: viewShops, tenants: viewTenants, rent: viewRent, parking: viewParking, ledger: viewLedger, report: viewReport, tpls: viewTpls, settings: viewSettings };
  const fn = map[ui.view];
  if (!fn) return false;
  const tmp = document.createElement('div');
  tmp.innerHTML = fn();
  const next = tmp.querySelector('#srList');
  if (!next) return false;

  // 1) 只换列表内容，输入框 DOM 原地不动（关键：IME 组字不被中断）
  el.innerHTML = next.innerHTML;

  // 2) 同步同一卡片内其它依赖 ui 的文字（如「共 N 笔 · 合计 ¥X」），
  //    用文本节点回填，避免整块重建把输入框冲掉
  const card = el.parentNode;
  if (card) {
    // 页面头（page-head）在 card 之外，单独按文本回填
    const pageHead = document.querySelector('.content .page-head p');
    const tmpPageHead = tmp.querySelector('.page-head p');
    if (pageHead && tmpPageHead) pageHead.textContent = tmpPageHead.textContent;

    // 工具栏里的统计文字（收款台账的 .sp）
    const sp = card.querySelector('.toolbar .sp.muted');
    const nsp = tmp.querySelector('.toolbar .sp.muted');
    if (sp && nsp) sp.textContent = nsp.textContent;

    // 其它只读提示（.toolbar 里的 muted small）
    const ms = card.querySelectorAll('.toolbar > .muted');
    const nms = tmp.querySelectorAll('.toolbar > .muted');
    ms.forEach((n, i) => { if (nms[i]) n.textContent = nms[i].textContent; });
  }

  // 3) 同步「清空」按钮显隐（不碰输入框）
  $$('#viewRoot [data-search]').forEach(inp => {
    const box = inp.parentNode;
    const hasX = !!box.querySelector('.search-x');
    if (inp.value && !hasX) {
      const b = document.createElement('button');
      b.className = 'search-x'; b.dataset.act = 'search-clear'; b.dataset.for = inp.id;
      b.title = '清空'; b.textContent = '✕';
      box.appendChild(b);
    } else if (!inp.value && hasX) {
      box.querySelector('.search-x').remove();
    }
  });
  return true;
}

function chartBars(list, unit) {
  const W = 720, H = 250, pl = 58, pr = 14, pt = 16, pb = 30;
  const max = Math.max(1000, ...list.map(d => Math.max(d.due, d.paid)));
  const step = (W - pl - pr) / Math.max(1, list.length);
  const bw = Math.min(16, step * 0.3);
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const y = pt + (H - pt - pb) * i / 4;
    const v = max * (1 - i / 4);
    g += `<line x1="${pl}" y1="${y}" x2="${W - pr}" y2="${y}" stroke="#eef1f7"/>`
      + `<text x="${pl - 8}" y="${y + 4}" text-anchor="end" class="axis">${fmtShort(v)}</text>`;
  }
  list.forEach((d, i) => {
    const cx = pl + step * i + step / 2;
    const hDue = (H - pt - pb) * (d.due / max);
    const hPaid = (H - pt - pb) * (d.paid / max);
    const lb = d.m.length === 7 ? monthName(d.m) : (d.m + '年');
    g += `<rect x="${(cx - bw - 2).toFixed(1)}" y="${(H - pb - hDue).toFixed(1)}" width="${bw}" height="${Math.max(0, hDue).toFixed(1)}" rx="3" fill="#c9dbff"><title>${lb} 应收 ${money(d.due)}</title></rect>`;
    g += `<rect x="${(cx + 2).toFixed(1)}" y="${(H - pb - hPaid).toFixed(1)}" width="${bw}" height="${Math.max(0, hPaid).toFixed(1)}" rx="3" fill="#2f6fed"><title>${lb} 实收 ${money(d.paid)}</title></rect>`;
    g += `<text x="${cx.toFixed(1)}" y="${H - pb + 16}" text-anchor="middle" class="axis">${d.m.length === 7 ? Number(d.m.slice(5)) + '月' : d.m}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="svg-chart" role="img">${g}</svg>`;
}

function viewLedger() {
  let rows = [];

  if (ui.ledgerYear !== 'all') rows = rows.filter(r => String(r.p.date || '').slice(0, 4) === ui.ledgerYear);
  const kw = ui.ledgerKw.trim().toLowerCase();
  if (kw) {
    rows = rows.filter(r => {
      const o = shopOfLease(r.l);
      return ((o.shop.name || '') + (o.shop.code || '') + (o.tenant.name || '') + (r.p.note || '') + (r.l.label || '')).toLowerCase().includes(kw);
    });
  }
  rows.sort((a, b) => String(b.p.date).localeCompare(String(a.p.date)));
  const total = sum(rows, r => r.p.amount);
  const allCount = db.leases.reduce((s, l) => s + (l.payments || []).length, 0);
  let acc = total, running = new Map();

      <tbody>${rows.map(r => {

/* ---------- 报表 ---------- */
function viewReport() {
  const year = String(ui.reportYear);
  const isAll = year === 'all';
  const years = allYears();
  const shopLease = l => { const c = contractById(l.contractId); const s = c && shopById(c.shopId); return s && !isParking(s); };
  const parkLease = l => { const c = contractById(l.contractId); const s = c && shopById(c.shopId); return s && isParking(s); };

  /* ===== 全部年份：按年汇总 ===== */
  if (isAll) {
    /* 只列真正有账期的年份（避免把空年份也铺进报表） */
    const yl = Array.from(new Set(db.leases.map(l => String(l.start).slice(0, 4)))).sort();
    const rows = yl.map(y => {
      const ls = db.leases.filter(l => String(l.start).slice(0, 4) === String(y));
      const sk = ls.filter(shopLease), pk = ls.filter(parkLease);
      const due = sum(sk, l => l.rent), paid = sum(sk, l => paidOf(l));
      return { y: y, n: sk.length, due: due, paid: paid, rate: due ? Math.round(paid / due * 100) : 0,
        pn: pk.length, pdue: sum(pk, l => l.rent), ppaid: sum(pk, l => paidOf(l)) };
    });
    const tDue = rows.reduce((a, r) => a + r.due, 0), tPaid = rows.reduce((a, r) => a + r.paid, 0);
    const tPn = rows.reduce((a, r) => a + r.pn, 0), tPDue = rows.reduce((a, r) => a + r.pdue, 0), tPPaid = rows.reduce((a, r) => a + r.ppaid, 0);
    // 商铺收益（全部年份累计）
    const byShop = {};
    db.leases.filter(shopLease).forEach(l => {
      const c = contractById(l.contractId), s = shopById(c.shopId);
      byShop[s.id] = byShop[s.id] || { paid: 0, due: 0, s: s };
      byShop[s.id].paid += paidOf(l); byShop[s.id].due += l.rent;
    });
    const shopList = Object.keys(byShop).map(k => byShop[k]).sort((a, b) => b.paid - a.paid);
    const maxShop = Math.max(1, ...shopList.map(r => r.paid));
    const chartYears = rows.filter(r => r.due > 0 || r.paid > 0).slice(-10);

    return `
    <div class="page-head">
      <div><h2>报表</h2><p>全部年份 · 商铺协议租金 ${money(tDue)} · 实收 ${money(tPaid)} · 收缴率 ${tDue ? Math.round(tPaid / tDue * 100) : 0}%${tPDue ? ' ｜ 车位 ' + money(tPPaid) : ''}</p></div>
      <div class="head-actions">
        <select class="inp" id="reportYear">
          <option value="all" selected>全部年份</option>
          ${years.map(y => `<option value="${y}">${y} 年</option>`).join('')}
        </select>
        <button class="btn" data-act="export-year">导出全部报表</button>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-h"><h3>历年收缴</h3>
          <div class="legend"><span class="lg-due">协议租金</span><span class="lg-paid">实收</span></div>
        </div>
        <div class="chart">${chartYears.length ? chartBars(chartYears.map(r => ({ m: String(r.y), due: r.due, paid: r.paid }))) : '<div class="empty">暂无数据</div>'}</div>
      </div>
      <div class="card">
        <div class="card-h"><h3>商铺收益</h3><span class="muted small">全部年份累计实收</span></div>
        <div class="card-b" style="padding-top:8px">
          ${shopList.length === 0 ? '<div class="empty">暂无数据</div>' : shopList.map(r => `
            <div style="padding:9px 0">
              <div style="display:flex;font-size:12.5px"><b style="font-weight:600">${esc(r.s.name)}</b><span class="muted" style="margin-left:6px">${esc(r.s.code || '')}</span><b style="margin-left:auto;font-variant-numeric:tabular-nums">${money(r.paid)}</b></div>
              <div style="height:6px;border-radius:4px;background:#eef2f9;margin-top:7px;overflow:hidden"><div style="height:100%;width:${Math.max(2, Math.round(r.paid / maxShop * 100))}%;background:linear-gradient(90deg,#2f6fed,#5b9bff);border-radius:4px"></div></div>
            </div>`).join('')}
          ${tPDue ? `<div class="kv" style="margin-top:10px"><span>住宅车位（单列）</span><b>${money(tPPaid)} / ${money(tPDue)}</b></div>` : ''}
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="card-h"><h3>逐年明细</h3><span class="muted small">按账期起始年归属 · 车位单列 · 收缴率超 100% 表示提前预收了次年租金</span></div>

        <tbody>
          ${rows.map(r => `<tr>
            <td><b>${r.y}</b> 年</td>

            <td class="num">${r.paid ? money(r.paid) : '—'}</td>
            <td class="num" style="color:${r.due - r.paid > 0.005 ? 'var(--bad)' : 'var(--muted)'}">${r.due - r.paid > 0.005 ? money(r.due - r.paid) : (r.paid - r.due > 0.005 ? '<span title="含提前预收下一年度租金">预收 ' + money(r.paid - r.due) + '</span>' : '—')}</td>
            <td class="num">${r.due ? `<span title="${r.paid - r.due > 0.005 ? '超过 100% 是因为提前预收了下一年度租金' : ''}">${r.rate}%</span>` : '—'}</td>
            <td class="num">${r.ppaid ? money(r.ppaid) : '—'}</td>

            <td class="num">${money(tPPaid)}</td>
          </tr>
        </tbody>
      </table></div>
    </div>`;
  }

  /* ===== 单一年份 ===== */
  const rows = [];
  let yDue = 0, yPaid = 0;
  for (let m = 1; m <= 12; m++) {
    const pre = year + '-' + pad2(m);
    const ls = db.leases.filter(l => String(l.start).slice(0, 7) === pre && shopLease(l));
    const due = sum(ls, l => l.rent), paid = sum(ls, l => paidOf(l));

  db.leases.forEach(l => {

      <button class="btn" data-act="export-year">导出年度报表</button>

  <div class="grid-2">
    <div class="card">
      <div class="card-h"><h3>${year} 年逐月收缴</h3>
        <div class="legend"><span class="lg-due">协议租金</span><span class="lg-paid">实收</span></div>
      </div>
      <div class="chart">${chartBars(rows.map(r => ({ m: year + '-' + pad2(r.m), due: r.due, paid: r.paid })))}</div>
    </div>
    <div class="card">
      <div class="card-h"><h3>商铺收益</h3><span class="muted small">${year} 年实收</span></div>
      <div class="card-b" style="padding-top:8px">
        ${shopList.length === 0 ? '<div class="empty">该年度暂无数据</div>' : shopList.map(r => `
          <div style="padding:9px 0">
            <div style="display:flex;font-size:12.5px"><b style="font-weight:600">${esc(r.s.name)}</b><span class="muted" style="margin-left:6px">${esc(r.s.code || '')}</span><b style="margin-left:auto;font-variant-numeric:tabular-nums">${money(r.paid)}</b></div>
            <div style="height:6px;border-radius:4px;background:#eef2f9;margin-top:7px;overflow:hidden"><div style="height:100%;width:${Math.max(2, Math.round(r.paid / maxShop * 100))}%;background:linear-gradient(90deg,#2f6fed,#5b9bff);border-radius:4px"></div></div>
          </div>`).join('')}
        ${parkDue ? `<div class="kv" style="margin-top:10px"><span>住宅车位（单列）</span><b>${money(parkPaid)} / ${money(parkDue)}</b></div>` : ''}

  <div class="card" style="margin-top:16px">

    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>月份</th><th class="num">账期数</th><th class="num">协议租金</th><th class="num">实收</th><th class="num">未收</th><th class="num">收缴率</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td>${r.m} 月</td>

/* ==========================================================
   弹窗基础
   ----------------------------------------------------------
   关闭策略（防误触丢数据）：
   · 点击遮罩空白处 —— 不关闭（只轻微抖动提示），必须点「取消 / ✕」
   · 表单有未保存改动时点「取消 / ✕ / Esc」—— 二次确认后才关闭
   · 确认类弹窗（confirmDialog）允许点遮罩关闭（本就是危险操作的二次确认）
   ========================================================== */
let modalSnapshot = null;   // 打开时的表单快照，用于判断是否有未保存改动
let modalCancelHook = null; // 取消确认时用于还原原界面的回调

/** 采集当前弹窗的可编辑控件值，作为「是否改动过」的比对依据 */
function snapshotModal() {
  const out = {};
  $$('#modalRoot .m-body input, #modalRoot .m-body select, #modalRoot .m-body textarea').forEach((el, i) => {
    if (el.type === 'checkbox' || el.type === 'radio') return;
    out[el.id || ('#' + i + el.tagName)] = el.value;
  });
  return out;
}
function modalDirty() {
  if (!modalSnapshot) return false;
  const now = snapshotModal();
  const keys = Object.keys(now);
  for (let i = 0; i < keys.length; i++) {
    const k = keys[i];
    if (modalSnapshot[k] !== undefined && modalSnapshot[k] !== now[k]) return true;
  }
  return false;
}

function openModal(html, opts) {
  opts = opts || {};
  const root = $('#modalRoot');
  const cls = (opts.wide ? 'wide' : '') + (opts.full ? ' full' : '');
  root.innerHTML = `<div class="mask" data-mask="1"><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  const mask = root.querySelector('[data-mask]');
  mask.addEventListener('mousedown', e => {
    // 只有「按下和松开都在遮罩上」才算真正的外部点击，避免在弹窗内拖拽选字松手到外面被误判
    mask._downOnSelf = e.target === mask;
  });
  mask.addEventListener('click', e => {
    if (e.target !== mask || !mask._downOnSelf) { mask._downOnSelf = false; return; }
    mask._downOnSelf = false;
    if (opts.dismissible) { closeModal(); return; }
    nudgeModal();   // 表单类弹窗：不关闭，只抖动提示
  });
  document.addEventListener('keydown', modalKeys);
  const first = root.querySelector('.m-body input:not([readonly]),.m-body select,.m-body textarea');
  if (first) setTimeout(() => first.focus(), 40);
  modalSnapshot = opts.noTrack ? null : snapshotModal();
  modalCancelHook = opts.onCancel || null;
}
/** 遮罩误触时给点反馈：弹窗轻微抖动 */
function nudgeModal() {
  const m = $('#modalRoot .modal');
  if (!m) return;
  m.classList.remove('nudge');
  void m.offsetWidth;
  m.classList.add('nudge');
  toast('点「取消」或右上角 ✕ 才会关闭');
}
/**
 * 把弹窗当前状态序列化为 HTML 字符串（用于「取消确认」后原样还原）
 * 注意：input/textarea 的实时输入值不会体现在 outerHTML 里，
 * 必须先同步回 value 属性，否则还原后填写的内容全丢。
 */
function serializeModal() {
  const box = $('#modalRoot .modal');
  if (!box) return '';
  const clone = box.cloneNode(true);
  // 用实时值覆盖克隆体的属性
  const live = box.querySelectorAll('input, textarea, select');
  const copy = clone.querySelectorAll('input, textarea, select');
  live.forEach((src, i) => {
    const dst = copy[i];
    if (!dst) return;
    if (src.tagName === 'SELECT') {
      Array.prototype.forEach.call(dst.options, o => { o.selected = (o.value === src.value); });
      dst.setAttribute('data-v', src.value);
    } else if (src.type === 'checkbox' || src.type === 'radio') {
      if (src.checked) dst.setAttribute('checked', 'checked'); else dst.removeAttribute('checked');
    } else if (src.tagName === 'TEXTAREA') {
      dst.textContent = src.value;
    } else {
      dst.setAttribute('value', src.value);
    }
  });
  return clone.outerHTML;
}
/** 「取消」语义的关闭：✕ / 取消 / 关闭 / Esc —— 有未保存改动则二次确认，并执行还原回调 */
function cancelModal() {
  if (modalSnapshot && modalDirty()) {
    const scene = {
      html: serializeModal(),
      snapshot: modalSnapshot,
      focusId: (document.activeElement && document.activeElement.id) || '',
      selStart: (document.activeElement && (document.activeElement.selectionStart || 0)) || 0
    };
    const hook = modalCancelHook;
    modalSnapshot = null;
    // 确认框里的「取消」= 回到原表单继续填，不执行外层还原回调
    confirmDialog('放弃填写？', '当前表单有<b>尚未保存</b>的修改，关闭后这些内容会丢失。', () => {
      modalSnapshot = null; modalCancelHook = null; doCloseModal();
      if (hook) hook();
    }, '放弃并关闭', true, () => restoreModalScene(scene));
    return;
  }
  modalSnapshot = null;
  const hook = modalCancelHook;
  modalCancelHook = null;
  doCloseModal();
  if (hook) hook();
}
/** 关闭前的守卫：表单有未保存改动时二次确认；传 true 直接关闭（保存后调用） */
function closeModal(force) {
  if (force === true) { modalSnapshot = null; modalCancelHook = null; doCloseModal(); return; }
  cancelModal();
}
/** 从确认框「取消」时，把原来的表单原样放回来（含已填内容与光标位置） */
function restoreModalScene(scene) {
  doCloseModal();               // 先清掉确认框，否则快照采集会抓到确认框的控件
  const root = $('#modalRoot');
  root.innerHTML = `<div class="mask" data-mask="1">${scene.html}</div>`;
  const mask = root.querySelector('[data-mask]');
  mask.addEventListener('mousedown', e => { mask._downOnSelf = e.target === mask; });
  mask.addEventListener('click', e => {
    if (e.target !== mask || !mask._downOnSelf) { mask._downOnSelf = false; return; }
    mask._downOnSelf = false;
    nudgeModal();
  });
  document.addEventListener('keydown', modalKeys);
  // 还原后仍以「原始快照」为基准，这样第二次点取消依然会提示未保存
  modalSnapshot = scene.snapshot;
  modalCancelHook = null;
  if (scene.focusId) {
    const el = $('#' + scene.focusId);
    if (el && el.focus) { el.focus(); try { el.setSelectionRange(scene.selStart, scene.selStart); } catch (err) { } }
  }
}
function doCloseModal() {
  $('#modalRoot').innerHTML = '';
  document.removeEventListener('keydown', modalKeys);
}
function modalKeys(e) {
  if (e.key === 'Escape') { cancelModal(); return; }
  if (e.key === 'Enter' && e.target && /^(INPUT|SELECT)$/.test(e.target.tagName)) {
    const btn = $('#modalRoot .m-foot [data-enter]');
    if (btn) { e.preventDefault(); btn.click(); }
  }
}
/**
 * 通用确认框
 * @param onOk     点确认后执行
 * @param okText   确认按钮文字
 * @param danger   是否危险操作（红色按钮）；传 false 时用主色
 * @param onCancel 点取消/✕/遮罩后执行（用于还原被覆盖的界面）
 */
function confirmDialog(title, msg, onOk, okText, danger, onCancel) {
  openModal(`
    <div class="m-head"><h3>${esc(title)}</h3><button class="m-x" data-close="1">✕</button></div>
    <div class="m-body"><div style="font-size:13.5px;line-height:1.9">${msg}</div></div>
    <div class="m-foot">
      <button class="btn" data-close="1">取消</button>
      <button class="btn ${danger === false ? 'btn-primary' : 'btn-danger'}" id="confirmOk" data-enter="1">${esc(okText || '确认')}</button>
    </div>`, { dismissible: true, noTrack: true, onCancel: onCancel });
  $('#confirmOk').addEventListener('click', () => { doCloseModal(); modalSnapshot = null; onOk(); });
}

  if (!tenantId) return toast('请选择租户', 'bad');
  if (!start || !end) return toast('请填写起止日期', 'bad');
  if (start > end) return toast('到期日不能早于起租日', 'bad');
  const overlap = db.contracts.find(c => c.id !== id && c.shopId === shopId && c.start <= end && c.end >= start);
  if (overlap) return toast('该商铺在所选期间已有合同（' + overlap.start + ' ~ ' + overlap.end + '）', 'bad');

  const data = {
    shopId: shopId, tenantId: tenantId, start: start, end: end,
    deposit: deposit, rentMode: rentMode, rent: rent, rentDay: rentDay,
    remark: $('#c_note').value.trim()
  };

}

/* ==========================================================
   合同正文（范本库 + 已签合同正文）
   ----------------------------------------------------------
   db.tpls[]   范本库：{id,key,name,shop,note,fields[{k,label,v}],body,updatedAt}
   db.contracts[].fields / .body / .tplName  已签合同套用的字段与正文
   正文里用 {{字段key}} 占位，渲染时替换为字段值
   ========================================================== */
/** 首次运行把 seed 里的两份 Word 合同灌入范本库（只做一次，之后以库内版本为准） */
function loadTpls(force) {
  const src = window.CONTRACT_TPL || [];
  if (!src.length) return;
  const ver = 20261017;
  if (!force && db.meta && db.meta.tplVer === ver) return;
  db.tpls = src.map(t => ({
    id: uid('tpl'), key: t.key, name: t.name, shop: t.shop, note: t.note,
    fields: t.fields.map(f => ({ k: f.k, label: f.label, v: f.v })),
    body: t.body, createdAt: todayISO(), updatedAt: todayISO()
  }));
  db.meta = db.meta || {}; db.meta.tplVer = ver;
  // 给两份现行合同自动关联范本并生成正文（面包店=A座范本，美甲店=B座范本）
  const link = [['面包', 'tpl-A'], ['美甲', 'tpl-B']];
  db.contracts.forEach(c => {
    if (c.body) return;
    const t = tenantById(c.tenantId); if (!t) return;
    const hit = link.find(x => String(t.name).indexOf(x[0]) >= 0); if (!hit) return;
    const tpl = (db.tpls || []).find(x => x.key === hit[1]); if (!tpl) return;
    c.tplId = tpl.id; c.tplName = tpl.name;
    c.fields = fieldsForContract(tpl, c);
    c.body = tpl.body;
  });
  saveDB();
}
function tplById(id) { return (db.tpls || []).find(t => t.id === id) || null; }
/** 把 {{key}} 替换成字段值；未填的关键字段保留高亮空位便于发现 */
function renderBody(body, fields, opts) {
  opts = opts || {};
  const map = {};
  (fields || []).forEach(f => { map[f.k] = f.v == null ? '' : String(f.v); });
  return String(body || '').replace(/\{\{\s*([\w\u4e00-\u9fa5]+)\s*\}\}/g, (m, k) => {
    const v = map[k];
    if (v !== undefined && v !== '') return v;
    return opts.blank ? '______' : '<span class="tpl-blank">' + esc(k) + '</span>';
  });
}
/** 「2026-11-30」→「2026年11月30日」 */
function cnDate(iso) {
  const p = String(iso || '').split('-');
  if (p.length !== 3) return iso || '';
  return p[0] + '年' + Number(p[1]) + '月' + Number(p[2]) + '日';
}
/** 用范本 + 合同信息生成字段表（未填的自动从合同/租户/商铺带出） */
function fieldsForContract(tpl, c) {
  const tenant = c ? (tenantById(c.tenantId) || {}) : {};
  const shop = c ? (shopById(c.shopId) || {}) : {};
  return (tpl.fields || []).map(f => {
    // 先做通用占位符替换，再按字段 key 用合同真实数据覆盖
    let v = String(f.v == null ? '' : f.v)
      .replace(/\{\{\s*租户\s*\}\}/g, tenant.name || '')
      .replace(/\{\{\s*租户电话\s*\}\}/g, tenant.phone || '')
      .replace(/\{\{\s*起租日\s*\}\}/g, c ? cnDate(c.start) : '')
      .replace(/\{\{\s*到期日\s*\}\}/g, c ? cnDate(c.end) : '')
      .replace(/\{\{\s*签约日期\s*\}\}/g, cnDate(todayISO()));
    if (f.k === 'tenantName' && c) v = tenant.name || v;
    if (f.k === 'tenantPhone' && tenant.phone) v = tenant.phone;
    if (f.k === 'start' && c) v = cnDate(c.start);
    if (f.k === 'end' && c) v = cnDate(c.end);
    if (f.k === 'elecNo' && shop.elecNo) v = shop.elecNo;
    if (f.k === 'waterNo' && shop.waterNo) v = shop.waterNo;
    return { k: f.k, label: f.label, v: v };
  });
}

/** 把正文渲染为 HTML 段落：{{字段}} 替换 + 空字段高亮 */
function bodyToHtml(body, fields) {
  const map = {};
  (fields || []).forEach(f => { map[f.k] = f.v == null ? '' : String(f.v); });
  // 兜底：字段值本身还是 {{xxx}} 时，按中文别名解析（{{租户}}→tenantName，{{起租日}}→start…）
  const alias = { '租户': 'tenantName', '租户电话': 'tenantPhone', '起租日': 'start', '到期日': 'end' };
  Object.keys(map).forEach(k => {
    map[k] = map[k].replace(/\{\{\s*([\w\u4e00-\u9fa5]+)\s*\}\}/g, (mm, kk) => {
      if (kk === '签约日期') return cnDate(todayISO());
      const target = alias[kk] || kk;
      if (target && target !== k && map[target] !== undefined && !/\{\{/.test(map[target])) return map[target];
      return '';
    });
  });
  return String(body || '').split(/\n/).map(line => {
    const raw = line.replace(/\s+$/, '');
    if (!raw.trim()) return '<div class="doc-blank"></div>';
    // 逐段转义，同时把 {{k}} 替换成高亮空位或实际值
    let out = '', last = 0;
    const re = /\{\{\s*([\w\u4e00-\u9fa5]+)\s*\}\}/g; let m;
    while ((m = re.exec(raw))) {
      out += esc(raw.slice(last, m.index));
      const v = map[m[1]];
      // 未定义或为空的占位符 → 下划线空位（鼠标悬停显示字段名）
      out += (v !== undefined && v !== '') ? esc(v)
        : '<i class="tpl-blank" title="未填写：' + esc(m[1]) + '">______</i>';
      last = m.index + m[0].length;
    }
    out += esc(raw.slice(last));
    const indent = /^[\s\u3000]/.test(raw);
    const isTitle = /^商铺租赁合同$|^房[屋产]租赁合同$/.test(raw.trim());
    return '<div class="doc-line' + (indent ? ' ind' : '') + (isTitle ? ' doc-title' : '') + '">' + out.replace(/^[\s\u3000]+/, '') + '</div>';
  }).join('');
}

  if (!contractId) return todayISO();

    .sort((a, b) => String(a.end).localeCompare(String(b.end)));
  if (ls.length) return addDays(ls[ls.length - 1].end, 1);
  const c = contractById(contractId);
  return (c && c.start) || todayISO();

/* ==========================================================
   收据打印
   ========================================================== */
function rmbUpper(n) {
  const D = '零壹贰叁肆伍陆柒捌玖';
  const U = ['', '拾', '佰', '仟'];
  const B = ['', '万', '亿'];
  let v = Math.round(num(n) * 100) / 100;
  if (!isFinite(v) || v < 0) return '';
  let int = Math.floor(v);
  const dec = Math.round((v - int) * 100);
  let intStr = '';
  if (int === 0) intStr = '零';
  else {
    let gi = 0;
    while (int > 0) {
      let part = int % 10000, ps = '', zero = false, first = true;
      let p = part, idx = 0;
      while (p > 0) {
        const d = p % 10;
        if (d === 0) { zero = true; }
        else {
          ps = D[d] + U[idx] + (zero && !first ? '零' : '') + ps;
          zero = false;
        }
        first = false;
        p = Math.floor(p / 10); idx++;
      }
      if (ps) intStr = ps + B[gi] + (intStr && part < 1000 ? '零' : '') + intStr;
      int = Math.floor(int / 10000); gi++;
    }
  }
  let decStr = '';
  if (dec > 0) {
    const jiao = Math.floor(dec / 10), fen = dec % 10;
    decStr = (jiao ? D[jiao] + '角' : (int > 0 ? '零' : '')) + (fen ? D[fen] + '分' : (jiao ? '整' : ''));
    if (fen === 0 && jiao) decStr = D[jiao] + '角整';
  } else {
    decStr = '整';
  }
  return '人民币' + intStr + '元' + decStr;
}

/* ==========================================================
   导出 / 导入
   ========================================================== */
function download(name, content, mime) {
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 600);
}
function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(head, rows, name) {
  const csv = '\ufeff' + [head].concat(rows).map(r => r.map(csvCell).join(',')).join('\r\n');
  download(name, csv, 'text/csv');
}
function exportRentCSV() {
  const y = String(ui.ym), all = y === 'all';
  let list = db.leases.filter(l => all || String(l.start).slice(0, 4) === y)
    .filter(l => { const c = contractById(l.contractId); return c && !isParking(shopById(c.shopId)); })
    .sort((a, b) => String(a.start).localeCompare(String(b.start)));
  if (ui.scope !== 'all') list = list.filter(l => l.contractId === ui.scope);
  if (!list.length) return toast(all ? '没有账期可导出' : '该年度没有账期可导出', 'bad');
  const rows = list.map(l => {
    const o = shopOfLease(l);
    return [o.shop.code || '', o.shop.name || '', o.tenant.name || '', l.label, l.start, l.end, l.rent, paidOf(l), (l.rent - paidOf(l)).toFixed(2), lastPayDate(l), leaseStatus(l).t];
  });
  toCSV(['商铺编号', '商铺', '租户', '账期', '起始日', '结束日', '协议租金', '实收', '未收', '最近收款', '状态'], rows, '租金登记_' + (all ? '全部' : y) + '.csv');
  toast('已导出 ' + list.length + ' 个账期', 'ok');
}
function exportLedgerCSV() {
  const rows = [];
  db.leases.forEach(l => (l.payments || []).forEach(p => {
    if (ui.ledgerYear !== 'all' && String(p.date).slice(0, 4) !== String(ui.ledgerYear)) return;
    const o = shopOfLease(l);
    rows.push([p.date, o.shop.code || '', o.shop.name || '', o.tenant.name || '', l.label, p.amount, p.method || '', p.note || '']);
  }));
  if (!rows.length) return toast('没有可导出的收款记录', 'bad');
  rows.sort((a, b) => String(a[0]).localeCompare(String(b[0])));
  toCSV(['收款日期', '商铺编号', '商铺', '租户', '账期', '金额', '收款方式', '备注'], rows, '收款台账_' + (ui.ledgerYear === 'all' ? '全部' : ui.ledgerYear) + '.csv');
  toast('已导出 ' + rows.length + ' 笔收款', 'ok');
}
function exportYearCSV() {
  /* 判定是否商铺账期（排除住宅车位） */
  const isShopLease = l => {
    const c = contractById(l.contractId);
    return !!c && !isParking(shopById(c.shopId));
  };
  const isParkLease = l => {
    const c = contractById(l.contractId);
    return !!c && isParking(shopById(c.shopId));
  };
  const rateOf = (due, paid) => due ? Math.round(paid / due * 100) + '%' : '-';

  if (String(ui.reportYear) === 'all') {
    /* 全部年份：逐年汇总 */
    const ys = {};
    db.leases.forEach(l => {
      const y = String(l.start).slice(0, 4);
      if (!ys[y]) ys[y] = { n: 0, due: 0, paid: 0, park: 0 };
      if (isShopLease(l)) { ys[y].n++; ys[y].due += num(l.rent); ys[y].paid += paidOf(l); }
      else if (isParkLease(l)) { ys[y].park += paidOf(l); }
    });
    const years = Object.keys(ys).filter(y => ys[y].n || ys[y].park).sort((a, b) => a.localeCompare(b));
    if (!years.length) return toast('没有可导出的账期', 'bad');
    const head = ['年份', '账期数', '协议租金', '实收', '未收', '收缴率', '车位实收'];
    const rows = years.map(y => {
      const o = ys[y];
      return [y, o.n, o.due.toFixed(2), o.paid.toFixed(2), (o.due - o.paid).toFixed(2), rateOf(o.due, o.paid), o.park.toFixed(2)];
    });
    const tN = sum(years, y => ys[y].n), tDue = sum(years, y => ys[y].due);
    const tPaid = sum(years, y => ys[y].paid), tPark = sum(years, y => ys[y].park);
    rows.push(['合计', tN, tDue.toFixed(2), tPaid.toFixed(2), (tDue - tPaid).toFixed(2), rateOf(tDue, tPaid), tPark.toFixed(2)]);
    toCSV(head, rows, '收租年度报表_全部年份.csv');
    return toast('已导出 ' + years.length + ' 个年度汇总', 'ok');
  }

  const y = String(ui.reportYear);
  const head = ['月份', '账期数', '协议租金', '实收', '未收', '收缴率'];
  const rows = [];
  for (let m = 1; m <= 12; m++) {
    const pre = y + '-' + pad2(m);
    const ls = db.leases.filter(l => String(l.start).slice(0, 7) === pre && isShopLease(l));
    const due = sum(ls, l => l.rent), paid = sum(ls, l => paidOf(l));
    rows.push([m + '月', ls.length, due, paid, (due - paid).toFixed(2), rateOf(due, paid)]);
  }
  toCSV(head, rows, '收租年度报表_' + y + '.csv');
  toast('已导出 ' + y + ' 年报表', 'ok');
}
function exportJSON() {
  const data = {
    shops: db.shops, tenants: db.tenants, contracts: db.contracts, leases: db.leases,
    tpls: db.tpls || [], meta: db.meta
  };
  download('商铺收租备份_' + todayISO() + '.json', JSON.stringify({ app: 'shop-rent', version: 3, exportedAt: new Date().toISOString(), data: data }, null, 2), 'application/json');
  toast('备份已导出（含合同范本 ' + (db.tpls || []).length + ' 份）', 'ok');
}
function importJSON() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const j = JSON.parse(r.result);
        const d = j.data || j;
        if (!d || !Array.isArray(d.shops) || !Array.isArray(d.contracts)) throw new Error('文件格式不正确');
        confirmDialog('导入备份', `将覆盖当前全部数据：<br>商铺 ${d.shops.length} 个、租户 ${(d.tenants || []).length} 位、合同 ${d.contracts.length} 份、账期 ${(d.leases || []).length} 个、合同范本 ${(d.tpls || []).length} 份。<br><br>确定继续？`, () => {
          db.shops = d.shops || []; db.tenants = d.tenants || [];
          db.contracts = d.contracts || []; db.leases = d.leases || []; db.meta = d.meta || {};
          if (Array.isArray(d.tpls)) db.tpls = d.tpls;
          loadDBNormalize(); saveDB();
          ui.ym = 'all'; ui.parkYear = 'all'; ui.ledgerYear = 'all'; ui.reportYear = 'all'; ui.scope = 'all';
          renderView();
          toast('备份导入成功', 'ok');
        }, '确认导入');
      } catch (e) { toast('导入失败：' + e.message, 'bad'); }
    };
    r.readAsText(f, 'utf-8');
  };
  inp.click();
}

/* ==========================================================
   原始数据载入（来自 商铺租金记录表.xlsx）
   ========================================================== */
function loadSeed(force) {
  const S = window.SEED;
  if (!S) return false;
  if (!force && db.meta && db.meta.seedVer === window.SEED_VER) return false;
  const shopId = {}, tenantId = {}, contractId = {};
  db.shops = S.shops.map(s => {
    const id = uid('s'); shopId[s.code] = id;
    return Object.assign({ id: id, createdAt: todayISO() }, s);
  });
  db.tenants = S.tenants.map(t => {
    const id = uid('t'); tenantId[t.name] = id;
    return Object.assign({ id: id, createdAt: todayISO() }, t);
  });
  db.contracts = S.contracts.map(c => {
    const id = uid('c'); contractId[c.key] = id;
    return {
      id: id, shopId: shopId[c.shop], tenantId: tenantId[c.tenant], start: c.start, end: c.end,
      rent: c.rent, deposit: c.deposit, rentDay: c.rentDay, rentMode: c.rent ? 'fixed' : 'varies',
      remark: c.remark || '', createdAt: todayISO()
    };
  });
  db.leases = S.leases.map(l => ({
    id: uid('l'), contractId: contractId[l.contract], label: l.label, start: l.start, end: l.end,
    rent: l.rent, note: '',
    payments: (l.payments || []).map(p => ({ id: uid('p'), date: p[0], amount: p[1], method: p[2], note: '' })),
    createdAt: todayISO()
  }));
  db.meta = { seedVer: window.SEED_VER, seededAt: new Date().toISOString() };
  saveDB();
  return true;
}
function loadDBNormalize() {
  db.shops.forEach(s => {
    s.code = s.code || ''; s.name = s.name || '未命名';
    s.area = num(s.area); s.rent = num(s.rent);
    s.kind = s.kind === 'parking' ? 'parking' : 'shop';
    s.elecNo = s.elecNo || ''; s.waterNo = s.waterNo || '';
  });
  db.leases.forEach(l => {
    l.rent = num(l.rent); if (!Array.isArray(l.payments)) l.payments = [];
    l.payments.forEach(p => { p.amount = num(p.amount); });
  });
}

function onNavClick(e) {

function onViewClick(e) {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch (act) {
    case 'go': switchView(b.dataset.view); break;
    case 'go-rent': {
      /* 跳到该合同自己的账期：直接按合同起始年定位，避免"全部年份"下翻找不到 */
      const c = contractById(id);
      ui.scope = id;
      if (c && c.start) ui.ym = String(c.start).slice(0, 4);
      switchView('rent'); break;
    }
    case 'go-rent-all': {
      ui.scope = 'all'; ui.ym = 'all'; switchView('rent'); break;
    }
    case 'rent-all': {
      ui.scope = 'all'; ui.ym = 'all'; switchView('rent'); break;
    }
    case 'shop-add': shopModal(); break;
    case 'shop-edit': shopModal(id); break;
    case 'shop-del': {
      const s = shopById(id); if (!s) return;
      const cids = db.contracts.filter(c => c.shopId === id).map(c => c.id);
      confirmDialog('删除' + (isParking(s) ? '车位' : '商铺'), `确定删除「${esc(s.name)}」？<br>其合同与全部账期、收款记录也会一并删除，且不可恢复。`, () => {
        db.leases = db.leases.filter(l => cids.indexOf(l.contractId) < 0);
        db.contracts = db.contracts.filter(c => c.shopId !== id);
        db.shops = db.shops.filter(x => x.id !== id);
        saveDB(); renderView(); toast('已删除', 'ok');
      });
      break;
    }
    case 'tenant-add': tenantModal(); break;
    case 'tenant-edit': tenantModal(id); break;
    case 'tenant-del': {
      const t = tenantById(id); if (!t) return;
      if (db.contracts.some(c => c.tenantId === id)) return toast('该租户还有合同，请先删除合同', 'bad');
      confirmDialog('删除租户', `确定删除「${esc(t.name)}」？`, () => {
        db.tenants = db.tenants.filter(x => x.id !== id);
        saveDB(); renderView(); toast('已删除', 'ok');
      });
      break;
    }
    case 'contract-add': contractModal(null, b.dataset.shop); break;
    case 'contract-edit': contractModal(id); break;
    case 'contract-doc': contractDocModal(id); break;
    case 'tpl-add': tplAddModal(); break;
    case 'tpl-edit': bodyModal(id, ''); break;
    case 'tpl-use': tplUseModal(id); break;
    case 'tpl-del': {
      const t = tplById(id); if (!t) return;
      confirmDialog('删除范本', `确定删除范本「${esc(t.name)}」？<br>已签合同里的正文不受影响。`, () => {
        db.tpls = db.tpls.filter(x => x.id !== id);
        saveDB(); renderView(); toast('范本已删除', 'ok');
      });
      break;
    }
    case 'tpl-reset': {
      confirmDialog('恢复 Word 原版', '将用两份 Word 合同覆盖现有范本正文，已做过的修改会丢失（已签合同的正文不受影响）。', () => {
        loadTpls(true); renderView(); toast('已恢复为 Word 原版', 'ok');
      });
      break;
    }
    case 'contract-del': {
      const c = contractById(id); if (!c) return;
      const n = db.leases.filter(l => l.contractId === id).length;
      confirmDialog('删除合同', `确定删除该合同？<br>将同时删除其 ${n} 个账期及全部收款记录。`, () => {
        db.leases = db.leases.filter(l => l.contractId !== id);
        db.contracts = db.contracts.filter(x => x.id !== id);
        saveDB(); renderView(); toast('合同已删除', 'ok');
      });
      break;
    }
    case 'lease-add': leaseModal(null, b.dataset.contract, !!b.dataset.park); break;
    case 'lease-edit': leaseModal(id); break;
    case 'lease-del': {
      const l = leaseById(id); if (!l) return;
      confirmDialog('删除账期', `确定删除账期「${esc(l.label)}」？<br>该账期下的 ${(l.payments || []).length} 笔收款记录也会删除。`, () => {
        db.leases = db.leases.filter(x => x.id !== id);
        saveDB(); renderView(); toast('已删除', 'ok');
      });
      break;
    }
    case 'lease-pay': payModal(id); break;
    case 'rent-scope': ui.scope = b.dataset.f; renderView(); break;
    case 'search-clear': {
      const f = b.dataset.for;
      if (f === 'shopSearch') ui.shopKw = '';
      else if (f === 'ledgerKw') ui.ledgerKw = '';
      const inp = $('#' + f);
      if (inp) { inp.value = ''; inp.focus(); }
      if (!refreshSearchList()) renderView();
      break;
    }
    case 'export-rent': exportRentCSV(); break;
    case 'export-ledger': exportLedgerCSV(); break;
    case 'export-year': exportYearCSV(); break;
    case 'export-json': exportJSON(); break;
    case 'import-json': importJSON(); break;
    case 'pwd-modal': passwordModal(); break;
    case 'vault-pwd': if (window.RentVault) window.RentVault.changePassword(); break;

function onModalClick(e) {
  /* 关闭类按钮（✕ / 取消 / 关闭）：属于「取消」语义，先走还原回调再关闭 */
  const cl = e.target.closest('[data-close]');
  if (cl) { cancelModal(); return; }
  const del = e.target.closest('[data-act="payment-del"]');
  if (del) {
    const l = leaseById(del.dataset.id);
    if (!l) return;
    const pid = del.dataset.pid;
    l.payments = (l.payments || []).filter(p => p.id !== pid);
    saveDB(); payModal(l.id); renderView(); toast('已删除收款记录');
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'shop-save') saveShop(id);
  else if (act === 'tenant-save') saveTenant(id);
  else if (act === 'contract-save') saveContract(id);
  else if (act === 'lease-save') saveLease(id);
  else if (act === 'pay-save') savePayment(id);
  else if (act === 'print-receipt') printReceipt(id);
  else if (act === 'tenant-add') { closeModal(true); tenantModal(); }
  /* ---- 合同正文 / 范本 ---- */
  else if (act === 'b-save') saveBody(b.dataset.id || '', b.dataset.tpl || '');
  else if (act === 'b-preview') previewBody(b.dataset.id || '', b.dataset.tpl || '');
  else if (act === 'b-print') printContract();
  else if (act === 'b-word') exportContractWord(b.dataset.id || '', b.dataset.tpl || '');
  else if (act === 'b-edit') { closeModal(true); bodyModal('', id); }
  else if (act === 'b-insert') {
    const ta = document.querySelector('#b_body');
    if (ta) {
      const ph = '{{' + b.dataset.k + '}}';
      const s = ta.selectionStart, e2 = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + ph + ta.value.slice(e2);
      ta.focus(); ta.setSelectionRange(s + ph.length, s + ph.length);
    }
  }
  else if (act === 'b-refill') {
    const c = contractById(id);
    const sel = document.querySelector('#b_tpl');
    if (!c || !sel || !sel.value) return toast('请先选择一个范本', 'bad');
    const t = tplById(sel.value); if (!t) return;
    fieldsForContract(t, c).forEach(f => {
      const inp = document.querySelector('#b_fields input[data-fk="' + f.k + '"]');
      if (inp) inp.value = f.v;
    });
    c.tplId = t.id; c.tplName = t.name;
    toast('已按范本填充字段（记得点保存）', 'ok');
  }
}
