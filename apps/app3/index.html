<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>应用三</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
  color: #92400e;
}
.card {
  text-align: center;
  padding: 60px 48px;
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 10px 40px rgba(245, 158, 11, 0.2);
}
.icon { font-size: 64px; margin-bottom: 20px; }
h1 { font-size: 28px; margin-bottom: 10px; color: #b45309; }
p { color: #d97706; font-size: 15px; margin-bottom: 24px; }
.badge {
  display: inline-block;
  padding: 6px 14px;
  background: #fef3c7;
  color: #92400e;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
}
</style>
</head>
<body>
<div class="card">
  <div class="icon">📈</div>
  <h1>应用三</h1>
  <p>这是应用三的占位页面</p>
  <span class="badge">占位 · 待开发</span>
</div>
</body>
</html>
