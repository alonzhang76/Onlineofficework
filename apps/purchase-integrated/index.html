<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>采购一体化系统</title>
<style>
/* ==========================================================
   采购一体化系统 · 简洁主题
   参照 reimbursement-system 风格：蓝白配色、浅灰背景、白卡片、细边框
   ========================================================== */
:root{
  --bg:#f1f5f9;--card:#ffffff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;
  --primary:#2563eb;--primary-d:#1d4ed8;--green:#16a34a;--red:#dc2626;--amber:#d97706;
  --radius:12px;--radius-sm:8px;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 4px 14px rgba(15,23,42,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit}

/* ===== 登录层（macOS 毛玻璃风） ===== */
#loginMask{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:300;
  background:radial-gradient(1100px 750px at 12% 18%,rgba(125,211,252,.85) 0%,rgba(125,211,252,0) 60%),
             radial-gradient(950px 650px at 88% 22%,rgba(196,181,253,.8) 0%,rgba(196,181,253,0) 58%),
             radial-gradient(1100px 850px at 50% 105%,rgba(147,197,253,.85) 0%,rgba(147,197,253,0) 62%),
             linear-gradient(160deg,#eef4ff,#f3efff 55%,#e8f1ff);}
#loginMask.hidden{display:none}
.login-card{width:min(380px,92vw);border-radius:26px;padding:42px 38px 30px;text-align:center;
  background:rgba(255,255,255,.62);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,255,255,.65);box-shadow:0 28px 80px rgba(15,23,42,.22),inset 0 1px 0 rgba(255,255,255,.8)}
.appicon{width:66px;height:66px;margin:0 auto 14px;border-radius:17px;
  background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-size:26px;font-weight:700;
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(10,132,255,.38)}
.login-card h1{font-size:19px;font-weight:600;letter-spacing:1px;color:#1d1d1f;margin-bottom:4px}
.login-card .sub{font-size:12px;color:#6e6e73;margin-bottom:24px}
.login-card .field{margin-bottom:12px;position:relative;text-align:left}
.login-card input{width:100%;height:44px;border:none;border-radius:12px;
  padding:0 14px 0 38px;font-size:14px;color:#1d1d1f;background:rgba(255,255,255,.85);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.07);outline:none;transition:box-shadow .18s}
.login-card .field>span{position:absolute;left:13px;top:22px;transform:translateY(-50%);font-size:13px;opacity:.55;pointer-events:none}
.login-card input:focus{box-shadow:inset 0 0 0 1px rgba(10,132,255,.7),0 0 0 4px rgba(10,132,255,.15)}
.login-card .btn-login{width:100%;height:44px;border:none;border-radius:12px;background:#0a84ff;color:#fff;
  font-size:15px;font-weight:600;letter-spacing:4px;cursor:pointer;transition:background .15s,transform .06s;margin-top:6px}
.login-card .btn-login:hover{background:#0071e3}
.login-card .btn-login:active{transform:scale(.985)}
.login-err{color:#ff3b30;font-size:13px;margin-top:12px;min-height:18px}
.login-hint{margin-top:14px;font-size:11px;color:#86868b;line-height:1.7}

/* ===== 应用框架 ===== */
#app{display:none;height:100vh;flex-direction:column}
#app.show{display:flex}
header{background:#fff;border-bottom:1px solid var(--border);padding:0 22px;display:flex;align-items:center;gap:22px;height:58px;flex-shrink:0;z-index:50}
.logo{font-size:17px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#5e5ce6);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.company-select{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.company-select select{border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;font-size:13px;background:#fff;color:var(--text);outline:none;cursor:pointer;max-width:330px}
.userbox{display:flex;align-items:center;gap:10px;margin-left:auto;white-space:nowrap}
.userbox .who{font-size:13px;color:var(--muted);text-align:right;line-height:1.4}
.userbox .who b{color:var(--text);display:block;font-size:13px}
.rolechip{background:#eff6ff;color:var(--primary);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;display:inline-block}
.avatar{width:34px;height:34px;border-radius:50%;background:#e0e9ff;color:#2563eb;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.btn-exit{border:1px solid var(--border);background:#fff;border-radius:var(--radius-sm);padding:6px 14px;font-size:13px;cursor:pointer;color:var(--muted);transition:.15s}
.btn-exit:hover{color:var(--red);border-color:#fecaca;background:#fef2f2}

.layout{display:flex;flex:1;min-height:0}
aside{width:196px;background:#fff;border-right:1px solid var(--border);padding:10px;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.nav-group{font-size:10px;color:#94a3b8;padding:12px 12px 4px;text-transform:uppercase;letter-spacing:.08em}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 12px;margin-bottom:2px;border-radius:var(--radius-sm);
  cursor:pointer;color:var(--muted);font-size:13.5px;border-left:3px solid transparent;transition:.12s;user-select:none}
.nav-item .ico{width:18px;text-align:center;font-size:14px;opacity:.9}
.nav-item:hover{background:#f8fafc;color:var(--text)}
.nav-item.active{background:#eff6ff;color:var(--primary);border-left-color:var(--primary);font-weight:600}
aside .foot{margin-top:auto;padding:10px 12px;font-size:11px;color:#94a3b8;line-height:1.7}

main{flex:1;overflow-y:auto;padding:20px 24px 60px;min-width:0}
.page{display:none;animation:fadein .18s ease}
.page.show{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.page-head h2::before{content:"";width:4px;height:16px;background:var(--primary);border-radius:2px}
.page-head .desc{font-size:12.5px;color:var(--muted)}
.page-head .spacer{flex:1}

/* ===== 卡片 / 统计 ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card h3{font-size:14.5px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:4px;height:14px;background:var(--primary);border-radius:2px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat-card .l{font-size:12px;color:var(--muted)}
.stat-card .v{font-size:21px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums}
.stat-card .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.stat-card.hl .v{color:var(--primary)}
.stat-card.warn .v{color:var(--amber)}
.stat-card.good .v{color:var(--green)}
.stat-card.bad .v{color:var(--red)}

/* ===== 表单 ===== */
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
input,select,textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:13.5px;background:#fff;color:var(--text);outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
input[type=checkbox]{width:auto;cursor:pointer}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.row-flex{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row-flex>div{min-width:150px}
.req::after{content:" *";color:var(--red)}

/* ===== 按钮 ===== */
.btn{border:none;border-radius:var(--radius-sm);padding:8px 16px;cursor:pointer;font-size:13.5px;font-weight:500;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-d)}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{background:#15803d}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link-op{background:none;border:none;color:var(--primary);cursor:pointer;font-size:12.5px;padding:2px 5px;border-radius:4px}
.link-op:hover{background:#eff6ff}
.link-op.danger{color:var(--red)}
.link-op.danger:hover{background:#fef2f2}

/* ===== 表格 ===== */
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;background:#fff}
table{width:100%;border-collapse:collapse}
th{background:#f8fafc;font-size:12px;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;font-weight:600}
td{padding:8px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle;font-size:13px}
tbody tr:hover{background:#f8faff}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:Consolas,"Courier New",monospace}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:13px}
.search-input{max-width:280px}

/* ===== 徽章 ===== */
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11.5px;font-weight:500;white-space:nowrap}
.b-gray{background:#e2e8f0;color:#475569}
.b-blue{background:#dbeafe;color:#1e40af}
.b-green{background:#dcfce7;color:#166534}
.b-amber{background:#fef3c7;color:#92400e}
.b-red{background:#fee2e2;color:#991b1b}
.b-purple{background:#ede9fe;color:#5b21b6}
.prio-high{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.prio-medium{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
.prio-normal{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}

/* ===== 供应商卡片 ===== */
.sup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.sup-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:.15s}
.sup-card:hover{box-shadow:0 4px 18px rgba(15,23,42,.12)}
.sup-card .head{background:linear-gradient(135deg,#2563eb,#5e5ce6);color:#fff;padding:14px 16px}
.sup-card .head .nm{font-size:15px;font-weight:700}
.sup-card .head .no{font-size:11.5px;opacity:.85;margin-top:2px}
.sup-card .body{padding:13px 16px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.sup-card .kv{display:flex;justify-content:space-between;gap:10px;align-items:center}
.sup-card .kv .k{color:var(--muted);font-size:12px;flex-shrink:0}
.sup-card .kv .v{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{border-radius:999px;padding:2px 12px;font-size:12.5px;color:#fff;display:inline-block}
.pill-green{background:#22c55e}.pill-blue{background:#3b82f6}
.sup-card .ops{display:flex;gap:8px;padding:0 16px 14px}
.sup-card .ops .edit-btn{flex:1;background:#fff;color:#2563eb;border:1px solid #3b82f6;border-radius:6px;padding:5px 0;font-size:12.5px;cursor:pointer;transition:.15s}
.sup-card .ops .edit-btn:hover{background:#22c55e;border-color:#22c55e;color:#fff}
.sup-card .ops .del-btn{flex:1;background:#fff;color:#dc2626;border:1px solid #ef4444;border-radius:6px;padding:5px 0;font-size:12.5px;cursor:pointer;transition:.15s}
.sup-card .ops .del-btn:hover{background:#ef4444;border-color:#ef4444;color:#fff}

/* ===== 选项卡 ===== */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap}
.tab{border:none;background:none;padding:9px 16px;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover{color:var(--text)}

/* ===== 进度条 ===== */
.prog{background:#f1f5f9;border-radius:6px;height:8px;overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#2563eb);border-radius:6px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.bar-row .name{width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;color:var(--muted);flex-shrink:0}
.bar-row .track{flex:1;background:#f1f5f9;border-radius:6px;height:20px;overflow:hidden}
.bar-row .fill{height:100%;background:linear-gradient(90deg,#3b82f6,#2563eb);border-radius:6px;min-width:2px}
.bar-row .fill.g{background:linear-gradient(90deg,#4ade80,#16a34a)}
.bar-row .fill.o{background:linear-gradient(90deg,#fbbf24,#d97706)}
.bar-row .val{width:110px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0}

/* ===== 产品行 ===== */
.product-row{display:grid;grid-template-columns:2fr 1.4fr .7fr .9fr .9fr 1fr .9fr 30px;gap:8px;margin-bottom:8px;align-items:center}
.product-row input,.product-row select{padding:7px 8px;font-size:13px}
.icon-btn{width:28px;height:28px;border:none;background:#fef2f2;color:var(--red);border-radius:6px;cursor:pointer;font-size:14px}
.icon-btn:hover{background:#fee2e2}

/* ===== 模态框 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:40px 16px}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:14px;width:min(860px,96vw);max-height:88vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.narrow{width:min(520px,94vw)}
.modal.wide{width:min(1080px,96vw)}
.modal h3{font-size:16px;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.modal h3::before{content:"";width:4px;height:16px;background:var(--primary);border-radius:2px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:14px;border-top:1px solid #f1f5f9}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
.hint b{color:var(--text)}
.amt-hint{font-size:12px;color:var(--primary);background:#eff6ff;border-radius:6px;padding:6px 10px;margin-top:6px}

/* ===== Toast ===== */
.toast{position:fixed;top:70px;right:24px;z-index:400;display:flex;flex-direction:column;gap:10px}
.toast div{padding:11px 18px;border-radius:10px;color:#fff;box-shadow:var(--shadow);animation:slidein .22s;font-size:13.5px;max-width:380px}
.t-ok{background:var(--green)}.t-err{background:var(--red)}.t-info{background:#334155}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}

/* ===== 快捷入口 ===== */
.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.quick-item{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s;text-align:center}
.quick-item:hover{border-color:var(--primary);box-shadow:var(--shadow);transform:translateY(-2px)}
.quick-item .qi{font-size:22px;margin-bottom:8px}
.quick-item .qn{font-size:13.5px;font-weight:600}
.quick-item .qd{font-size:11px;color:var(--muted);margin-top:3px}

/* ===== 工具箱计算器 ===== */
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.calc-grid{grid-template-columns:1fr}}
.result-box{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:14px}
.result-line{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px dashed #e2e8f0;font-size:13px}
.result-line:last-child{border-bottom:none}
.result-line .rk{color:var(--muted)}
.result-line .rv{font-weight:700;font-variant-numeric:tabular-nums}
.result-line.total .rv{color:var(--primary);font-size:15px}

/* ===== 权限矩阵 ===== */
.perm-matrix th,.perm-matrix td{text-align:center}
.perm-matrix td:first-child,.perm-matrix th:first-child{text-align:left}

/* ===== 对账明细 ===== */
.recon-line-typed{font-weight:600}
.recon-inv{color:#1e40af}
.recon-pay{color:#15803d}

/* ===== 打印 ===== */
#printArea{display:none}
@media print{
  body>*{display:none !important}
  #printArea{display:block !important}
  body{background:#fff}
  .a4{width:210mm;min-height:297mm;margin:0 auto;padding:14mm 16mm;font-size:12.5px;color:#000;background:#fff}
  .a4 *{box-shadow:none !important}
  @page{size:A4 portrait;margin:8mm}
}
.a4-preview{width:210mm;max-width:100%;margin:0 auto;padding:14mm 16mm;font-size:12.5px;color:#000;background:#fff;border:1px solid var(--border);min-height:280mm}
.a4 h2.c-title{text-align:center;font-size:17px;font-weight:700;margin:6px 0 14px}
.a4 .c-head{text-align:center;margin-bottom:4px}
.a4 .c-head .cn{font-size:17px;font-weight:700;display:inline-block;min-width:60%;border-bottom:2px solid #000;padding-bottom:3px}
.a4 .info-grid{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 18px;margin:10px 0;font-size:12.5px}
.a4 table{width:100%;border-collapse:collapse;margin:8px 0}
.a4 th,.a4 td{border:1px solid #000;padding:4px 6px;font-size:11.5px;text-align:center}
.a4 th{background:#f5f5f5 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.a4 .terms li{margin:4px 0;line-height:1.55;list-style:none}
.a4 .sign-row{display:flex;justify-content:space-between;margin-top:34px;gap:20px}
.a4 .sign-box{flex:1;border-top:1px solid #000;padding-top:6px;font-size:12px}
.a4 .summary-bar{display:flex;gap:24px;justify-content:flex-end;margin:10px 4px;font-size:12.5px;flex-wrap:wrap}
.a4 .summary-bar b{font-variant-numeric:tabular-nums}

@media (max-width:900px){
  aside{width:60px}
  aside .nav-item span.txt,aside .nav-group,aside .foot{display:none}
  .product-row{grid-template-columns:1fr 1fr;}
  .calc-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ============ 登录层 ============ -->
<div id="loginMask">
  <div class="login-card">
    <div class="appicon">采</div>
    <h1>采购一体化系统</h1>
    <div class="sub">Procurement Unified System</div>
    <div class="field"><span>👤</span><input id="loginUser" placeholder="用户名" autocomplete="username"></div>
    <div class="field"><span>🔒</span><input id="loginPwd" type="password" placeholder="密码" autocomplete="current-password"></div>
    <button class="btn-login" id="loginBtn">登 录</button>
    <div class="login-err" id="loginErr"></div>
    <div class="login-hint">首次使用请用管理员账号登录<br>默认账号：admin / admin123（登录后请及时修改）</div>
  </div>
</div>

<!-- ============ 应用框架 ============ -->
<div id="app">
  <header>
    <div class="logo"><span class="mark">采</span>采购一体化系统</div>
    <div class="company-select" id="companySelectWrap">
      <span>公司主体</span><select id="companySelect"></select>
    </div>
    <div class="userbox">
      <div class="who"><b id="whoName">—</b><span class="rolechip" id="whoRole">—</span></div>
      <div class="avatar" id="whoAvatar">?</div>
      <button class="btn-exit" id="logoutBtn">退出登录</button>
    </div>
  </header>
  <div class="layout">
    <aside id="sidebar"></aside>
    <main id="main"></main>
  </div>
</div>

<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toastBox"></div>
<div id="printArea"></div>

<script>
/* ==========================================================
   采购一体化系统 · 单文件应用
   数据层：本地 localStorage（键前缀 pis_），预留腾讯 CloudBase 适配层
   ========================================================== */
'use strict';

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const pad2 = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMoney = n => '¥' + (Math.round((+n || 0) * 100) / 100).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtNum = n => (+n || 0).toLocaleString('zh-CN', { maximumFractionDigits: 3 });
const fmtDate = s => { if (!s) return ''; const d = new Date(s); return isNaN(d) ? s : d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const splitMulti = s => String(s || '').split(/[，,、;；\s]+/).map(x => x.trim()).filter(Boolean);
function toast(msg, type) {
  const box = $('#toastBox'); const el = document.createElement('div');
  el.className = type === 'ok' ? 't-ok' : type === 'err' ? 't-err' : 't-info';
  el.textContent = msg; box.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, 2600);
}
function nextNo(prefix) {
  const d = new Date(); const ds = d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate());
  const key = 'seq_' + prefix + '_' + ds; const n = (+DB.get(key, 0)) + 1; DB.set(key, n);
  return prefix + ds + '-' + String(n).padStart(3, '0');

/* 金额转人民币大写 */
function moneyCn(n) {
  n = Math.round((+n || 0) * 100) / 100;
  if (n === 0) return '零元整';
  const digits = '零壹贰叁肆伍陆柒捌玖', units = ['', '拾', '佰', '仟'], bigs = ['', '万', '亿', '兆'];
  let [intPart, decPart] = n.toFixed(2).split('.');
  let out = '';
  if (+intPart > 0) {
    const intDigits = intPart.split('').map(Number);
    const groups = []; for (let i = intDigits.length; i > 0; i -= 4) groups.unshift(intDigits.slice(Math.max(0, i - 4), i));
    groups.forEach((g, gi) => {
      let gs = ''; const gz = g.reduce((s, v) => s + v, 0) === 0;
      if (gz) { if (out && !out.endsWith('零') && gi < groups.length - 1) out += '零'; return; }
      g.forEach((v, i) => {
        const pos = g.length - 1 - i;
        if (v === 0) { if (!gs.endsWith('零') && i < g.length - 1) gs += '零'; }
        else gs += digits[v] + units[pos];
      });
      gs = gs.replace(/零+$/, '');
      out += gs + bigs[groups.length - 1 - gi];
    });
    out = out.replace(/零+/g, '零').replace(/零+$/, '') + '元';
  }
  const jiao = +decPart[0], fen = +decPart[1];
  if (jiao === 0 && fen === 0) return out + '整';
  if (+intPart === 0) { // 纯角分：0.05 → 伍分，0.50 → 伍角，0.55 → 伍角伍分
    let r = '';
    if (jiao > 0) r += digits[jiao] + '角';
    if (fen > 0) r += digits[fen] + '分';
    return r;
  }
  if (jiao > 0) out += digits[jiao] + '角';
  else if (fen > 0) out += '零';
  if (fen > 0) out += digits[fen] + '分'; else out += '整';
  return out;
}

/* ---------- 数据层（CloudBase 预留适配） ---------- */
/* 说明：后期迁移腾讯 CloudBase（TCB）时：
   1) 在页面引入 TCB JS SDK 并在【系统管理→数据与云】填入环境 ID；
   2) CloudBase.push()/pull() 提供全量快照上传/下载（与现有 cloudbase-sync 模式一致）；
   3) DB.driver 可替换为云数据库逐集合读写，业务代码无需改动（全部经 DB/Data 层）。 */
const DB = {
  prefix: 'pis_',
  get(k, d) { try { const v = localStorage.getItem(this.prefix + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { localStorage.setItem(this.prefix + k, JSON.stringify(v)); },
  del(k) { localStorage.removeItem(this.prefix + k); },
  snapshot() {
    const out = {}; const p = this.prefix;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(p)) out[k.slice(p.length)] = localStorage.getItem(k);
    }
    return { app: 'purchase-integrated', version: 1, exportedAt: new Date().toISOString(), data: out };
  },
  restore(snap) {
    if (!snap || !snap.data) throw new Error('备份文件格式不正确');
    Object.keys(snap.data).forEach(k => localStorage.setItem(this.prefix + k, snap.data[k]));
  },
  clearBiz() { // 清空业务数据（保留用户/角色/公司）
    ['orders','shipments','receipts','returns','invoices','payments','suppliers','tool_records']
      .forEach(c => this.del(c));
    Object.keys(localStorage).filter(k => k.startsWith(this.prefix + 'seq_')).forEach(k => localStorage.removeItem(k));
  }
};
const CloudBase = {
  env() { return DB.get('cb_env', ''); },
  setEnv(v) { DB.set('cb_env', String(v || '').trim()); },
  ready() { return !!this.env() && typeof window.cloudbase !== 'undefined'; },
  async push() {
    if (!this.ready()) throw new Error('CloudBase 未就绪：请配置环境 ID 并引入 TCB JS SDK');
    const app = window.cloudbase.init({ env: this.env() });
    const db = app.database();
    const snap = DB.snapshot();
    const res = await db.collection('pis_snapshots').where({ app: 'purchase-integrated' }).get();
    if (res.data.length) await db.collection('pis_snapshots').doc(res.data[0]._id).update({ payload: snap, updatedAt: new Date().toISOString() });
    else await db.collection('pis_snapshots').add({ app: 'purchase-integrated', payload: snap, updatedAt: new Date().toISOString() });
    return true;
  },
  async pull() {
    if (!this.ready()) throw new Error('CloudBase 未就绪：请配置环境 ID 并引入 TCB JS SDK');
    const app = window.cloudbase.init({ env: this.env() });
    const db = app.database();
    const res = await db.collection('pis_snapshots').where({ app: 'purchase-integrated' }).get();
    if (!res.data.length) throw new Error('云端暂无快照');
    DB.restore(res.data[0].payload);
    return true;
  }
};

/* ---------- 密码 ---------- */
async function hashPwd(pwd) {
  const salted = 'pis::' + pwd;
  try {
    if (window.crypto && crypto.subtle && window.isSecureContext) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salted));
      return 's1:' + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) { /* 回退 */ }
  let h1 = 5381, h2 = 52711;
  for (let i = 0; i < salted.length; i++) { const c = salted.charCodeAt(i); h1 = ((h1 << 5) + h1 + c) >>> 0; h2 = ((h2 << 5) + h2 ^ c) >>> 0; }
  return 'f1:' + h1.toString(16) + '-' + h2.toString(16);
}
async function ensureAdminHash() { // 把种子密码升级为哈希
  const users = DB.get('users', []);
  const admin = users.find(u => u.username === 'admin');
  if (admin && admin.pwd === 'seed:admin123') { admin.pwd = await hashPwd('admin123'); DB.set('users', users); }
}

/* ---------- 数据访问（含公司过滤 + 供应商隔离） ---------- */
const Data = {
  GLOBAL_COLS: ['suppliers'],
  list(coll) {
    let arr = DB.get(coll, []); if (!Array.isArray(arr)) arr = [];
    if (this.GLOBAL_COLS.indexOf(coll) < 0 && !Session.isSupplier()) {
      arr = arr.filter(r => !r.company || r.company === State.company);
    }
    if (Session.isSupplier()) {
      const me = Session.mySupplier();
      if (this.GLOBAL_COLS.indexOf(coll) < 0) arr = arr.filter(r => r.supplier === me);
      else arr = arr.filter(r => r.supplierName === me); // 供应商只见自己的档案
    }
    return arr;
  },
  all(coll) { let arr = DB.get(coll, []); return Array.isArray(arr) ? arr : []; },
  add(coll, rec) { const arr = DB.get(coll, []); arr.unshift(rec); DB.set(coll, arr); },
  update(coll, id, patch) { const arr = DB.get(coll, []); const i = arr.findIndex(r => r.id === id); if (i > -1) { Object.assign(arr[i], patch, { updatedAt: new Date().toISOString() }); DB.set(coll, arr); } },
  remove(coll, id) { DB.set(coll, DB.get(coll, []).filter(r => r.id !== id)); }
};

/* ---------- 业务统计 ---------- */
function contractByNo(cno) { return Data.list('orders').find(o => o.contractNumber === cno); }
function orderProducts(o) { return (o && o.products) || []; }
function sumQty(list, cno, pname, field, dateField, dateEnd) {
  return list.filter(r => r.contractNumber === cno && (!pname || r.product === pname))
    .filter(r => !dateEnd || !r[dateField] || r[dateField] <= dateEnd)
    .reduce((s, r) => s + (+r[field] || 0), 0);
}
const receivedQty = (cno, pn) => sumQty(Data.list('receipts'), cno, pn, 'quantity', 'receiptDate');
const returnedQty = (cno, pn) => sumQty(Data.list('returns'), cno, pn, 'quantity', 'returnDate');
const shippedQty = (cno, pn) => sumQty(Data.list('shipments'), cno, pn, 'quantity', 'shipDate');
function orderOrderedQty(o) { return orderProducts(o).reduce((s, p) => s + (+p.quantity || 0), 0); }
function orderReceivedTotal(o) { return orderProducts(o).reduce((s, p) => s + receivedQty(o.contractNumber, p.name), 0); }
function orderReturnTotal(o) { return orderProducts(o).reduce((s, p) => s + returnedQty(o.contractNumber, p.name), 0); }
function orderStatus(o) {
  const ordered = orderOrderedQty(o), recv = Math.max(0, orderReceivedTotal(o) - orderReturnTotal(o));
  if (ordered <= 0) return { t: '执行中', c: 'b-gray' };
  if (recv >= ordered) return { t: '已收齐', c: 'b-green' };
  if (recv > 0) return { t: '部分收货', c: 'b-amber' };
  return { t: '未收货', c: 'b-gray' };
}
function invoicedOfContract(cno) { return Data.list('invoices').filter(v => splitMulti(v.contractNumber).includes(cno)).reduce((s, v) => s + (+v.amount || 0), 0); }
function paidOfContract(cno) { return Data.list('payments').filter(p => splitMulti(p.contractNumber).includes(cno)).reduce((s, p) => s + (+p.amount || 0), 0); }
function paidOfInvoice(invNo) { return Data.list('payments').filter(p => splitMulti(p.invoiceNumbers).includes(invNo)).reduce((s, p) => s + (+p.amount || 0), 0); }
function invoiceStatus(inv) {
  const paid = paidOfInvoice(inv.invoiceNumber);
  if (paid <= 0) return { t: '未付款', c: 'b-gray' };
  if (paid >= (+inv.amount || 0) - 0.005) return { t: '已付清', c: 'b-green' };
  return { t: '部分付款', c: 'b-amber' };
}
function supPriorityBadge(p) {

}

/* ---------- 导出 CSV ---------- */
function exportCSV(filename, headers, rows) {
  const head = headers.map(h => '"' + String(h).replace(/"/g, '""') + '"').join(',');
  const body = rows.map(r => r.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(',')).join('\n');
  const blob = new Blob(['\ufeff' + head + '\n' + body], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 800);
}

function renderPage() {

function pageDashboard(root) {
  const orders = Data.list('orders');
  const invs = Data.list('invoices'), pays = Data.list('payments'), sups = Data.list('suppliers');
  const totalAmount = orders.reduce((s, o) => s + (+o.totalAmount || 0), 0);
  const invoiced = invs.reduce((s, v) => s + (+v.amount || 0), 0);
  const paid = pays.reduce((s, p) => s + (+p.amount || 0), 0);
  const unInv = Math.max(0, totalAmount - invoiced);
  const cards = [
    { l: '采购合同', v: orders.length + ' 份', s: '合同总金额 ' + fmtMoney(totalAmount), c: 'hl' },
    { l: '已开票', v: fmtMoney(invoiced), s: '发票 ' + invs.length + ' 张', c: '' },
    { l: '已付款', v: fmtMoney(paid), s: '付款 ' + pays.length + ' 笔', c: 'good' },
    { l: Session.isSupplier() ? '待对账余额' : '未开票金额', v: fmtMoney(Session.isSupplier() ? invoiced - paid : unInv), s: Session.isSupplier() ? '开票合计 − 付款合计' : '建议及时向供应商索票', c: Session.isSupplier() ? (invoiced - paid > 0.005 ? 'bad' : 'good') : 'warn' }
  ];
  const recents = [];
  [['orders', '采购'], ['shipments', '发货'], ['receipts', '收货'], ['returns', '退货'], ['invoices', '开票'], ['payments', '付款']].forEach(([c, tag]) => {
    Data.list(c).slice(0, 3).forEach(r => recents.push({ t: r.createdAt || '', tag, no: r.contractNumber || r.receiptNumber || r.returnNumber || r.shipNumber || r.invoiceNumber || r.paymentNumber || '', txt: tag + ' · ' + (r.supplier || '') + ' · ' + (r.product || '') }));
  });
  recents.sort((a, b) => (b.t || '').localeCompare(a.t || ''));

function drawPurchaseTable(box, kw) {
  let orders = Data.list('orders');
  if (kw) orders = orders.filter(o => [o.contractNumber, o.supplier, o.remark, (o.products || []).map(p => p.name).join(' ')].join(' ').toLowerCase().includes(kw));
  orders.sort((a, b) => (b.orderDate || '').localeCompare(a.orderDate || ''));
  if (!orders.length) { box.innerHTML = '<div class="empty">暂无采购合同</div>'; return; }
  box.innerHTML = '<div class="tbl-wrap" style="max-height:62vh"><table><thead><tr>' +
    '<th>合同号</th><th>供应商</th><th>签订日期</th><th>交货期</th><th>产品</th><th class="num">总金额(含税)</th><th>收货进度</th><th>开票/付款</th><th>状态</th><th style="width:190px">操作</th></tr></thead><tbody>' +
    orders.map(o => {
      const st = orderStatus(o); const ordered = orderOrderedQty(o); const recv = Math.max(0, orderReceivedTotal(o) - orderReturnTotal(o));
      const pct = ordered > 0 ? Math.min(100, Math.round(recv / ordered * 100)) : 0;
      const inv = invoicedOfContract(o.contractNumber), paid = paidOfContract(o.contractNumber);
      return '<tr>' +
        '<td class="mono"><b>' + esc(o.contractNumber) + '</b></td><td>' + esc(o.supplier) + '</td>' +
        '<td>' + esc(o.orderDate || '') + '</td><td>' + esc(o.deliveryDate || '') + '</td>' +
        '<td title="' + esc((o.products || []).map(p => p.name + '×' + p.quantity).join('；')) + '">' + esc((o.products || []).map(p => p.name).join('、')) + '</td>' +
        '<td class="num"><b>' + fmtMoney(o.totalAmount) + '</b></td>' +
        '<td><div style="display:flex;align-items:center;gap:6px"><div class="prog" style="flex:1"><i style="width:' + pct + '%"></i></div><span style="font-size:11.5px;color:var(--muted)">' + pct + '%</span></div></td>' +
        '<td style="font-size:11.5px">开票 ' + fmtMoney(inv) + '<br>付款 ' + fmtMoney(paid) + '</td>' +
        '<td><span class="badge ' + st.c + '">' + st.t + '</span></td>' +
        '<td><button class="link-op" data-act="detail" data-id="' + o.id + '">明细</button>' +
        '<button class="link-op" data-act="print" data-id="' + o.id + '">打印合同</button>' +
        (Session.canWrite('purchase') ? '<button class="link-op" data-act="edit" data-id="' + o.id + '">编辑</button><button class="link-op danger" data-act="del" data-id="' + o.id + '">删除</button>' : '') +
        '</td></tr>';
    }).join('') + '</tbody></table></div>';
  box.querySelectorAll('button[data-act]').forEach(b => b.addEventListener('click', () => {
    const o = Data.list('orders').find(x => x.id === b.dataset.id); if (!o) return;
    if (b.dataset.act === 'detail') orderDetail(o);
    else if (b.dataset.act === 'print') contractPrint(o);
    else if (b.dataset.act === 'edit') orderForm(o);
    else if (b.dataset.act === 'del') {
      if (confirm('确定删除合同 ' + o.contractNumber + ' ？相关收发货记录不会删除。')) { Data.remove('orders', o.id); toast('已删除', 'ok'); renderPage(); }
    }
  }));
}
function productRowHTML(p) {
  p = p || { name: '', spec: '', unit: '', unitPrice: '', quantity: '', remark: '' };
  const units = DB.get('units', DEFAULT_UNITS);
  return '<div class="product-row">' +

    '<input class="pr-spec" placeholder="规格型号" value="' + esc(p.spec || '') + '">' +
    '<select class="pr-unit">' + '<option value="">单位</option>' + units.map(u => '<option' + (u === p.unit ? ' selected' : '') + '>' + esc(u) + '</option>').join('') + '</select>' +

    '<input class="pr-qty num" type="number" step="1" min="0" placeholder="数量" value="' + (p.quantity || '') + '">' +
    '<input class="pr-amount num" placeholder="金额" value="' + ((+p.unitPrice || 0) * (+p.quantity || 0) ? ((+p.unitPrice || 0) * (+p.quantity || 0)).toFixed(2) : '') + '" readonly tabindex="-1">' +
    '<input class="pr-remark" placeholder="备注" value="' + esc(p.remark || '') + '">' +

function updatePoTotal() {
  let sum = 0;
  $$('#modalBox .product-row').forEach(r => {
    const amt = (+r.querySelector('.pr-price').value || 0) * (+r.querySelector('.pr-qty').value || 0);
    r.querySelector('.pr-amount').value = amt ? amt.toFixed(2) : ''; sum += amt;
  });
  const t = $('#poTotal'); if (t) t.value = sum.toFixed(2);
}
function orderForm(o) {

    '<div><label class="req">签订日期</label><input id="poDate" type="date" required value="' + esc(o ? o.orderDate : todayStr()) + '"></div>' +

    '<div id="poRows">' + (isEdit && o.products && o.products.length ? o.products.map(productRowHTML).join('') : productRowHTML()) + '</div>' +

    '<div><label class="req">总金额（含税）</label><input id="poTotal" type="number" step="0.01" min="0" required value="' + (o ? o.totalAmount : '') + '"></div>' +
    '<div style="grid-column:1/-1"><label>备注</label><input id="poRemark" value="' + esc(o ? (o.remark || '') : '') + '"></div></div>' +
    '<div class="modal-foot"><button type="button" class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary">保存合同</button></div></form>', 'wide');
  $('#poAddRow').addEventListener('click', () => { $('#poRows').insertAdjacentHTML('beforeend', productRowHTML()); bindPoRow(); });
  $$('#modalBox .product-row').forEach(r => bindPoRow(r));
  function bindPoRow(r) {
    (r ? [r] : $$('#modalBox .product-row')).forEach(row => {
      row.querySelector('.pr-price').addEventListener('input', updatePoTotal);
      row.querySelector('.pr-qty').addEventListener('input', updatePoTotal);
    });
  }
  $('#poForm').addEventListener('submit', async e => {
    e.preventDefault();
    const no = $('#poNo').value.trim(), sup = $('#poSup').value.trim();
    if (!no || !sup) return;
    const dup = Data.list('orders').find(x => x.contractNumber === no && (!isEdit || x.id !== o.id));
    if (dup) { toast('合同号已存在：' + no, 'err'); return; }
    const products = $$('#modalBox .product-row').map(r => ({
      name: r.querySelector('.pr-name').value.trim(), spec: r.querySelector('.pr-spec').value.trim(),
      unit: r.querySelector('.pr-unit').value, unitPrice: +r.querySelector('.pr-price').value || 0,
      quantity: +r.querySelector('.pr-qty').value || 0,
      amount: ((+r.querySelector('.pr-price').value || 0) * (+r.querySelector('.pr-qty').value || 0)).toFixed(2),
      remark: r.querySelector('.pr-remark').value.trim()
    })).filter(p => p.name);
    if (!products.length) { toast('请至少填写一个产品', 'err'); return; }
    const rec = {
      id: isEdit ? o.id : uid(), company: State.company, contractNumber: no, supplier: sup,
      orderDate: $('#poDate').value, deliveryDate: $('#poDelivery').value,
      products, totalAmount: +$('#poTotal').value || 0, remark: $('#poRemark').value.trim(),
      createdAt: isEdit ? o.createdAt : new Date().toISOString()
    };
    if (isEdit) Data.update('orders', o.id, rec); else Data.add('orders', rec);
    // 自动登记供应商（若不存在）
    const sups = DB.get('suppliers', []);
    if (!sups.find(s => s.supplierName === sup)) {
      sups.unshift({ id: uid(), supplierNumber: 'SUP-' + Date.now().toString().slice(-6), supplierName: sup, contactPerson: '', phoneNumber: '', email: '', companyAddress: '', bankName: '', bankCode: '', bankAccount: '', priority: 'normal', remarks: '由采购合同自动创建', createdAt: new Date().toISOString() });
      DB.set('suppliers', sups);
    }
    closeModal(); toast(isEdit ? '合同已更新' : '采购合同已保存', 'ok'); renderPage();
  });
}

  }));

    '<div><label>结算方式</label><select id="payMethod"><option>电汇</option><option>银行承兑</option><option>商业承兑</option><option>现金</option><option>其他</option></select></div>' +
    '<div style="grid-column:1/-1"><label>供应商</label><input id="paySup" readonly placeholder="选择发票或合同后自动带出"></div>' +

    $('#payInvoiceSec').style.display = m === 'invoice' ? 'grid' : 'none';
    $('#payContractSec').style.display = m === 'contract' ? 'grid' : 'none';
    updHint();
  };

    const m = mode(); let sup = '', cno = '', text = '';
    if (m === 'invoice') {
      const sel = $$('#payF .pay-inv').filter(c => c.checked);
      sup = sel.length ? sel[0].dataset.sup : '';
      cno = sel.map(c => c.dataset.cno).filter(Boolean).join(', ');
      const unpaid = sel.reduce((s, c) => {
        const inv = Data.list('invoices').find(v => v.invoiceNumber === c.value);
        return s + (inv ? Math.max(0, (+inv.amount || 0) - paidOfInvoice(inv.invoiceNumber) + (isEdit && rec.invoiceNumbers.includes(inv.invoiceNumber) ? +rec.amount || 0 : 0)) : 0);
      }, 0);
      text = sel.length ? '已选 ' + sel.length + ' 张发票 · 合计未付 <b>' + fmtMoney(unpaid) + '</b>' + ((+$('#payAmt').value || 0) > unpaid + 0.004 ? ' · <span style="color:var(--red)">付款金额超过未付金额</span>' : '') : '请勾选要付款的发票';
    } else {
      const o = contractByNo($('#payCno').value);
      if (o) {
        sup = o.supplier; cno = o.contractNumber;

      } else text = '请选择合同';
    }
    $('#paySup').value = sup;
    $('#payHint').innerHTML = text;
  };
  $$('#payF input[name=payType]').forEach(r => r.addEventListener('change', refreshMode));
  $$('#payF .pay-inv').forEach(c => c.addEventListener('change', updHint));
  $('#payCno').addEventListener('change', updHint);
  $('#payAmt').addEventListener('input', updHint);
  refreshMode();
  $('#payF').addEventListener('submit', e => {
    e.preventDefault();
    const m = mode(); let data;
    if (m === 'invoice') {
      const sel = $$('#payF .pay-inv').filter(c => c.checked);
      if (!sel.length) { toast('请勾选要付款的发票', 'err'); return; }
      const invNos = sel.map(c => c.value).join(', ');
      data = {
        id: isEdit ? rec.id : uid(), company: State.company, paymentNumber: $('#payNo').value.trim(),
        paymentType: 'invoice', invoiceNumbers: invNos, contractNumber: sel.map(c => c.dataset.cno).filter(Boolean).join(', '),
        supplier: sel[0].dataset.sup, paymentDate: $('#payDate').value, amount: +$('#payAmt').value || 0,
        method: $('#payMethod').value, remark: $('#payRemark').value.trim(),
        createdAt: isEdit ? rec.createdAt : new Date().toISOString()
      };
    } else {
      const o = contractByNo($('#payCno').value);
      if (!o) { toast('请选择合同', 'err'); return; }
      data = {
        id: isEdit ? rec.id : uid(), company: o.company || State.company, paymentNumber: $('#payNo').value.trim(),
        paymentType: 'contract', contractNumber: o.contractNumber, invoiceNumbers: rec ? rec.invoiceNumbers || '' : '',
        supplier: o.supplier, paymentDate: $('#payDate').value, amount: +$('#payAmt').value || 0,
        method: $('#payMethod').value, remark: $('#payRemark').value.trim(),
        createdAt: isEdit ? rec.createdAt : new Date().toISOString()
      };
    }
    if (isEdit) Data.update('payments', rec.id, data); else Data.add('payments', data);
    closeModal(); toast('付款已保存，发票状态已联动更新', 'ok'); renderPage();
  });
}

function pageRecon(root) {
  const sups = Array.from(new Set(Data.list('orders').map(o => o.supplier).concat(Data.list('suppliers').map(s => s.supplierName)))).filter(Boolean);
  const selSup = Session.isSupplier() ? Session.mySupplier() : '';
  root.innerHTML =
    '<div class="page-head"><h2>对账管理</h2><span class="desc">按供应商生成开票 / 付款对账单，支持 A4 打印</span></div>' +
    '<div class="card"><div class="row-flex">' +
    (Session.isSupplier() ? '' : '<div style="min-width:220px"><label class="req">供应商</label><select id="rcSup"><option value="">请选择供应商</option>' + sups.map(s => '<option>' + esc(s) + '</option>').join('') + '</select></div>') +
    '<div><label>开始日期</label><input id="rcStart" type="date"></div>' +
    '<div><label>结束日期</label><input id="rcEnd" type="date"></div>' +
    '<div style="align-self:flex-end"><button class="btn btn-primary" id="rcGen">生成对账单</button></div>' +
    '<div style="align-self:flex-end;display:none" id="rcPrintWrap"><button class="btn btn-outline" id="rcPrint">🖨 A4 打印 / 导出PDF</button></div>' +
    '</div><div id="rcResult" style="margin-top:14px"></div></div>';
  $('#rcGen').addEventListener('click', () => {
    const sup = Session.isSupplier() ? Session.mySupplier() : $('#rcSup').value;
    if (!sup) { toast('请选择供应商', 'err'); return; }
    drawRecon(sup, $('#rcStart').value, $('#rcEnd').value);
  });
  function drawRecon(sup, start, end) {
    const invs = Data.list('invoices').filter(v => v.supplier === sup && (!start || v.invoiceDate >= start) && (!end || v.invoiceDate <= end));
    const pays = Data.list('payments').filter(p => p.supplier === sup && (!start || p.paymentDate >= start) && (!end || p.paymentDate <= end));
    const lines = [];
    invs.forEach(v => lines.push({ date: v.invoiceDate, type: '开票', doc: v.invoiceNumber, cno: v.contractNumber, amt: +v.amount || 0 }));
    pays.forEach(p => lines.push({ date: p.paymentDate, type: '付款', doc: p.paymentNumber, cno: p.contractNumber, amt: -(+p.amount || 0) }));
    lines.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    let run = 0; const totalInv = lines.filter(l => l.amt > 0).reduce((s, l) => s + l.amt, 0);
    const totalPay = -lines.filter(l => l.amt < 0).reduce((s, l) => s + l.amt, 0);
    lines.forEach(l => { run += l.amt; l.run = run; });
    $('#rcPrintWrap').style.display = lines.length ? 'block' : 'none';
    $('#rcResult').innerHTML =
      '<div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">' +
      '<div class="stat-card hl"><div class="l">开票合计（应付）</div><div class="v">' + fmtMoney(totalInv) + '</div><div class="s">' + invs.length + ' 张发票</div></div>' +
      '<div class="stat-card good"><div class="l">付款合计（已付）</div><div class="v">' + fmtMoney(totalPay) + '</div><div class="s">' + pays.length + ' 笔付款</div></div>' +
      '<div class="stat-card ' + (totalInv - totalPay > 0.005 ? 'bad' : 'good') + '"><div class="l">未付余额</div><div class="v">' + fmtMoney(totalInv - totalPay) + '</div><div class="s">开票 − 付款</div></div></div>' +
      (lines.length ? '<div class="tbl-wrap" style="max-height:46vh"><table><thead><tr><th>序号</th><th>日期</th><th>类型</th><th>单据号</th><th>合同号</th><th class="num">开票金额</th><th class="num">付款金额</th><th class="num">累计余额</th></tr></thead><tbody>' +
        lines.map((l, i) => '<tr><td>' + (i + 1) + '</td><td>' + esc(l.date) + '</td>' +
          '<td><span class="recon-line-typed ' + (l.amt > 0 ? 'recon-inv' : 'recon-pay') + '"><span class="badge ' + (l.amt > 0 ? 'b-purple' : 'b-green') + '">' + l.type + '</span></span></td>' +
          '<td class="mono">' + esc(l.doc) + '</td><td class="mono">' + esc(l.cno || '') + '</td>' +
          '<td class="num">' + (l.amt > 0 ? fmtMoney(l.amt) : '') + '</td><td class="num">' + (l.amt < 0 ? fmtMoney(-l.amt) : '') + '</td>' +
          '<td class="num"><b>' + fmtMoney(l.run) + '</b></td></tr>').join('') +
        '</tbody></table></div>' : '<div class="empty">该期间内暂无开票 / 付款记录</div>');
    $('#rcPrint').onclick = () => reconPrint(sup, start, end, lines, totalInv, totalPay);
  }
}

    '<div><label>联系电话</label><input id="sfPhone" value="' + esc(s ? (s.phoneNumber || '') : '') + '"></div>' +
    '<div><label>邮箱</label><input id="sfEmail" value="' + esc(s ? (s.email || '') : '') + '"></div>' +
    '<div><label>公司地址</label><input id="sfAddr" value="' + esc(s ? (s.companyAddress || '') : '') + '"></div>' +
    '<div><label>开户银行</label><input id="sfBank" value="' + esc(s ? (s.bankName || '') : '') + '"></div>' +
    '<div><label>银行行号</label><input id="sfBankCode" value="' + esc(s ? (s.bankCode || '') : '') + '"></div>' +
    '<div><label>银行账号</label><input id="sfAccount" value="' + esc(s ? (s.bankAccount || '') : '') + '"></div>' +
    '<div><label>合作优先级</label><select id="sfPrio"><option value="normal"' + (!s || s.priority === 'normal' ? ' selected' : '') + '>正常</option><option value="medium"' + (s && s.priority === 'medium' ? ' selected' : '') + '>优先合作</option><option value="high"' + (s && s.priority === 'high' ? ' selected' : '') + '>紧急优先</option></select></div>' +
    '<div style="grid-column:1/-1"><label>备注</label><input id="sfRemark" value="' + esc(s ? (s.remarks || '') : '') + '"></div></div>' +
    '<div class="modal-foot"><button type="button" class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary">保存</button></div></form>');
  $('#supF').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#sfName').value.trim();
    const dup = DB.get('suppliers', []).find(x => x.supplierName === name && (!isEdit || x.id !== s.id));
    if (dup) { toast('供应商名称已存在', 'err'); return; }
    const data = {
      id: isEdit ? s.id : uid(), supplierNumber: $('#sfNo').value.trim(), supplierName: name,
      contactPerson: $('#sfContact').value.trim(), phoneNumber: $('#sfPhone').value.trim(),
      email: $('#sfEmail').value.trim(), companyAddress: $('#sfAddr').value.trim(),
      bankName: $('#sfBank').value.trim(), bankCode: $('#sfBankCode').value.trim(), bankAccount: $('#sfAccount').value.trim(),
      priority: $('#sfPrio').value, remarks: $('#sfRemark').value.trim(),
      createdAt: isEdit ? s.createdAt : new Date().toISOString()
    };
    if (isEdit) {
      // 同步更名到业务数据
      if (s.supplierName !== name) {
        ['orders', 'shipments', 'receipts', 'returns', 'invoices', 'payments'].forEach(c => {
          const arr = DB.get(c, []); let chg = false;
          arr.forEach(r => { if (r.supplier === s.supplierName) { r.supplier = name; chg = true; } });
          if (chg) DB.set(c, arr);
        });
      }
      Data.update('suppliers', s.id, data);
    } else Data.add('suppliers', data);
    closeModal(); toast('供应商已保存', 'ok'); renderPage();
  });
}

function pageReports(root) {
  const orders = Data.list('orders'), invs = Data.list('invoices'), pays = Data.list('payments');
  const totalAmount = orders.reduce((s, o) => s + (+o.totalAmount || 0), 0);
  const invoiced = invs.reduce((s, v) => s + (+v.amount || 0), 0);
  const paid = pays.reduce((s, p) => s + (+p.amount || 0), 0);
  const recvTotal = Data.list('receipts').reduce((s, r) => s + (+r.quantity || 0), 0);
  const retTotal = Data.list('returns').reduce((s, r) => s + (+r.quantity || 0), 0);
  root.innerHTML =
    '<div class="page-head"><h2>数据统计</h2><span class="desc">合同 · 开票 · 付款 · 供应商维度汇总</span><span class="spacer"></span>' +
    '<button class="btn btn-outline" id="repExport">导出供应商汇总CSV</button></div>' +
    '<div class="stat-grid">' +
    '<div class="stat-card hl"><div class="l">合同总金额</div><div class="v">' + fmtMoney(totalAmount) + '</div><div class="s">' + orders.length + ' 份合同</div></div>' +
    '<div class="stat-card"><div class="l">开票总额</div><div class="v">' + fmtMoney(invoiced) + '</div><div class="s">开票率 ' + (totalAmount ? Math.round(invoiced / totalAmount * 100) : 0) + '%</div></div>' +
    '<div class="stat-card good"><div class="l">付款总额</div><div class="v">' + fmtMoney(paid) + '</div><div class="s">待付 ' + fmtMoney(Math.max(0, invoiced - paid)) + '</div></div>' +
    '<div class="stat-card"><div class="l">收退货数量</div><div class="v">' + fmtNum(recvTotal) + ' / ' + fmtNum(retTotal) + '</div><div class="s">累计收货 / 退货</div></div></div>' +
    '<div class="card"><h3>供应商维度汇总（按合同金额）</h3><div id="repSupBox"></div></div>' +
    '<div class="card"><h3>月度趋势</h3><div id="repMonthBox"></div></div>';
  // 供应商汇总
  const supMap = {};
  orders.forEach(o => {
    const k = o.supplier || '—';
    supMap[k] = supMap[k] || { amount: 0, inv: 0, pay: 0, cnt: 0 };
    supMap[k].amount += +o.totalAmount || 0; supMap[k].cnt++;
  });
  invs.forEach(v => { const k = v.supplier || '—'; (supMap[k] = supMap[k] || { amount: 0, inv: 0, pay: 0, cnt: 0 }).inv += +v.amount || 0; });
  pays.forEach(p => { const k = p.supplier || '—'; (supMap[k] = supMap[k] || { amount: 0, inv: 0, pay: 0, cnt: 0 }).pay += +p.amount || 0; });
  const rows = Object.keys(supMap).sort((a, b) => supMap[b].amount - supMap[a].amount);
  const maxAmt = Math.max(1, ...rows.map(k => supMap[k].amount));
  $('#repSupBox').innerHTML = rows.length ? rows.map(k => {
    const m = supMap[k];
    return '<div class="bar-row"><span class="name" title="' + esc(k) + '">' + esc(k) + '</span>' +
      '<div class="track"><div class="fill" style="width:' + Math.round(m.amount / maxAmt * 100) + '%"></div></div>' +
      '<span class="val">' + fmtMoney(m.amount) + ' · ' + m.cnt + '单</span></div>' +
      '<div style="font-size:11.5px;color:var(--muted);margin:-4px 0 8px 180px">开票 ' + fmtMoney(m.inv) + ' · 付款 ' + fmtMoney(m.pay) + ' · 待付 ' + fmtMoney(Math.max(0, m.inv - m.pay)) + '</div>';
  }).join('') : '<div class="empty">暂无数据</div>';
  // 月度
  const monthMap = {};
  orders.forEach(o => { const k = (o.orderDate || '').slice(0, 7); if (k) (monthMap[k] = monthMap[k] || { amt: 0, inv: 0, pay: 0 }).amt += +o.totalAmount || 0; });
  invs.forEach(v => { const k = (v.invoiceDate || '').slice(0, 7); if (k) (monthMap[k] = monthMap[k] || { amt: 0, inv: 0, pay: 0 }).inv += +v.amount || 0; });
  pays.forEach(p => { const k = (p.paymentDate || '').slice(0, 7); if (k) (monthMap[k] = monthMap[k] || { amt: 0, inv: 0, pay: 0 }).pay += +p.amount || 0; });
  const months = Object.keys(monthMap).sort().reverse().slice(0, 12);
  $('#repMonthBox').innerHTML = months.length ? '<div class="tbl-wrap"><table><thead><tr><th>月份</th><th class="num">合同金额</th><th class="num">开票金额</th><th class="num">付款金额</th></tr></thead><tbody>' +
    months.map(m => '<tr><td><b>' + m + '</b></td><td class="num">' + fmtMoney(monthMap[m].amt) + '</td><td class="num">' + fmtMoney(monthMap[m].inv) + '</td><td class="num">' + fmtMoney(monthMap[m].pay) + '</td></tr>').join('') +
    '</tbody></table></div>' : '<div class="empty">暂无数据</div>';
  $('#repExport').addEventListener('click', () => exportCSV('供应商汇总导出.csv', ['供应商', '合同数', '合同金额', '开票金额', '付款金额', '待付金额'],
    rows.map(k => [k, supMap[k].cnt, supMap[k].amount, supMap[k].inv, supMap[k].pay, Math.max(0, supMap[k].inv - supMap[k].pay)])));
}

function pageTools(root) {
  root.innerHTML =
    '<div class="page-head"><h2>工具箱</h2><span class="desc">包装材料计算 · 快速测算木箱与方底袋面积、重量、价格</span></div>' +
    '<div class="calc-grid">' +
    /* 木箱 */
    '<div class="card"><h3>木箱计算器</h3><form id="boxF"><div class="form-grid">' +
    '<div><label>长 (m)</label><input id="bxL" type="number" step="0.01" min="0" required value="1.2"></div>' +
    '<div><label>宽 (m)</label><input id="bxW" type="number" step="0.01" min="0" required value="1"></div>' +
    '<div><label>高 (m)</label><input id="bxH" type="number" step="0.01" min="0" required value="1"></div>' +
    '<div><label>板厚 (mm)</label><input id="bxT" type="number" step="1" min="0" value="15"></div>' +
    '<div><label>托盘高度 (m)</label><input id="bxP" type="number" step="0.01" min="0" value="0.1"></div>' +
    '<div><label>数量</label><input id="bxQ" type="number" step="1" min="1" value="1"></div>' +
    '<div><label>单价 (元/㎡)</label><input id="bxPrice" type="number" step="0.01" min="0" value="55"></div>' +
    '</div><div style="margin-top:12px;display:flex;gap:8px"><button class="btn btn-primary" type="submit">计算</button><button class="btn btn-outline" type="button" id="bxSave">保存记录</button></div></form>' +
    '<div class="result-box" style="margin-top:12px" id="bxResult"><div class="empty">输入尺寸后点击计算</div></div></div>' +
    /* 方底袋 */
    '<div class="card"><h3>方底袋子计算器</h3><form id="bagF"><div class="form-grid">' +
    '<div><label>长 (cm)</label><input id="bgL" type="number" step="0.1" min="0" required value="60"></div>' +
    '<div><label>宽 (cm)</label><input id="bgW" type="number" step="0.1" min="0" required value="40"></div>' +
    '<div><label>高 (cm)</label><input id="bgH" type="number" step="0.1" min="0" required value="15"></div>' +
    '<div><label>数量</label><input id="bgQ" type="number" step="1" min="1" value="1000"></div>' +
    '<div><label>克重 (g/㎡)</label><select id="bgGsm"><option>120</option><option selected>150</option><option>180</option><option>200</option></select></div>' +
    '<div><label>单价&lt;6㎡ (元/㎡)</label><input id="bgP1" type="number" step="0.01" min="0" value="9"></div>' +
    '<div><label>单价≥6㎡ (元/㎡)</label><input id="bgP2" type="number" step="0.01" min="0" value="7"></div>' +
    '</div><div style="margin-top:12px;display:flex;gap:8px"><button class="btn btn-primary" type="submit">计算</button><button class="btn btn-outline" type="button" id="bgSave">保存记录</button></div></form>' +
    '<div class="result-box" style="margin-top:12px" id="bgResult"><div class="empty">输入尺寸后点击计算</div></div></div></div>' +
    '<div class="card"><h3>计算记录</h3><div style="margin-bottom:10px"><button class="btn btn-outline btn-sm" id="toolExport">导出CSV</button> <button class="btn btn-outline btn-sm" id="toolClear">清空记录</button></div><div id="toolRecBox"></div></div>';
  let lastBox = null, lastBag = null;
  $('#boxF').addEventListener('submit', e => {
    e.preventDefault();
    const L = +$('#bxL').value || 0, W = +$('#bxW').value || 0, H = +$('#bxH').value || 0;
    const T = (+$('#bxT').value || 0) / 1000, P = +$('#bxP').value || 0, Q = Math.max(1, +$('#bxQ').value || 1), price = +$('#bxPrice').value || 0;
    const innerV = L * W * H;
    const oL = L + 2 * T, oW = W + 2 * T, oH = H + T + P;
    const outerV = oL * oW * oH, totalV = outerV * Q;
    const area = 2 * (L * W + L * H + W * H);
    const total = area * price * Q;
    lastBox = { type: '木箱', L, W, H, T: T * 1000, P, Q, price, innerV, outerV, totalV, area, total, at: new Date().toISOString() };
    // 集装箱推荐
    const conts = [['20GP', 5.898, 2.352, 2.385, 28], ['40GP', 12.032, 2.352, 2.385, 67], ['40HQ', 12.032, 2.352, 2.697, 76]];
    const fits = conts.map(c => {
      const use = (Math.floor(c[1] / oL) * Math.floor(c[2] / oW) * Math.floor(c[3] / oH));
      const useSwap = (Math.floor(c[1] / oW) * Math.floor(c[2] / oL) * Math.floor(c[3] / oH));
      const best = Math.max(use, useSwap);
      return { name: c[0], per: best, util: c[4] ? Math.min(100, Math.round(best * outerV / c[4] * 100)) : 0, need: best ? Math.ceil(Q / best) : '—' };
    }).filter(c => c.per > 0).sort((a, b) => b.util - a.util);
    const contHtml = fits.length ? '<div style="margin-top:8px;font-size:12px;color:var(--muted)">集装箱装载参考（单箱可装 ' + fits[0].per + ' 件）：' + fits.map(c => c.name + ' 利用率 ' + c.util + '% · 需 ' + c.need + ' 柜').join('；') + '</div>' : '';
    $('#bxResult').innerHTML =
      '<div class="result-line"><span class="rk">单箱表面积</span><span class="rv">' + area.toFixed(4) + ' ㎡</span></div>' +
      '<div class="result-line"><span class="rk">内体积</span><span class="rv">' + innerV.toFixed(4) + ' m³</span></div>' +
      '<div class="result-line"><span class="rk">外体积</span><span class="rv">' + outerV.toFixed(4) + ' m³</span></div>' +
      '<div class="result-line"><span class="rk">总体积（×' + Q + '）</span><span class="rv">' + totalV.toFixed(4) + ' m³</span></div>' +
      '<div class="result-line total"><span class="rk">木箱总价</span><span class="rv">' + fmtMoney(total) + '</span></div>' + contHtml;
  });
  $('#bagF').addEventListener('submit', e => {
    e.preventDefault();
    const L = +$('#bgL').value || 0, W = +$('#bgW').value || 0, H = +$('#bgH').value || 0;
    const Q = Math.max(1, +$('#bgQ').value || 1), gsm = +$('#bgGsm').value || 150;
    const p1 = +$('#bgP1').value || 9, p2 = +$('#bgP2').value || 7;
    const area = (L * W + 2 * L * H + 2 * W * H) / 10000;
    const totalArea = area * Q;
    const w1 = area * gsm / 1000, tw = w1 * Q;
    const up = totalArea < 6 ? p1 : p2;
    const total = totalArea * up, unit = total / Q;
    lastBag = { type: '方底袋', L, W, H, Q, gsm, area, totalArea, w1, tw, unit, total, at: new Date().toISOString() };
    $('#bgResult').innerHTML =
      '<div class="result-line"><span class="rk">单袋表面积</span><span class="rv">' + area.toFixed(4) + ' ㎡</span></div>' +
      '<div class="result-line"><span class="rk">总表面积（×' + Q + '）</span><span class="rv">' + totalArea.toFixed(4) + ' ㎡</span></div>' +
      '<div class="result-line"><span class="rk">单袋重量</span><span class="rv">' + w1.toFixed(4) + ' kg</span></div>' +
      '<div class="result-line"><span class="rk">总重量</span><span class="rv">' + tw.toFixed(4) + ' kg</span></div>' +
      '<div class="result-line"><span class="rk">适用单价</span><span class="rv">' + fmtMoney(up).slice(1) + ' 元/㎡（' + (totalArea < 6 ? '<6㎡' : '≥6㎡') + '）</span></div>' +
      '<div class="result-line total"><span class="rk">总价格</span><span class="rv">' + fmtMoney(total) + '</span></div>' +
      '<div class="result-line total"><span class="rk">单袋单价</span><span class="rv">' + fmtMoney(unit) + '</span></div>';
  });
  const saveRec = rec => { if (!rec) { toast('请先完成一次计算', 'err'); return; } const arr = DB.get('tool_records', []); arr.unshift(rec); DB.set('tool_records', arr.slice(0, 200)); drawRecs(); toast('已保存计算记录', 'ok'); };
  $('#bxSave').addEventListener('click', () => saveRec(lastBox));
  $('#bgSave').addEventListener('click', () => saveRec(lastBag));
  const drawRecs = () => {
    const arr = DB.get('tool_records', []);
    $('#toolRecBox').innerHTML = arr.length ? '<div class="tbl-wrap" style="max-height:30vh"><table><thead><tr><th>时间</th><th>类型</th><th>尺寸</th><th>数量</th><th class="num">表面积</th><th class="num">总价</th></tr></thead><tbody>' +
      arr.map(r => '<tr><td style="white-space:nowrap">' + (r.at || '').replace('T', ' ').slice(0, 16) + '</td><td><span class="badge b-blue">' + r.type + '</span></td>' +
        '<td>' + (r.type === '木箱' ? r.L + '×' + r.W + '×' + r.H + 'm' : r.L + '×' + r.W + '×' + r.H + 'cm') + '</td><td>' + r.Q + '</td>' +
        '<td class="num">' + (r.totalArea || r.area).toFixed(2) + ' ㎡</td><td class="num"><b>' + fmtMoney(r.total) + '</b></td></tr>').join('') + '</tbody></table></div>'
      : '<div class="empty">暂无计算记录</div>';
  };
  $('#toolExport').addEventListener('click', () => exportCSV('计算记录导出.csv', ['时间', '类型', '长', '宽', '高', '数量', '表面积', '总价'],
    DB.get('tool_records', []).map(r => [r.at, r.type, r.L, r.W, r.H, r.Q, r.totalArea || r.area, r.total])));
  $('#toolClear').addEventListener('click', () => { if (confirm('清空全部计算记录？')) { DB.del('tool_records'); drawRecs(); } });
  drawRecs();
}

  const roleName = k => (roles.find(r => r.key === k) || {}).name || k;
  box.innerHTML = '<div style="margin-bottom:12px"><button class="btn btn-primary" id="uAdd">＋ 新建用户</button><span class="hint" style="display:inline-block;margin-left:12px">共 ' + users.length + ' 个用户 · 供应商角色用户只能查看自己名下数据</span></div>' +
    '<div class="tbl-wrap"><table><thead><tr><th>用户名</th><th>姓名</th><th>角色</th><th>关联供应商</th><th>状态</th><th>创建时间</th><th style="width:230px">操作</th></tr></thead><tbody>' +
    users.map(u => '<tr><td class="mono"><b>' + esc(u.username) + '</b></td><td>' + esc(u.name || '') + '</td>' +
      '<td><span class="badge ' + (u.role === 'admin' ? 'b-purple' : u.role === 'supplier' ? 'b-blue' : 'b-gray') + '">' + esc(roleName(u.role)) + '</span></td>' +
      '<td>' + esc(u.supplierName || '—') + '</td>' +
      '<td>' + (u.active !== false ? '<span class="badge b-green">启用</span>' : '<span class="badge b-red">停用</span>') + '</td>' +
      '<td style="color:var(--muted)">' + fmtDate((u.createdAt || '').slice(0, 10)) + '</td>' +
      '<td><button class="link-op" data-a="e" data-id="' + u.id + '">编辑</button>' +
      '<button class="link-op" data-a="p" data-id="' + u.id + '">重置密码</button>' +
      '<button class="link-op" data-a="t" data-id="' + u.id + '">' + (u.active !== false ? '停用' : '启用') + '</button>' +
      (u.username !== 'admin' ? '<button class="link-op danger" data-a="d" data-id="' + u.id + '">删除</button>' : '') + '</td></tr>').join('') +
    '</tbody></table></div>';
  $('#uAdd').addEventListener('click', () => userForm(null));
  box.querySelectorAll('button[data-a]').forEach(b => b.addEventListener('click', async () => {
    const users2 = DB.get('users', []); const u = users2.find(x => x.id === b.dataset.id); if (!u) return;
    const a = b.dataset.a;
    if (a === 'e') userForm(u);
    else if (a === 'p') {
      const np = prompt('为用户「' + u.username + '」设置新密码：'); if (!np) return;
      u.pwd = await hashPwd(np); DB.set('users', users2); toast('密码已重置', 'ok');
    } else if (a === 't') { u.active = u.active === false ? true : false; DB.set('users', users2); toast('已' + (u.active ? '启用' : '停用'), 'ok'); renderPage(); }
    else if (a === 'd') { if (confirm('删除用户「' + u.username + '」？')) { DB.set('users', users2.filter(x => x.id !== u.id)); toast('已删除', 'ok'); renderPage(); } }
  }));
}
function userForm(u) {
  const isEdit = !!u;
  const roles = DB.get('roles', []), sups = DB.get('suppliers', []);
  openModal('<h3>' + (isEdit ? '编辑用户' : '新建用户') + '</h3><form id="uF"><div class="form-grid">' +
    '<div><label class="req">用户名</label><input id="ufName" required value="' + esc(u ? u.username : '') + '"' + (isEdit ? ' readonly' : '') + '></div>' +
    '<div><label>姓名</label><input id="ufDisplay" value="' + esc(u ? (u.name || '') : '') + '"></div>' +
    (isEdit ? '' : '<div><label class="req">初始密码</label><input id="ufPwd" type="text" required value="" placeholder="至少4位"></div>') +
    '<div><label class="req">角色</label><select id="ufRole">' + roles.map(r => '<option value="' + esc(r.key) + '"' + (u && u.role === r.key ? ' selected' : '') + '>' + esc(r.name) + '</option>').join('') + '</select></div>' +
    '<div id="ufSupWrap" style="display:none"><label>关联供应商</label><select id="ufSup"><option value="">请选择</option>' + sups.map(s => '<option' + (u && u.supplierName === s.supplierName ? ' selected' : '') + '>' + esc(s.supplierName) + '</option>').join('') + '</select></div>' +
    '</div><div class="hint">供应商角色用户登录后，仅能看到其关联供应商名下的合同、发货、收货、发票、付款与对账数据。</div>' +
    '<div class="modal-foot"><button type="button" class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary">保存</button></div></form>');
  const toggleSup = () => {
    const r = DB.get('roles', []).find(x => x.key === $('#ufRole').value);
    $('#ufSupWrap').style.display = r && r.supplierRole ? 'block' : 'none';
  };
  $('#ufRole').addEventListener('change', toggleSup); toggleSup();
  $('#uF').addEventListener('submit', async e => {
    e.preventDefault();
    const users = DB.get('users', []);
    const un = $('#ufName').value.trim();
    const dup = users.find(x => x.username === un && (!isEdit || x.id !== u.id));
    if (dup) { toast('用户名已存在', 'err'); return; }
    const roleKey = $('#ufRole').value;
    const rDef = roles.find(r => r.key === roleKey);
    let supplierName = '';
    if (rDef && rDef.supplierRole) { supplierName = $('#ufSup').value; if (!supplierName) { toast('请选择关联供应商', 'err'); return; } }
    if (isEdit) {
      u.name = $('#ufDisplay').value.trim(); u.role = roleKey; u.supplierName = supplierName;
      DB.set('users', users);
    } else {
      const pwd = $('#ufPwd').value; if (pwd.length < 4) { toast('密码至少4位', 'err'); return; }
      users.unshift({ id: uid(), username: un, pwd: await hashPwd(pwd), name: $('#ufDisplay').value.trim(), role: roleKey, supplierName, active: true, createdAt: new Date().toISOString() });
      DB.set('users', users);
    }
    closeModal(); toast('用户已保存', 'ok'); renderPage();
  });
}
function adminRoles() {
  const box = $('#adminBox');
  const roles = DB.get('roles', []);
  const pages = PAGES.filter(p => !p.adminOnly);
  box.innerHTML = '<div style="margin-bottom:12px;display:flex;gap:10px;align-items:center"><button class="btn btn-primary" id="rAdd">＋ 新建角色</button><span class="hint" style="display:inline-block">勾选 = 该角色可访问对应模块；「管理员」「供应商」为系统内置角色不可删除</span></div>' +
    '<div class="tbl-wrap"><table class="perm-matrix"><thead><tr><th style="min-width:120px">模块</th>' + roles.map(r => '<th>' + esc(r.name) + (r.locked ? ' <span style="font-size:10px;color:#94a3b8">内置</span>' : '') + '</th>').join('') + '</tr></thead><tbody>' +
    pages.map(p => '<tr><td><b>' + esc(p.name) + '</b><span style="font-size:11px;color:#94a3b8"> ' + p.key + '</span></td>' +
      roles.map(r => {
        if (r.key === 'admin') return '<td><input type="checkbox" checked disabled title="管理员拥有全部权限"></td>';
        return '<td><input type="checkbox" data-role="' + r.id + '" data-page="' + p.key + '"' + ((r.permissions || {})[p.key] ? ' checked' : '') + '></td>';
      }).join('') + '</tr>').join('') +
    '</tbody></table></div>' +
    '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">' + roles.filter(r => !r.locked).map(r => '<button class="btn btn-outline btn-sm" data-del="' + r.id + '">删除角色：' + esc(r.name) + '</button>').join('') + '</div>';
  box.querySelectorAll('input[data-role]').forEach(c => c.addEventListener('change', () => {
    const roles2 = DB.get('roles', []); const r = roles2.find(x => x.id === c.dataset.role);
    if (!r) return; r.permissions = r.permissions || {}; r.permissions[c.dataset.page] = c.checked;
    DB.set('roles', roles2); toast('权限已保存：' + r.name + ' · ' + c.dataset.page, 'ok');
  }));
  box.querySelectorAll('button[data-del]').forEach(b => b.addEventListener('click', () => {
    const roles2 = DB.get('roles', []); const r = roles2.find(x => x.id === b.dataset.del); if (!r) return;
    if (DB.get('users', []).find(u => u.role === r.key)) { toast('仍有用户使用该角色，无法删除', 'err'); return; }
    if (confirm('删除角色「' + r.name + '」？')) { DB.set('roles', roles2.filter(x => x.id !== r.id)); toast('已删除', 'ok'); renderPage(); }
  }));
  $('#rAdd').addEventListener('click', () => {
    const name = prompt('新角色名称：'); if (!name || !name.trim()) return;
    const roles2 = DB.get('roles', []);
    const key = 'role_' + Date.now().toString(36);
    roles2.push({ id: uid(), key, name: name.trim(), locked: false, permissions: Object.fromEntries(PAGES.map(p => [p.key, p.key === 'dashboard'])) });
    DB.set('roles', roles2); toast('角色已创建，请在矩阵中勾选权限', 'ok'); renderPage();
  });
}
function adminCompanies() {
  const box = $('#adminBox');
  const comps = DB.get('companies', []);
  box.innerHTML = '<div style="margin-bottom:12px"><button class="btn btn-primary" id="cAdd">＋ 添加公司抬头</button><span class="hint" style="display:inline-block;margin-left:12px">业务数据按公司主体隔离，切换公司后各模块仅显示当前公司数据</span></div>' +
    '<div class="tbl-wrap"><table><thead><tr><th>编码</th><th>公司名称</th><th style="width:140px">操作</th></tr></thead><tbody>' +
    comps.map((c, i) => '<tr><td class="mono">' + esc(c.code) + '</td><td>' + esc(c.name) + '</td>' +
      '<td><button class="link-op" data-i="' + i + '" data-a="e">编辑</button><button class="link-op danger" data-i="' + i + '" data-a="d">删除</button></td></tr>').join('') +
    '</tbody></table></div>';
  $('#cAdd').addEventListener('click', () => companyForm(null));
  box.querySelectorAll('button[data-a]').forEach(b => b.addEventListener('click', () => {
    const c = DB.get('companies', [])[+b.dataset.i]; if (!c) return;
    if (b.dataset.a === 'e') companyForm(c);
    else if (confirm('删除公司抬头「' + c.name + '」？其名下业务数据将不再显示（数据不删除）。')) { DB.set('companies', DB.get('companies', []).filter(x => x.code !== c.code)); toast('已删除', 'ok'); renderPage(); }
  }));
}
function companyForm(c) {
  const isEdit = !!c;
  openModal('<h3>' + (isEdit ? '编辑公司抬头' : '添加公司抬头') + '</h3><form id="cF"><div class="form-grid">' +
    '<div><label class="req">编码</label><input id="cfCode" required value="' + esc(c ? c.code : 'company' + (DB.get('companies', []).length + 1)) + '"' + (isEdit ? ' readonly' : '') + '></div>' +
    '<div style="grid-column:1/-1"><label class="req">公司名称</label><input id="cfName" required value="' + esc(c ? c.name : '') + '"></div></div>' +
    '<div class="modal-foot"><button type="button" class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary">保存</button></div></form>');
  $('#cF').addEventListener('submit', e => {
    e.preventDefault();
    const comps = DB.get('companies', []);
    const data = { code: $('#cfCode').value.trim(), name: $('#cfName').value.trim() };
    if (isEdit) { const i = comps.findIndex(x => x.code === c.code); comps[i] = data; }
    else { if (comps.find(x => x.code === data.code)) { toast('编码已存在', 'err'); return; } comps.push(data); }
    DB.set('companies', comps); closeModal(); toast('公司抬头已保存', 'ok'); renderFrame();
  });
}
function adminData() {
  const box = $('#adminBox');
  const env = CloudBase.env();
  box.innerHTML =
    '<h3 style="font-size:14px;margin-bottom:10px">本地备份</h3>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px">' +
    '<button class="btn btn-primary" id="dExport">⬇ 备份到电脑（JSON）</button>' +
    '<label class="btn btn-outline" style="cursor:pointer">⬆ 从电脑恢复<input type="file" id="dImport" accept=".json" style="display:none"></label></div>' +
    '<div class="hint">备份包含用户、角色、供应商及全部业务数据；恢复将覆盖当前本地数据。</div>' +
    '<h3 style="font-size:14px;margin:18px 0 10px">腾讯云 CloudBase（预留）</h3>' +
    '<div class="row-flex"><div style="min-width:260px"><label>环境 ID（Env ID）</label><input id="cbEnv" value="' + esc(env) + '" placeholder="如：your-env-id"></div>' +
    '<div style="align-self:flex-end"><button class="btn btn-outline" id="cbSaveEnv">保存环境ID</button></div>' +
    '<div style="align-self:flex-end"><button class="btn btn-success" id="cbPush">⬆ 上传快照到云端</button></div>' +
    '<div style="align-self:flex-end"><button class="btn btn-primary" id="cbPull">⬇ 从云端下载快照</button></div></div>' +
    '<div class="hint">迁移步骤：① 引入 CloudBase JS-SDK（<span class="mono">https://static.cloudbase.net/cloudbase-js-sdk/&lt;ver&gt;/cloudbase.full.js</span>）；② 填入环境ID并保存；③ 在云数据库创建集合 <span class="mono">pis_snapshots</span>；④ 点击上传/下载进行全量快照同步。数据层（DB/Data）已按集合抽象，后续可直接切换为云数据库逐集合读写，业务代码无需改动。</div>' +
    '<div class="hint" id="cbStatus">当前状态：' + (CloudBase.ready() ? '<b style="color:var(--green)">SDK 已加载，环境 ' + esc(env) + '</b>' : (env ? '环境ID已保存，等待引入 SDK' : '未配置')) + '</div>' +
    '<h3 style="font-size:14px;margin:18px 0 10px;color:var(--red)">危险操作</h3>' +
    '<button class="btn btn-danger" id="dClear">清空本地业务数据</button><span class="hint" style="display:inline-block;margin-left:10px">仅保留用户 / 角色 / 公司 / 供应商结构，业务单据全部清空，请先备份！</span>';
  $('#dExport').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(DB.snapshot(), null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = '采购一体化系统备份_' + todayStr() + '.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 800); toast('备份已下载', 'ok');
  });
  $('#dImport').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { DB.restore(JSON.parse(rd.result)); toast('恢复成功，即将刷新', 'ok'); setTimeout(() => location.reload(), 800); } catch (err) { toast('恢复失败：' + err.message, 'err'); } };
    rd.readAsText(f);
  });
  $('#cbSaveEnv').addEventListener('click', () => { CloudBase.setEnv($('#cbEnv').value); toast('环境ID已保存', 'ok'); renderPage(); });
  $('#cbPush').addEventListener('click', async () => {
    try { await CloudBase.push(); toast('快照已上传到 CloudBase', 'ok'); } catch (e) { toast(e.message, 'err'); }
  });
  $('#cbPull').addEventListener('click', async () => {
    try { await CloudBase.pull(); toast('快照已下载，即将刷新', 'ok'); setTimeout(() => location.reload(), 800); } catch (e) { toast(e.message, 'err'); }
  });
  $('#dClear').addEventListener('click', () => {
    if (!confirm('⚠️ 此操作将清空全部业务单据（合同/发货/收货/退货/发票/付款），且不可恢复！是否继续？')) return;
    if (!confirm('再次确认：请确保已备份！确定清空？')) return;
    DB.clearBiz(); toast('业务数据已清空', 'ok'); renderPage();
  });
}

/* ==========================================================
   登录 / 模态框 / 启动
   ========================================================== */
function openModal(html, size) {
  const box = $('#modalBox'); box.className = 'modal' + (size === 'wide' ? ' wide' : size === 'narrow' ? ' narrow' : '');
  box.innerHTML = html; $('#modalMask').classList.add('show');
}
function closeModal() { $('#modalMask').classList.remove('show'); $('#modalBox').innerHTML = ''; }
$('#modalMask').addEventListener('click', e => { if (e.target === $('#modalMask')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

async function doLogin() {
  const un = $('#loginUser').value.trim(), pwd = $('#loginPwd').value;
  if (!un || !pwd) { $('#loginErr').textContent = '请输入用户名和密码'; return; }
  await ensureAdminHash();
  const users = DB.get('users', []);
  const u = users.find(x => x.username.toLowerCase() === un.toLowerCase());
  const h = await hashPwd(pwd);
  if (!u || u.pwd !== h) { $('#loginErr').textContent = '用户名或密码错误'; return; }
  if (u.active === false) { $('#loginErr').textContent = '该账号已被停用，请联系管理员'; return; }
  Session.user = u; saveSession();
  $('#loginErr').textContent = ''; $('#loginPwd').value = '';
  $('#loginMask').classList.add('hidden'); $('#app').classList.add('show');
  State.company = DB.get('curCompany', 'companyA');
  const comps = DB.get('companies', []);
  if (!comps.find(c => c.code === State.company)) State.company = comps.length ? comps[0].code : 'companyA';
  renderFrame();
  toast('欢迎，' + (u.name || u.username), 'ok');
}
$('#loginBtn').addEventListener('click', doLogin);
$('#loginPwd').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('#logoutBtn').addEventListener('click', () => {
  DB.set('curCompany', State.company);
  Session.user = null; sessionStorage.removeItem('pis_session');
  $('#app').classList.remove('show'); $('#loginMask').classList.remove('hidden');
  $('#loginUser').value = ''; $('#loginPwd').value = '';
});
$('#companySelect').addEventListener('change', e => {
  State.company = e.target.value; DB.set('curCompany', State.company);
  renderFrame(); toast('已切换到：' + getCompany(State.company), 'info');
});

/* 启动 */
seed();
loadSession();
if (Session.user) {
  // 恢复会话
  $('#loginMask').classList.add('hidden'); $('#app').classList.add('show');
  State.company = DB.get('curCompany', 'companyA');
  renderFrame();
} else {
  $('#loginUser').focus();
}
</script>
</body>
