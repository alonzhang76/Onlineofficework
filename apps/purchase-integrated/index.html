<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>采购一体化系统</title>
<style>
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#0d5f7a;color:#fff;
  display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-size:14px;letter-spacing:1px}
a{color:#fff}
</style>
</head>
<body>
<noscript>
  <p>需要启用 JavaScript。<a href="login.html">前往登录页</a></p>
</noscript>
<script>
/* 智能入口：有有效会话 → 采购管理；否则 → 登录页 */
(function () {
  'use strict';
  function toLogin() { location.replace('login.html'); }
  var raw = null;
  try { raw = sessionStorage.getItem('pis_session'); } catch (e) { toLogin(); return; }
  if (!raw) { toLogin(); return; }
  var sess = null;
  try { sess = JSON.parse(raw); } catch (e) { toLogin(); return; }
  var users = [];
  try { users = JSON.parse(localStorage.getItem('pis_users') || '[]'); if (!Array.isArray(users)) users = []; } catch (e) { users = []; }
  var cur = users.find(function (x) { return x && x.id === sess.id; });
  if (cur && cur.active !== false) location.replace('purchase.html');
  else toLogin();
})();
</script>
</body>
</html>
