<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>采购管理 · 采购一体化系统</title>
<link rel="stylesheet" href="css/common.css?v=20260930c">
</head>
<body>
<header>
  <div class="logo"><span class="mark"><svg width="18" height="18" viewBox="0 0 48 48"><use href="#rrlogo"/></svg></span>采购一体化系统</div>
  <div class="nav-wrap">
    <button class="nav-btn" id="navMenuBtn" type="button">菜单 <span class="caret">▾</span></button>
    <div class="nav-menu" id="navMenu"></div>
  </div>
  <span class="hspace"></span>
  <div class="company-select" id="companySelectWrap">
    <span>公司主体</span><select id="companySelect"></select>
  </div>
  <div class="userbox">
    <b class="uname" id="whoName">—</b>
    <button class="btn-exit" id="logoutBtn">退出</button>
  </div>
</header>
<div class="layout">
  <main id="main"></main>
</div>
<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toastBox"></div>
<div id="printArea"></div>
<script>
/* 云端数据（与其它应用同一套 cloudbase-sync 机制）：独立命名空间 purchase-integrated，
   仅同步本应用业务键；pis_reim_api 等本机配置、会话信息不同步 */
window.CLOUDBASE_APP_ID='purchase-integrated';
window.CLOUDBASE_APP_KEYS=['pis_companies','pis_units','pis_terms','pis_roles','pis_users','pis_suppliers','pis_curCompany','pis_orders','pis_shipments','pis_receipts','pis_returns','pis_invoices','pis_payments','pis_tool_records','pis_poPageSize','pis_plyPaste'];
window.CLOUDBASE_APP_KEY_PREFIXES=['pis_seq_'];
</script>
<script src="../cloudbase-sync.js?v=20260924f"></script>
<script src="../cloudbase-admin.js?v=20260930a"></script>
<script src="js/common.js?v=20260930g"></script>
<script src="js/auth-guard.js"></script>
<script>
'use strict';
/* ==========================================================
   采购管理
   ========================================================== */
let poPg = 1, poSize = +(localStorage.getItem('pis_poPageSize') || 15);
let poSel = new Set(); // 勾选的合同 id（跨页保持）
function pagePurchase(root) {
  const canW = Session.canWrite('purchase');
  root.innerHTML =
    '<div class="page-head"><h2>采购管理</h2><span class="desc">采购订单明细 · 按产品行展示 · 数量与金额合计</span><span class="spacer"></span>' +
      (canW ? '<button class="btn btn-primary" id="poAdd">＋ 新建</button>' : '') +
      '<div class="more-wrap" id="poMoreWrap"></div></div>' +
    '<input type="file" id="poImportFile" accept=".xlsx,.xls,.csv" style="display:none">' +
    '<div class="card"><div class="row-flex" style="margin-bottom:12px"><div style="flex:1;max-width:340px"><label>搜索</label><input id="poSearch" placeholder="合同号 / 供应商 / 产品 / 规格 / 成本类别"></div></div>' +
    '<div id="pgBar" class="pgbar"></div>' +
    '<div id="poTableBox"></div></div>';
  $('#poSearch').addEventListener('input', () => { poPg = 1; draw(); });
  if (canW) $('#poAdd').addEventListener('click', () => orderForm(null));
  $('#poMoreWrap').innerHTML = moreMenuHTML('poMore', [
    { m: 'import', label: '📥 导入EXCEL' },
    { m: 'export', label: '📤 导出EXCEL' }
  ].concat(canW ? [
    { m: 'copy', label: '📄 复制' },
    { m: 'clear', label: '🗑 清空', cls: 'danger' }
  ] : []));
  bindMoreMenu('poMore', {
    import: () => { if (Session.isSupplier()) return; $('#poImportFile').click(); },
    export: () => { if (Session.isSupplier()) return; exportOrdersExcel(); },
    copy: copyOrder,
    clear: clearOrders
  });
  /* 供应商只读采购管理：「更多」整体置灰不可用（导入/导出/复制/清空均不开放）。
     原生 disabled 按钮不触发 click，菜单无法展开；下方处理器内再做一次角色兜底。 */
  if (Session.isSupplier()) { const mb = $('#poMore'); if (mb) { mb.disabled = true; mb.title = '供应商账号不可用'; } }
  $('#poImportFile').addEventListener('change', e => { if (Session.isSupplier()) { e.target.value = ''; return; } handleImportFile(e.target.files[0]); e.target.value = ''; });
  draw();
  function draw() { drawPurchaseTable($('#poTableBox'), ($('#poSearch').value || '').trim().toLowerCase()); }
}
const poAmtOf = p => (+p.amount || ((+p.unitPrice || 0) * (+p.quantity || 0)));
/* 公司圆点徽标：合同号前圆形底色+简称首字，区分公司主体（普利美=蓝、龙力=橙，其余按公司列表顺序取色） */
function coDot(code) {
  const cos = DB.get('companies', []);
  let i = cos.findIndex(c => c.code === code); if (i < 0) i = 0;
  const palette = ['#2563eb', '#ea580c', '#16a34a', '#9333ea', '#e11d48', '#0891b2'];
  return '<span class="co-dot" style="background:' + palette[i % palette.length] + '" title="' + esc(getCompany(code)) + '">' + esc((code || '？').charAt(0)) + '</span>';
}
function drawPurchaseTable(box, kw) {
  const all = Data.list('orders');
  let orders = all;
  if (kw) orders = all.filter(o => [o.contractNumber, o.po, o.supplier, o.remark, o.actualDate, (o.products || []).map(p => [p.name, p.spec, p.category, p.remark].join(' ')).join(' ')].join(' ').toLowerCase().includes(kw));
  orders.sort((a, b) => (b.orderDate || '').localeCompare(a.orderDate || '') || (b.contractNumber || '').localeCompare(a.contractNumber || ''));
  // 展开为产品明细行（每个产品一行，同参考表格）
  const lines = [];
  orders.forEach(o => (o.products || []).forEach(p => lines.push({ o, p })));
  const qSum = lines.reduce((s, l) => s + (+l.p.quantity || 0), 0);
  const aSum = lines.reduce((s, l) => s + poAmtOf(l.p), 0);
  // 分页（表格左上角）
  const totalPages = Math.max(1, Math.ceil(lines.length / poSize));
  if (poPg > totalPages) poPg = totalPages;
  const pageLines = lines.slice((poPg - 1) * poSize, poPg * poSize);
  $('#pgBar').innerHTML =
    '<div class="pg-left">共 <b>' + orders.length + '</b> 份合同 · <b>' + lines.length + '</b> 条明细' +
    '<button class="pg-btn" id="pgPrev"' + (poPg <= 1 ? ' disabled' : '') + '>‹ 上一页</button>' +
    '<span class="pg-cur">第 ' + poPg + ' / ' + totalPages + ' 页</span>' +
    '<button class="pg-btn" id="pgNext"' + (poPg >= totalPages ? ' disabled' : '') + '>下一页 ›</button>' +
    '<label style="display:flex;align-items:center;gap:5px;white-space:nowrap;flex:none">每页<select id="pgSize">' + [15, 30, 50, 100].map(n => '<option' + (n === poSize ? ' selected' : '') + '>' + n + '</option>').join('') + '</select>条</label></div>' +
    '<div class="pg-right pg-sum"><span>数量合计 <b>' + fmtNum(qSum) + '</b></span><span>金额合计 <b>' + fmtMoney(aSum) + '</b></span></div>';
  $('#pgPrev').addEventListener('click', () => { poPg--; drawPurchaseTable(box, kw); });
  $('#pgNext').addEventListener('click', () => { poPg++; drawPurchaseTable(box, kw); });
  $('#pgSize').addEventListener('change', e => { poSize = +e.target.value; localStorage.setItem('pis_poPageSize', poSize); poPg = 1; drawPurchaseTable(box, kw); });
  if (!lines.length) { box.innerHTML = '<div class="empty">暂无采购明细</div>'; return; }
  const today = todayStr();
  let prevOid = null;
  const pageIds = []; // 本页出现的合同 id（全选用）
  const body = pageLines.map(l => {
    const o = l.o, p = l.p, st = orderStatus(o);
    const first = o.id !== prevOid; prevOid = o.id;
    if (first) pageIds.push(o.id);
    const selRow = poSel.has(o.id); // 勾选的合同整条高亮
    const cls = (first ? 'grp-start' : '') + (first && selRow ? ' ' : '') + (selRow ? 'sel' : '');
    const late = o.deliveryDate && o.deliveryDate < today && (st.t === '未收货' || st.t === '部分收货');
    return '<tr' + (cls ? ' class="' + cls + '"' : '') + ' data-oid="' + o.id + '">' +
      '<td style="text-align:center">' + (first ? '<input type="checkbox" class="po-chk" data-id="' + o.id + '"' + (selRow ? ' checked' : '') + ' title="勾选该合同（配合「更多 · 复制」）">' : '') + '</td>' +
      '<td class="mono"' + (first ? ' style="font-weight:700"' : '') + '>' + coDot(o.company) + esc(o.contractNumber) + '</td>' +
      '<td class="subtle"' + (first ? ' style="color:var(--text)"' : '') + '>' + esc(o.po || '') + '</td>' +
      '<td>' + esc(o.supplier) + '</td>' +
      '<td class="subtle">' + esc(o.orderDate || '') + '</td>' +
      '<td class="subtle"' + (late ? ' style="color:#e5484d;font-weight:600"' : '') + '>' + esc(o.deliveryDate || '') + (late ? ' ⚠' : '') + '</td>' +
      '<td>' + esc(p.name) + '</td>' +
      '<td class="subtle">' + esc(p.spec || '') + '</td>' +
      '<td class="num">' + fmtMoney(p.unitPrice) + '</td>' +
      '<td class="num"><b>' + fmtNum(p.quantity) + '</b></td>' +
      '<td class="subtle">' + esc(p.unit || '') + '</td>' +
      '<td class="num"><b>' + fmtMoney(poAmtOf(p)) + '</b></td>' +
      '<td>' + (p.category ? '<span class="badge b-purple">' + esc(p.category) + '</span>' : '<span class="subtle">—</span>') + '</td>' +
      '<td class="subtle" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(p.remark || '') + '">' + esc(p.remark || '') + '</td>' +
      '<td class="subtle" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(o.remark || '') + '">' + esc(o.remark || '') + '</td>' +
      '<td style="white-space:nowrap">' + (first ? '<button class="link-op" data-act="detail" data-id="' + o.id + '">明细</button><button class="link-op" data-act="print" data-id="' + o.id + '">打印</button>' +
        (Session.canWrite('purchase') ? '<button class="link-op" data-act="edit" data-id="' + o.id + '">编辑</button><button class="link-op danger" data-act="del" data-id="' + o.id + '">删除</button>' : '') : '') + '</td></tr>';
  }).join('');
  const foot = '<tr><td colspan="9" style="text-align:right">本页合计</td><td class="num">' + fmtNum(pageLines.reduce((s, l) => s + (+l.p.quantity || 0), 0)) + '</td><td></td><td class="num">' + fmtMoney(pageLines.reduce((s, l) => s + poAmtOf(l.p), 0)) + '</td><td colspan="4"></td></tr>';
  box.innerHTML = '<div class="tbl-wrap" style="max-height:60vh"><table class="po-tb"><thead><tr>' +
    '<th style="width:34px;text-align:center"><input type="checkbox" id="poSelAll" title="全选 / 取消本页合同"></th>' +
    '<th>合同号</th><th>PO</th><th>供应商</th><th>合同日期</th><th>交货期</th><th>产品名称</th><th>规格型号</th><th class="num">单价</th><th class="num">数量</th><th>单位</th><th class="num">总金额(含税)</th><th>成本类别</th><th>说明</th><th>备注</th><th style="width:158px">操作</th></tr></thead><tbody>' +
    body + '</tbody><tfoot>' + foot + '</tfoot></table></div>';
  box.querySelectorAll('.po-chk').forEach(chk => chk.addEventListener('change', () => {
    if (chk.checked) poSel.add(chk.dataset.id); else poSel.delete(chk.dataset.id);
    box.querySelectorAll('tr[data-oid="' + chk.dataset.id + '"]').forEach(tr => tr.classList.toggle('sel', chk.checked));
  }));
  const allChk = $('#poSelAll');
  if (allChk) {
    allChk.checked = pageIds.length > 0 && pageIds.every(id => poSel.has(id));
    allChk.addEventListener('change', () => {
      pageIds.forEach(id => { if (allChk.checked) poSel.add(id); else poSel.delete(id); });
      box.querySelectorAll('.po-chk').forEach(chk => { chk.checked = allChk.checked; });
      box.querySelectorAll('tbody tr[data-oid]').forEach(tr => tr.classList.toggle('sel', allChk.checked));
    });
  }
  box.querySelectorAll('button[data-act]').forEach(b => b.addEventListener('click', () => {
    const o = Data.list('orders').find(x => x.id === b.dataset.id); if (!o) return;
    if (b.dataset.act === 'detail') orderDetail(o);
    else if (b.dataset.act === 'print') contractPrint(o);
    else if (b.dataset.act === 'edit') orderForm(o);
    else if (b.dataset.act === 'del') {
      if (confirm('确定删除合同 ' + o.contractNumber + ' ？相关收发货记录不会删除。')) { Data.remove('orders', o.id); poSel.delete(o.id); toast('已删除', 'ok'); renderPage(); }
    }
  }));
}
/* ---------- 导入EXCEL ---------- */
async function handleImportFile(f) {
  if (!f) return;
  toast('正在解析 ' + f.name + ' …', 'info');
  try {
    await ensureXLSX();
    const isCsv = f.name.toLowerCase().endsWith('.csv');
    const data = isCsv ? await f.text() : await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(new Uint8Array(r.result)); r.onerror = () => rej(new Error('文件读取失败')); r.readAsArrayBuffer(f); });
    const wb = XLSX.read(data, { type: isCsv ? 'string' : 'array', cellDates: true });
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
    applyOrdersImport(aoa, f.name);
  } catch (e) { toast('导入失败：' + e.message, 'err'); }
}
function applyOrdersImport(aoa, srcName) {
  if (!aoa || aoa.length < 2) { toast('文件中没有可导入的数据', 'err'); return; }
  const head = aoa[0].map(h => String(h).trim());
  const col = n => head.findIndex(h => h.indexOf(n) > -1);
  const C = { no: col('合同号'), po: col('PO'), sup: col('供应商'), od: col('合同日期'), dd: col('交货期'), name: col('产品名称'), spec: col('规格型号'), price: col('单价'), qty: col('数量'), unit: col('单位'), amt: col('总金额'), cat: col('成本类别'), desc: col('说明'), rem: col('备注') };
  if (C.no < 0 || C.sup < 0 || C.name < 0) { toast('表头缺少「合同号 / 供应商 / 产品名称」列', 'err'); return; }
  const num = v => +String(v == null ? '' : v).replace(/[¥￥,，\s]/g, '') || 0;
  const existing = new Set(Data.all('orders').filter(r => r.company === curCo()).map(r => r.contractNumber)); // 全部公司视图下按第一家公司查重
  const byNo = {}; let rows = 0, skipDup = 0;
  for (let i = 1; i < aoa.length; i++) {
    const r = aoa[i]; if (!r || !r.length) continue;
    const no = String(r[C.no] || '').trim(), name = String(r[C.name] || '').trim();
    if (!no || !name || name === '合计') continue;
    if (existing.has(no)) { skipDup++; continue; }
    const price = num(r[C.price]), qty = num(r[C.qty]);
    const amount = (price * qty) ? (price * qty).toFixed(2) : num(C.amt > -1 ? r[C.amt] : 0).toFixed(2);
    // 列含义与表格一致：说明 = 产品级说明；备注 = 合同级备注（旧文件只有"备注"列时，备注仍按产品级说明导入）
    const p = { name, spec: C.spec > -1 ? String(r[C.spec] || '').trim() : '', unit: C.unit > -1 ? String(r[C.unit] || '').trim() : '', unitPrice: price, quantity: qty, amount, category: C.cat > -1 ? String(r[C.cat] || '').trim() : '', remark: (C.desc > -1 ? String(r[C.desc] || '') : (C.rem > -1 ? String(r[C.rem] || '') : '')).trim() };
    const g = byNo[no] = byNo[no] || { no, po: C.po > -1 ? String(r[C.po] || '').trim() : '', sup: String(r[C.sup] || '').trim(), od: C.od > -1 ? normDateStr(r[C.od]) : '', dd: C.dd > -1 ? normDateStr(r[C.dd]) : '', cat: '', rem: '', products: [] };
    if (!g.cat && C.cat > -1) g.cat = String(r[C.cat] || '').trim(); // 合同级成本类别取首个非空值
    if (C.desc > -1 && C.rem > -1 && !g.rem) g.rem = String(r[C.rem] || '').trim();
    g.products.push(p); rows++;
  }
  const list = Object.values(byNo);
  if (!list.length) { toast('没有新合同可导入' + (skipDup ? '（' + skipDup + ' 行合同号已存在，已跳过）' : ''), 'info'); return; }
  if (!confirm('解析到 ' + list.length + ' 份新合同、' + rows + ' 条明细' + (skipDup ? '，跳过已存在 ' + skipDup + ' 行' : '') + '。\n确认导入到当前公司主体？')) return;
  const sups = DB.get('suppliers', []);
  list.forEach(x => {
    Data.add('orders', { id: uid(), company: curCo(), contractNumber: x.no, po: x.po || '', supplier: x.sup, orderDate: x.od, deliveryDate: x.dd, category: x.cat || '', products: x.products, totalAmount: x.products.reduce((s, p) => s + (+p.amount || 0), 0), remark: x.rem || '', createdAt: new Date().toISOString() });
    if (x.sup && !sups.find(s => s.supplierName === x.sup)) sups.unshift({ id: uid(), supplierNumber: nextNo('SUP-'), supplierName: x.sup, contactPerson: '', phoneNumber: '', email: '', companyAddress: '', bankName: '', bankCode: '', bankAccount: '', remarks: '导入自动创建', createdAt: new Date().toISOString() });
  });
  DB.set('suppliers', sups);
  toast('已导入 ' + list.length + ' 份合同、' + rows + ' 条明细', 'ok');
  renderPage();
}
/* ---------- 导出EXCEL ---------- */
async function exportOrdersExcel() {
  try {
    await ensureXLSX();
    const orders = Data.list('orders');
    orders.sort((a, b) => (b.orderDate || '').localeCompare(a.orderDate || '') || (b.contractNumber || '').localeCompare(a.contractNumber || ''));
    const rows = [['合同号', 'PO', '供应商', '合同日期', '交货期', '产品名称', '规格型号', '单价', '数量', '单位', '总金额(含税)', '成本类别', '说明', '备注']];
    let qSum = 0, aSum = 0;
    orders.forEach(o => (o.products || []).forEach(p => {
      rows.push([o.contractNumber, o.po || '', o.supplier, o.orderDate || '', o.deliveryDate || '', p.name, p.spec || '', p.unitPrice, p.quantity, p.unit || '', +poAmtOf(p).toFixed(2), p.category || o.category || '', p.remark || '', o.remark || '']);
      qSum += (+p.quantity || 0); aSum += poAmtOf(p);
    }));
    rows.push(['', '', '', '', '', '合计', '', '', +qSum.toFixed(2), '', +aSum.toFixed(2), '', '', '']);
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{ wch: 18 }, { wch: 14 }, { wch: 28 }, { wch: 11 }, { wch: 11 }, { wch: 15 }, { wch: 18 }, { wch: 10 }, { wch: 10 }, { wch: 6 }, { wch: 12 }, { wch: 12 }, { wch: 24 }, { wch: 24 }];
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '采购订单');
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    const ds = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); // 文件名：采购明细_公司简称_日期
    XLSX.writeFile(wb, '采购明细_' + curCoName() + '_' + ds + '.xlsx');
    toast('已导出 ' + (rows.length - 2) + ' 条明细', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}
/* ---------- 清空 ---------- */
function clearOrders() {
  if (State.company === ALL_COMPANIES) { toast('「全部公司」视图下不可清空，请先在页首切换到具体公司主体', 'err'); return; }
  const list = Data.list('orders');
  if (!list.length) { toast('当前公司主体没有采购合同', 'info'); return; }
  const lines = list.reduce((s, o) => s + (o.products || []).length, 0);
  if (!confirm('⚠ 确认清空当前公司主体的 ' + list.length + ' 份采购合同（共 ' + lines + ' 条明细）？\n相关收发货 / 开票 / 付款记录将保留，此操作不可恢复！')) return;
  DB.set('orders', Data.all('orders').filter(r => r.company !== State.company));
  poSel.clear(); poPg = 1;
  toast('已清空 ' + list.length + ' 份采购合同', 'ok');
  renderPage();
}
function productRowHTML(p) {
  p = p || { name: '', spec: '', unit: '', unitPrice: '', quantity: '', category: '', remark: '' };
  const units = DB.get('units', DEFAULT_UNITS);
  return '<div class="product-row">' +
    '<input class="pr-name" placeholder="产品名称" value="' + esc(p.name) + '">' +
    '<input class="pr-spec" placeholder="规格型号" value="' + esc(p.spec || '') + '">' +
    '<select class="pr-unit">' + '<option value="">单位</option>' + units.map(u => '<option' + (u === p.unit ? ' selected' : '') + '>' + esc(u) + '</option>').join('') + '</select>' +
    '<input class="pr-price num" type="number" step="0.01" min="0" placeholder="单价" value="' + (p.unitPrice || '') + '">' +
    '<input class="pr-qty num" type="number" step="1" min="0" placeholder="数量" value="' + (p.quantity || '') + '">' +
    '<input class="pr-amount num" placeholder="金额" value="' + ((+p.unitPrice || 0) * (+p.quantity || 0) ? ((+p.unitPrice || 0) * (+p.quantity || 0)).toFixed(2) : '') + '" readonly tabindex="-1">' +
    '<input class="pr-remark" placeholder="说明" value="' + esc(p.remark || '') + '">' +
    '<button class="icon-btn" type="button" onclick="this.parentElement.remove();updatePoTotal()">×</button></div>';
}
function updatePoTotal() {
  let sum = 0;
  $$('#modalBox .product-row').forEach(r => {
    const amt = (+r.querySelector('.pr-price').value || 0) * (+r.querySelector('.pr-qty').value || 0);
    r.querySelector('.pr-amount').value = amt ? amt.toFixed(2) : ''; sum += amt;
  });
  const t = $('#poTotal'); if (t) t.value = sum.toFixed(2);
}
/* ---------- 复制勾选的合同为新合同（新合同号，打开表单编辑） ---------- */
function copyOrder() {
  if (poSel.size !== 1) { toast('请先在表格中勾选一条合同记录（仅限一条）', 'info'); return; }
  const src = Data.list('orders').find(x => x.id === [...poSel][0]);
  if (!src) { toast('勾选的合同不在当前公司主体，请重新勾选', 'err'); return; }
  orderForm(src, true); // 复制模式：预填全部内容与产品明细，自动生成新合同号，保存时创建为新记录
}
function orderForm(o, isCopy) {
  // isCopy：复制模式 —— 预填源合同内容，自动生成新合同号，保存时创建为新记录（不覆盖源合同）
  const isEdit = !!o && !isCopy;
  const gen = isEdit ? null : peekNo('HT-'); // 预生成合同号（保存成功时才消耗序号）
  openModal('<h3>' + (isEdit || isCopy ? '编辑采购合同' : '新建采购合同') + '</h3><form id="poForm">' +
    '<div class="form-grid" style="grid-template-columns:repeat(6,1fr)">' +
    '<div><label>合同号</label><input id="poNo" class="po-ro" readonly value="' + esc(!isCopy && o ? o.contractNumber : gen.no) + '" placeholder="自动生成"></div>' +
    '<div><label class="req">合同日期</label><input id="poDate" type="date" required value="' + esc(o ? o.orderDate : todayStr()) + '"></div>' +
    '<div><label>交货期</label><input id="poDelivery" type="date" value="' + esc(o ? o.deliveryDate : '') + '"></div>' +
    '<div><label>PO</label><input id="poPo" value="' + esc(o ? (o.po || '') : '') + '" placeholder="客户PO / 订单号"></div>' +
    '<div><label class="req">供应商</label><input id="poSup" list="supList" required value="' + esc(o ? o.supplier : '') + '" placeholder="输入或选择供应商"><datalist id="supList">' + Data.list('suppliers').map(s => '<option value="' + esc(s.supplierName) + '">').join('') + '</datalist></div>' +
    '<div><label>成本类别</label><input id="poCat" list="catList" value="' + esc(o ? (o.category || '') : '') + '" placeholder="选填，如：原材料 / 包装箱费用"></div></div>' +
    '<div class="po-divider"></div>' +
    '<div style="margin:0 0 8px;display:flex;align-items:center;gap:10px"><label style="margin:0">产品明细</label><button type="button" class="btn btn-outline btn-sm" id="poAddRow">＋ 添加产品</button><button type="button" class="btn btn-outline btn-sm btn-packcalc" id="poPackCalc">包装计算器</button></div>' +
    '<div id="poRows">' + ((isEdit || isCopy) && o.products && o.products.length ? o.products.map(productRowHTML).join('') : productRowHTML()) + '</div>' +
    '<datalist id="catList">' + DEFAULT_CATEGORIES.map(c => '<option value="' + esc(c) + '">').join('') + '</datalist>' +
    '<div class="form-grid" style="margin-top:10px;grid-template-columns:repeat(3,1fr)">' +
    '<div><label class="req">总金额（含税）</label><input id="poTotal" class="po-ro" type="number" step="0.01" min="0" readonly value="' + (o ? o.totalAmount : '') + '" placeholder="自动汇总"></div>' +
    '<div><label>公司主体</label><select id="poCompany">' + DB.get('companies', []).map(c => '<option value="' + esc(c.code) + '"' + (c.code === (o ? (o.company || curCo()) : curCo()) ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') + '</select></div>' +
    '<div style="grid-column:1/-1"><label>备注</label><input id="poRemark" value="' + esc(o ? (o.remark || '') : '') + '"></div></div>' +
    '<div class="modal-foot"><button type="button" class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary">保存合同</button></div></form>', 'wide');
  $('#poAddRow').addEventListener('click', () => { $('#poRows').insertAdjacentHTML('beforeend', productRowHTML()); bindPoRow(); });
  $('#poPackCalc').addEventListener('click', () => { window.open('ply%20box.html?v=20260930a', '_blank'); }); // 独立新标签页打开包装计算器
  $$('#modalBox .product-row').forEach(r => bindPoRow(r));
  updatePoTotal(); // 初始汇总：编辑时按明细重算，新建时显示 0.00
  function bindPoRow(r) {
    (r ? [r] : $$('#modalBox .product-row')).forEach(row => {
      row.querySelector('.pr-price').addEventListener('input', updatePoTotal);
      row.querySelector('.pr-qty').addEventListener('input', updatePoTotal);
      // 粘贴"规格型号"时读取包装计算器载荷（pis_plyPaste），自动带出单位"只"与四舍五入单价
      row.querySelector('.pr-spec').addEventListener('paste', () => {
        setTimeout(() => {
          try {
            const d = JSON.parse(localStorage.getItem('pis_plyPaste') || 'null');
            if (!d) return;
            const sel = row.querySelector('.pr-unit');
            const has = Array.prototype.some.call(sel.options, o => o.value === d.unit);
            if (d.unit && has) sel.value = d.unit;
            if (d.price != null && isFinite(+d.price)) { row.querySelector('.pr-price').value = +d.price; updatePoTotal(); }
          } catch (e) {}
        }, 0);
      });
    });
  }
  $('#poForm').addEventListener('submit', async e => {
    e.preventDefault();
    const no = $('#poNo').value.trim(), sup = $('#poSup').value.trim();
    if (!no || !sup) return;
    const targetCo = $('#poCompany').value; // 公司主体（编辑时改选 = 整条合同转移到另一主体）
    const dup = Data.all('orders').find(x => x.contractNumber === no && x.company === targetCo && (!isEdit || x.id !== o.id));
    if (dup) { toast('合同号在所选公司主体下已存在：' + no, 'err'); return; }
    if (gen && no === gen.no) DB.set(gen.key, gen.n); // 自动单号落号（手动修改过则不消耗）
    const legacyCats = ((isEdit || isCopy) && o.products) || []; // 编辑/复制时按行序保留原产品成本类别
    const products = $$('#modalBox .product-row').map((r, i) => ({
      name: r.querySelector('.pr-name').value.trim(), spec: r.querySelector('.pr-spec').value.trim(), category: legacyCats[i] ? (legacyCats[i].category || '') : '',
      unit: r.querySelector('.pr-unit').value, unitPrice: +r.querySelector('.pr-price').value || 0,
      quantity: +r.querySelector('.pr-qty').value || 0,
      amount: ((+r.querySelector('.pr-price').value || 0) * (+r.querySelector('.pr-qty').value || 0)).toFixed(2),
      remark: r.querySelector('.pr-remark').value.trim()
    })).filter(p => p.name);
    if (!products.length) { toast('请至少填写一个产品', 'err'); return; }
    const rec = {
      id: isEdit ? o.id : uid(), company: targetCo, contractNumber: no, supplier: sup, po: $('#poPo').value.trim(),
      orderDate: $('#poDate').value, deliveryDate: $('#poDelivery').value, category: $('#poCat') ? $('#poCat').value.trim() : '',
      products, totalAmount: +$('#poTotal').value || 0, remark: $('#poRemark').value.trim(),
      createdAt: isEdit ? o.createdAt : new Date().toISOString()
    };
    if (isEdit) Data.update('orders', o.id, rec); else Data.add('orders', rec);
    // 自动登记供应商（若不存在）
    const sups = DB.get('suppliers', []);
    if (!sups.find(s => s.supplierName === sup)) {
      sups.unshift({ id: uid(), supplierNumber: nextNo('SUP-'), supplierName: sup, contactPerson: '', phoneNumber: '', email: '', companyAddress: '', bankName: '', bankCode: '', bankAccount: '', remarks: '由采购合同自动创建', createdAt: new Date().toISOString() });
      DB.set('suppliers', sups);
    }
    closeModal();
    if (isEdit) {
      if (targetCo !== (o.company || curCo())) toast('合同已转至：' + getCompany(targetCo), 'ok');
      else toast('合同已更新', 'ok');
      if (State.company !== ALL_COMPANIES && targetCo !== State.company) poSel.delete(o.id); // 离开当前主体视图才清除勾选
    } else {
      toast('采购合同已保存' + (targetCo !== curCo() ? '至 ' + getCompany(targetCo) : ''), 'ok');
    }
    renderPage();
  });
}
function orderDetail(o) {
  const cno = o.contractNumber;
  const prods = orderProducts(o).map(p => {
    const rec = receivedQty(cno, p.name), ret = returnedQty(cno, p.name), shp = shippedQty(cno, p.name);
    const stock = rec - ret;
    return '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.spec || '') + '</td><td class="subtle">' + esc(p.category || '—') + '</td><td>' + esc(p.unit || '') + '</td>' +
      '<td class="num">' + fmtNum(p.quantity) + '</td><td class="num">' + fmtMoney(p.unitPrice) + '</td><td class="num">' + fmtMoney(p.amount) + '</td>' +
      '<td class="num">' + fmtNum(shp) + '</td><td class="num">' + fmtNum(rec) + '</td><td class="num">' + fmtNum(ret) + '</td>' +
      '<td class="num"><b>' + fmtNum(stock) + '</b></td></tr>';
  }).join('');
  const inv = invoicedOfContract(cno), paid = paidOfContract(cno);
  openModal('<h3>合同明细 · ' + esc(cno) + '</h3>' +
    '<div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">' +
    '<div class="stat-card"><div class="l">供应商</div><div class="v" style="font-size:14px">' + esc(o.supplier) + '</div><div class="s">' + esc(o.orderDate || '') + ' 签订 · PO ' + esc(o.po || '—') + ' · 交期 ' + esc(o.deliveryDate || '—') + '</div></div>' +
    '<div class="stat-card hl"><div class="l">合同金额(含税)</div><div class="v">' + fmtMoney(o.totalAmount) + '</div><div class="s">' + moneyCn(o.totalAmount) + '</div></div>' +
    '<div class="stat-card"><div class="l">已开票</div><div class="v">' + fmtMoney(inv) + '</div><div class="s">未开票 ' + fmtMoney(Math.max(0, o.totalAmount - inv)) + '</div></div>' +
    '<div class="stat-card ' + (paid >= o.totalAmount - 0.005 ? 'good' : 'warn') + '"><div class="l">已付款</div><div class="v">' + fmtMoney(paid) + '</div><div class="s">待付 ' + fmtMoney(Math.max(0, o.totalAmount - paid)) + '</div></div></div>' +
    '<div class="tbl-wrap"><table><thead><tr><th>产品</th><th>规格</th><th>成本类别</th><th>单位</th><th class="num">合同数</th><th class="num">单价</th><th class="num">金额</th><th class="num">已发货</th><th class="num">已收货</th><th class="num">已退货</th><th class="num">结存</th></tr></thead><tbody>' +
    (prods || '<tr><td colspan="11" class="empty">无产品</td></tr>') + '</tbody></table></div>' +
    (o.remark ? '<div class="hint" style="margin-top:10px"><b>备注：</b>' + esc(o.remark) + '</div>' : '') +
    '<div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">关闭</button></div>', 'wide');
}

/* ---------- 生成采购合同（跳转 procurement contract.html，逻辑与原应用一致） ---------- */
function contractPrint(o) {
  const companyName = getCompany(o.company || State.company);
  // 买方主体地址 / 联系人 / 电话（与原应用相同，按公司名匹配）
  let buyerCompanyAddress = '', buyerContactPerson = '', buyerPhoneNumber = '';
  if (companyName.indexOf('无锡龙力') > -1) {
    buyerCompanyAddress = '无锡市新吴区龙山路4号c幢603'; buyerContactPerson = '吴小英'; buyerPhoneNumber = '139 5159 9291';
  } else if (companyName.indexOf('普利美') > -1) {
    buyerCompanyAddress = '常州市武进区雪堰镇周南路8号6-1（中南高科常州雪堰智造产业园）'; buyerContactPerson = 'AlonZhang'; buyerPhoneNumber = '136 6511 9291';
  }
  // 供应商完整档案（开户行 / 账号等，合同页卖方栏展示）
  const sup = DB.get('suppliers', []).find(s => s.supplierName === o.supplier) || {};
  const contractData = {
    id: o.id, company: o.company || State.company, contractNumber: o.contractNumber, po: o.po || '',
    orderDate: o.orderDate || '', deliveryDate: o.deliveryDate || '', category: o.category || '',
    supplier: o.supplier, totalAmount: o.totalAmount, orderRemark: o.remark || '',
    companyName, buyerCompanyAddress, buyerContactPerson, buyerPhoneNumber,
    supplierInfo: {
      supplierName: sup.supplierName || o.supplier, companyAddress: sup.companyAddress || '',
      contactPerson: sup.contactPerson || '', phoneNumber: sup.phoneNumber || '',
      email: sup.email || '', bankName: sup.bankName || '', bankCode: sup.bankCode || '', bankAccount: sup.bankAccount || ''
    },
    // 字段名映射为合同页所需：name→productName、spec→specification
    products: (o.products || []).map(p => ({
      productName: p.name, specification: p.spec || '', unit: p.unit || '',
      unitPrice: p.unitPrice, quantity: p.quantity,
      amount: p.amount != null && p.amount !== '' ? p.amount : ((+p.unitPrice || 0) * (+p.quantity || 0)).toFixed(2),
      remark: p.remark || ''
    }))
  };
  if (!contractData.contractNumber || !contractData.supplier) { toast('生成合同失败：订单数据不完整', 'err'); return; }
  // 带时间戳的时效包装（合同页校验 1 小时内有效），三通道传递：
  // 主通道 localStorage（同源新标签页立即可见，Safari 行为一致）→ sessionStorage（同标签页兜底）→ opener 内存
  const payload = JSON.stringify({ ts: Date.now(), data: contractData });
  let useStorage = true;
  try { localStorage.setItem('__purchaseContractPayload', payload); } catch (e) { useStorage = false; }
  try { sessionStorage.setItem('purchaseContractPayload', payload); } catch (e) {}
  try { window.__purchaseContractData = contractData; } catch (e) {}
  // 文件名含空格须编码为 %20，否则部分浏览器新标签页不跳转；存储不可用时才退回 URL 传参
  const page = encodeURI('procurement contract.html');
  const url = useStorage ? page : page + '?data=' + encodeURIComponent(JSON.stringify(contractData));
  // 移动端 Safari 对 window.open 限制严格：<a target="_blank"> 程序化点击最可靠，window.open 次之，最后当前页跳转
  try {
    const a = document.createElement('a');
    a.href = url; a.target = '_blank';
    document.body.appendChild(a); a.click(); a.remove();
    toast('采购合同已生成', 'ok');
    return;
  } catch (e) {}
  const win = window.open(url, '_blank');
  if (!win) window.location.href = url;
}

initPage('purchase', pagePurchase);
