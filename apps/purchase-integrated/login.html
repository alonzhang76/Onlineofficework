<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 采购一体化系统</title>
<link rel="stylesheet" href="css/common.css">
</head>
<body>

<!-- ============ 登录页（SRM 企业风） ============ -->
<div id="loginMask">
  <div class="lg-card">
    <div class="lg-left">
      <svg class="mesh" width="300" height="230" viewBox="0 0 300 230" fill="none">
        <g stroke="rgba(255,255,255,.4)" stroke-width="1">
          <path d="M20 180 L90 120 L160 150 L230 70 L280 110"/>
          <path d="M90 120 L150 40 L230 70 M160 150 L230 70 M20 180 L160 150"/>
        </g>
        <g fill="rgba(255,255,255,.85)">
          <circle cx="20" cy="180" r="4"/><circle cx="90" cy="120" r="5"/><circle cx="150" cy="40" r="3.5"/>
          <circle cx="160" cy="150" r="4.5"/><circle cx="230" cy="70" r="5.5"/><circle cx="280" cy="110" r="3.5"/>
        </g>
        <g fill="rgba(255,255,255,.28)">
          <circle cx="60" cy="60" r="2.5"/><circle cx="120" cy="90" r="2"/><circle cx="250" cy="160" r="3"/><circle cx="190" cy="200" r="2.5"/>
        </g>
      </svg>
      <svg class="mesh2" width="220" height="160" viewBox="0 0 220 160" fill="none">
        <g stroke="rgba(255,255,255,.35)" stroke-width="1">
          <path d="M10 140 L70 90 L130 110 L200 30 M70 90 L110 20"/>
        </g>
        <g fill="rgba(255,255,255,.7)">
          <circle cx="10" cy="140" r="3"/><circle cx="70" cy="90" r="4"/><circle cx="130" cy="110" r="3"/>
          <circle cx="200" cy="30" r="4"/><circle cx="110" cy="20" r="2.5"/>
        </g>
      </svg>
      <div class="lg-slogan-l1">采购一体化系统</div>
      <div class="lg-slogan-l2">构建互联互通的<br>数智采购供应链</div>
      <div class="lg-slogan-sub">PROCUREMENT · SUPPLY CHAIN</div>
    </div>
    <div class="lg-right">
      <div class="lg-brand">
        <div class="blogo"><svg width="27" height="27" viewBox="0 0 48 48"><use href="#rrlogo"/></svg></div>
        <div class="bname"><b>采购一体化系统</b><i>Procurement Unified System</i></div>
        <div class="bdiv"></div>
        <div class="bprod">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
          供应商协同
        </div>
      </div>
      <div class="lg-tabs"><span class="tab on">密码登录</span></div>
      <div class="lg-field">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input id="loginUser" placeholder="用户名 / 电话号码 / 邮箱" autocomplete="username">
      </div>
      <div class="lg-field">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input id="loginPwd" type="password" placeholder="密码" autocomplete="current-password">
      </div>
      <div class="lg-row">
        <label><input type="checkbox" id="rememberMe" checked>记住登录</label>
        <span class="lk" id="forgotLink">忘记密码</span>
      </div>
      <button class="lg-btn" id="loginBtn">登 录</button>
      <div class="login-err" id="loginErr"></div>
      <div class="login-hint">默认账号：admin / admin123（登录后请及时修改密码）<br>供应商账号由管理员在【系统管理 → 用户管理】中开通</div>
    </div>
  </div>
  <div class="lg-foot">© 2026 采购一体化系统 · 供应商协同平台</div>
</div>

<div class="toast" id="toastBox"></div>

<script src="js/common.js"></script>
<script>
/* ==========================================================
   登录逻辑（多模块版：登录成功 → purchase.html 采购管理）
   ========================================================== */
'use strict';

/* 已有有效会话 → 直接进入采购管理 */
(function () {
  try {
    const s = JSON.parse(sessionStorage.getItem('pis_session') || 'null');
    if (s && s.id && DB.get('users', []).find(u => u.id === s.id && u.active !== false)) {
      location.replace('purchase.html'); return;
    }
  } catch (e) { /* 忽略 */ }
})();

async function doLogin() {
  const un = $('#loginUser').value.trim(), pwd = $('#loginPwd').value;
  if (!un || !pwd) { $('#loginErr').textContent = '请输入用户名和密码'; return; }
  await ensureAdminHash();
  const users = DB.get('users', []);
  const u = users.find(x => x.username.toLowerCase() === un.toLowerCase());
  const h = await hashPwd(pwd);
  if (!u || u.pwd !== h) { $('#loginErr').textContent = '用户名或密码错误'; return; }
  if (u.active === false) { $('#loginErr').textContent = '该账号已被停用，请联系管理员'; return; }
  Session.user = u; saveSession();
  $('#loginErr').textContent = ''; $('#loginPwd').value = '';
  if ($('#rememberMe').checked) localStorage.setItem('pis_rememberUser', un); else localStorage.removeItem('pis_rememberUser');
  toast('欢迎，' + (u.name || u.username), 'ok');
  setTimeout(() => { location.href = 'purchase.html'; }, 200);
}
$('#loginBtn').addEventListener('click', doLogin);
$('#loginUser').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('#loginPwd').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('#forgotLink').addEventListener('click', () => toast('请联系管理员在【系统管理 → 用户管理】中重置密码', 'info'));

/* 记住的用户名预填 */
(function () {
  const rem = localStorage.getItem('pis_rememberUser');
  if (rem) { $('#loginUser').value = rem; $('#rememberMe').checked = true; $('#loginPwd').focus(); }
  else $('#loginUser').focus();
})();
</script>
</body>
</html>
