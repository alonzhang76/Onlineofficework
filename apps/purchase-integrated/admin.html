<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统管理 · 采购一体化系统</title>
<link rel="stylesheet" href="css/common.css">
</head>
<body>
<header>
  <div class="logo"><span class="mark"><svg width="18" height="18" viewBox="0 0 48 48"><use href="#rrlogo"/></svg></span>采购一体化系统</div>
  <div class="nav-wrap">
    <button class="nav-btn" id="navMenuBtn" type="button">菜单 <span class="caret">▾</span></button>
    <div class="nav-menu" id="navMenu"></div>
  </div>
  <span class="hspace"></span>
  <div class="company-select" id="companySelectWrap">
    <span>公司主体</span><select id="companySelect"></select>
  </div>
  <div class="userbox">
    <b class="uname" id="whoName">—</b>
    <button class="btn-exit" id="logoutBtn">退出</button>
  </div>
</header>
<div class="layout">
  <main id="main"></main>
</div>
<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toastBox"></div>
<div id="printArea"></div>
<script>
/* 云端数据（与其它应用同一套 cloudbase-sync 机制）：独立命名空间 purchase-integrated，
   仅同步本应用业务键；pis_reim_api 等本机配置、会话信息不同步 */
window.CLOUDBASE_APP_ID='purchase-integrated';
window.CLOUDBASE_APP_KEYS=['pis_companies','pis_units','pis_terms','pis_roles','pis_users','pis_suppliers','pis_curCompany','pis_orders','pis_shipments','pis_receipts','pis_returns','pis_invoices','pis_payments','pis_tool_records','pis_poPageSize','pis_plyPaste'];
window.CLOUDBASE_APP_KEY_PREFIXES=['pis_seq_'];
</script>
<script src="../cloudbase-sync.js?v=20260924f"></script>
<script src="../cloudbase-admin.js?v=20260930a"></script>
<script src="js/common.js"></script>
<script src="js/auth-guard.js"></script>
<script>
'use strict';
/* ==========================================================
   系统管理（仅管理员）
   ========================================================== */
function pageAdmin(root) {
  root.innerHTML =
    '<div class="page-head"><h2>系统管理</h2><span class="desc">用户 · 角色权限 · 公司抬头 · 数据与云</span></div>' +
    '<div class="card"><div class="tabs">' +
    [['user', '用户管理'], ['role', '角色权限'], ['company', '公司抬头'], ['data', '数据与云']].map(t => '<button class="tab' + (State.adminTab === t[0] ? ' active' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>').join('') +
    '</div><div id="adminBox"></div></div>';
  root.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { State.adminTab = t.dataset.tab; renderPage(); }));
  if (State.adminTab === 'user') adminUsers();
  else if (State.adminTab === 'role') adminRoles();
  else if (State.adminTab === 'company') adminCompanies();
  else adminData();
}
function adminUsers() {
  const box = $('#adminBox');
  const users = DB.get('users', []), roles = DB.get('roles', []);
  const roleName = k => (roles.find(r => r.key === k) || {}).name || k;
  box.innerHTML = '<div style="margin-bottom:12px"><button class="btn btn-primary" id="uAdd">＋ 新建用户</button><span class="hint" style="display:inline-block;margin-left:12px">共 ' + users.length + ' 个用户 · 供应商角色用户只能查看自己名下数据</span></div>' +
    '<div class="tbl-wrap"><table><thead><tr><th>用户名</th><th>姓名</th><th>角色</th><th>关联供应商</th><th>状态</th><th>创建时间</th><th style="width:230px">操作</th></tr></thead><tbody>' +
    users.map(u => '<tr><td class="mono"><b>' + esc(u.username) + '</b></td><td>' + esc(u.name || '') + '</td>' +
      '<td><span class="badge ' + (u.role === 'admin' ? 'b-purple' : u.role === 'supplier' ? 'b-blue' : 'b-gray') + '">' + esc(roleName(u.role)) + '</span></td>' +
      '<td>' + esc(u.supplierName || '—') + '</td>' +
      '<td>' + (u.active !== false ? '<span class="badge b-green">启用</span>' : '<span class="badge b-red">停用</span>') + '</td>' +
      '<td style="color:var(--muted)">' + fmtDate((u.createdAt || '').slice(0, 10)) + '</td>' +
      '<td><button class="link-op" data-a="e" data-id="' + u.id + '">编辑</button>' +
      '<button class="link-op" data-a="p" data-id="' + u.id + '">重置密码</button>' +
      '<button class="link-op" data-a="t" data-id="' + u.id + '">' + (u.active !== false ? '停用' : '启用') + '</button>' +
      (u.username !== 'admin' ? '<button class="link-op danger" data-a="d" data-id="' + u.id + '">删除</button>' : '') + '</td></tr>').join('') +
    '</tbody></table></div>';
  $('#uAdd').addEventListener('click', () => userForm(null));
  box.querySelectorAll('button[data-a]').forEach(b => b.addEventListener('click', async () => {
    const users2 = DB.get('users', []); const u = users2.find(x => x.id === b.dataset.id); if (!u) return;
    const a = b.dataset.a;
    if (a === 'e') userForm(u);
    else if (a === 'p') {
      const np = prompt('为用户「' + u.username + '」设置新密码：'); if (!np) return;
      u.pwd = await hashPwd(np); DB.set('users', users2); toast('密码已重置', 'ok');
    } else if (a === 't') { u.active = u.active === false ? true : false; DB.set('users', users2); toast('已' + (u.active ? '启用' : '停用'), 'ok'); renderPage(); }
    else if (a === 'd') { if (confirm('删除用户「' + u.username + '」？')) { DB.set('users', users2.filter(x => x.id !== u.id)); toast('已删除', 'ok'); renderPage(); } }
  }));
}
function userForm(u) {
  const isEdit = !!u;
  const roles = DB.get('roles', []), sups = DB.get('suppliers', []);
  openModal('<h3>' + (isEdit ? '编辑用户' : '新建用户') + '</h3><form id="uF"><div class="form-grid">' +
    '<div><label class="req">用户名</label><input id="ufName" required value="' + esc(u ? u.username : '') + '"' + (isEdit ? ' readonly' : '') + '></div>' +
    '<div><label>姓名</label><input id="ufDisplay" value="' + esc(u ? (u.name || '') : '') + '"></div>' +
    (isEdit ? '' : '<div><label class="req">初始密码</label><input id="ufPwd" type="text" required value="" placeholder="至少4位"></div>') +
    '<div><label class="req">角色</label><select id="ufRole">' + roles.map(r => '<option value="' + esc(r.key) + '"' + (u && u.role === r.key ? ' selected' : '') + '>' + esc(r.name) + '</option>').join('') + '</select></div>' +
    '<div id="ufSupWrap" style="display:none"><label>关联供应商</label><select id="ufSup"><option value="">请选择</option>' + sups.map(s => '<option' + (u && u.supplierName === s.supplierName ? ' selected' : '') + '>' + esc(s.supplierName) + '</option>').join('') + '</select></div>' +
    '</div><div class="hint">供应商角色用户登录后，仅能看到其关联供应商名下的合同、发货、收货、发票、付款与对账数据。</div>' +
    '<div class="modal-foot"><button type="button" class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary">保存</button></div></form>');
  const toggleSup = () => {
    const r = DB.get('roles', []).find(x => x.key === $('#ufRole').value);
    $('#ufSupWrap').style.display = r && r.supplierRole ? 'block' : 'none';
  };
  $('#ufRole').addEventListener('change', toggleSup); toggleSup();
  $('#uF').addEventListener('submit', async e => {
    e.preventDefault();
    const users = DB.get('users', []);
    const un = $('#ufName').value.trim();
    const dup = users.find(x => x.username === un && (!isEdit || x.id !== u.id));
    if (dup) { toast('用户名已存在', 'err'); return; }
    const roleKey = $('#ufRole').value;
    const rDef = roles.find(r => r.key === roleKey);
    let supplierName = '';
    if (rDef && rDef.supplierRole) { supplierName = $('#ufSup').value; if (!supplierName) { toast('请选择关联供应商', 'err'); return; } }
    if (isEdit) {
      u.name = $('#ufDisplay').value.trim(); u.role = roleKey; u.supplierName = supplierName;
      DB.set('users', users);
    } else {
      const pwd = $('#ufPwd').value; if (pwd.length < 4) { toast('密码至少4位', 'err'); return; }
      users.unshift({ id: uid(), username: un, pwd: await hashPwd(pwd), name: $('#ufDisplay').value.trim(), role: roleKey, supplierName, active: true, createdAt: new Date().toISOString() });
      DB.set('users', users);
    }
    closeModal(); toast('用户已保存', 'ok'); renderPage();
  });
}
function adminRoles() {
  const box = $('#adminBox');
  const roles = DB.get('roles', []);
  const pages = PAGES.filter(p => !p.adminOnly);
  box.innerHTML = '<div style="margin-bottom:12px;display:flex;gap:10px;align-items:center"><button class="btn btn-primary" id="rAdd">＋ 新建角色</button><span class="hint" style="display:inline-block">读写 = 可查看并操作；只读 = 仅查看（不可新增/编辑/删除/导入/清空）；不显示 = 导航菜单中隐藏该模块。「管理员」「供应商」为系统内置角色不可删除</span></div>' +
    '<div class="tbl-wrap"><table class="perm-matrix"><thead><tr><th style="min-width:120px">模块</th>' + roles.map(r => '<th>' + esc(r.name) + (r.locked ? ' <span style="font-size:10px;color:#94a3b8">内置</span>' : '') + '</th>').join('') + '</tr></thead><tbody>' +
    pages.map(p => '<tr><td><b>' + esc(p.name) + '</b><span style="font-size:11px;color:#94a3b8"> ' + p.key + '</span></td>' +
      roles.map(r => {
        if (r.key === 'admin') return '<td style="text-align:center"><span class="badge b-blue">读写</span></td>';
        const cur = (r.permissions || {})[p.key];
        const val = (cur === 'rw' || cur === true) ? 'rw' : (cur === 'r' ? 'r' : 'none');
        return '<td><select data-role="' + r.id + '" data-page="' + p.key + '">' +
          '<option value="rw"' + (val === 'rw' ? ' selected' : '') + '>读写</option>' +
          '<option value="r"' + (val === 'r' ? ' selected' : '') + '>只读</option>' +
          '<option value="none"' + (val === 'none' ? ' selected' : '') + '>不显示</option></select></td>';
      }).join('') + '</tr>').join('') +
    '</tbody></table></div>' +
    '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">' + roles.filter(r => !r.locked).map(r => '<button class="btn btn-outline btn-sm" data-del="' + r.id + '">删除角色：' + esc(r.name) + '</button>').join('') + '</div>';
  box.querySelectorAll('select[data-role]').forEach(c => c.addEventListener('change', () => {
    const roles2 = DB.get('roles', []); const r = roles2.find(x => x.id === c.dataset.role);
    if (!r) return; r.permissions = r.permissions || {}; r.permissions[c.dataset.page] = c.value;
    DB.set('roles', roles2); toast('权限已保存：' + r.name + ' · ' + c.dataset.page + ' · ' + { rw: '读写', r: '只读', none: '不显示' }[c.value], 'ok');
  }));
  box.querySelectorAll('button[data-del]').forEach(b => b.addEventListener('click', () => {
    const roles2 = DB.get('roles', []); const r = roles2.find(x => x.id === b.dataset.del); if (!r) return;
    if (DB.get('users', []).find(u => u.role === r.key)) { toast('仍有用户使用该角色，无法删除', 'err'); return; }
    if (confirm('删除角色「' + r.name + '」？')) { DB.set('roles', roles2.filter(x => x.id !== r.id)); toast('已删除', 'ok'); renderPage(); }
  }));
  $('#rAdd').addEventListener('click', () => {
    const name = prompt('新角色名称：'); if (!name || !name.trim()) return;
    const roles2 = DB.get('roles', []);
    const key = 'role_' + Date.now().toString(36);
    roles2.push({ id: uid(), key, name: name.trim(), locked: false, permissions: Object.fromEntries(PAGES.map(p => [p.key, p.key === 'dashboard' ? 'rw' : 'none'])) });
    DB.set('roles', roles2); toast('角色已创建，请在权限矩阵中为各模块选择：读写 / 只读 / 不显示', 'ok'); renderPage();
  });
}
function adminCompanies() {
  const box = $('#adminBox');
  const comps = DB.get('companies', []);
  box.innerHTML = '<div style="margin-bottom:12px"><button class="btn btn-primary" id="cAdd">＋ 添加公司抬头</button><span class="hint" style="display:inline-block;margin-left:12px">业务数据按公司主体隔离，切换公司后各模块仅显示当前公司数据</span></div>' +
    '<div class="tbl-wrap"><table><thead><tr><th>简称</th><th>公司名称</th><th style="width:140px">操作</th></tr></thead><tbody>' +
    comps.map((c, i) => '<tr><td class="mono">' + esc(c.code) + '</td><td>' + esc(c.name) + '</td>' +
      '<td><button class="link-op" data-i="' + i + '" data-a="e">编辑</button><button class="link-op danger" data-i="' + i + '" data-a="d">删除</button></td></tr>').join('') +
    '</tbody></table></div>';
  $('#cAdd').addEventListener('click', () => companyForm(null));
  box.querySelectorAll('button[data-a]').forEach(b => b.addEventListener('click', () => {
    const c = DB.get('companies', [])[+b.dataset.i]; if (!c) return;
    if (b.dataset.a === 'e') companyForm(c);
    else if (confirm('删除公司抬头「' + c.name + '」？其名下业务数据将不再显示（数据不删除）。')) { DB.set('companies', DB.get('companies', []).filter(x => x.code !== c.code)); toast('已删除', 'ok'); renderPage(); }
  }));
}
function companyForm(c) {
  const isEdit = !!c;
  openModal('<h3>' + (isEdit ? '编辑公司抬头' : '添加公司抬头') + '</h3><form id="cF"><div class="form-grid">' +
    '<div><label class="req">简称</label><input id="cfCode" required value="' + esc(c ? c.code : '') + '" placeholder="如：龙力 / 普利美"' + (isEdit ? ' readonly' : '') + '></div>' +
    '<div style="grid-column:1/-1"><label class="req">公司名称</label><input id="cfName" required value="' + esc(c ? c.name : '') + '"></div></div>' +
    '<div class="modal-foot"><button type="button" class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary">保存</button></div></form>');
  $('#cF').addEventListener('submit', e => {
    e.preventDefault();
    const comps = DB.get('companies', []);
    const data = { code: $('#cfCode').value.trim(), name: $('#cfName').value.trim() };
    if (isEdit) { const i = comps.findIndex(x => x.code === c.code); comps[i] = data; }
    else { if (comps.find(x => x.code === data.code)) { toast('简称已存在', 'err'); return; } comps.push(data); }
    DB.set('companies', comps); closeModal(); toast('公司抬头已保存', 'ok'); renderFrame();
  });
}
function adminData() {
  const box = $('#adminBox');
  box.innerHTML =
    '<h3 style="font-size:14px;margin-bottom:10px">云端数据（页面最上方冻结工具条）</h3>' +
    '<div class="hint" style="line-height:2">本系统已接入与其它应用一致的云端数据服务，所有按钮固定在页面最顶端：<br>' +
    '<b>💾 保存</b>：把本机全部数据上传覆盖云端；<b>⬇️ 云端下载</b>：对比后用云端较新数据更新本机；<br>' +
    '<b>📥 备份到电脑 / 📤 从电脑恢复</b>：本机 JSON 文件备份；右侧胶囊显示「本地 N · 云端 M」数据条数。<br>' +
    '日常使用中业务数据保存后会<b>自动同步</b>到云端（约每 15 秒轮询），换电脑登录后点「⬇️ 云端下载」即可取回数据。</div>' +
    '<h3 style="font-size:14px;margin:18px 0 10px">本地备份</h3>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px">' +
    '<button class="btn btn-primary" id="dExport">⬇ 备份到电脑（JSON）</button>' +
    '<label class="btn btn-outline" style="cursor:pointer">⬆ 从电脑恢复<input type="file" id="dImport" accept=".json" style="display:none"></label></div>' +
    '<div class="hint">备份包含用户、角色、供应商及全部业务数据；恢复将覆盖当前本地数据，并自动重新上传云端。</div>' +
    '<h3 style="font-size:14px;margin:18px 0 10px">报销系统对接（发票台账 / 付款数据）</h3>' +
    '<div class="row-flex">' +
    '<div style="flex:1;max-width:420px"><label>报销系统服务地址</label><input id="dReimApi" placeholder="http://127.0.0.1:8686" value="' + esc(ReimPay.base()) + '"></div>' +
    '<div style="align-self:flex-end;display:flex;gap:8px"><button class="btn btn-primary" id="dReimSave">保存并测试连接</button>' +
    '<button class="btn btn-outline" id="dReimReset">恢复默认</button></div></div>' +
    '<div class="hint">发票提交至报销系统审核，付款登记在报销系统完成；付款金额 / 付款日期 / 审核状态自动回本系统展示。地址仅保存在本机，不同步云端。</div>' +
    '<h3 style="font-size:14px;margin:18px 0 10px;color:var(--red)">危险操作</h3>' +
    '<button class="btn btn-danger" id="dClear">清空本地业务数据</button><span class="hint" style="display:inline-block;margin-left:10px">仅保留用户 / 角色 / 公司 / 供应商结构，业务单据全部清空，请先备份！</span>';
  $('#dExport').addEventListener('click', () => window.backupData());
  $('#dImport').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const snap = JSON.parse(rd.result);
        if (!snap || typeof snap.data !== 'object') throw new Error('备份文件格式不正确');
        if (!confirm('恢复将用备份内容覆盖本机当前数据，确定继续？')) return;
        DB.restore(snap);
        if (window.CloudbaseSync && typeof window.CloudbaseSync.setImportProtection === 'function') {
          window.CloudbaseSync.setImportProtection(600000);
        }
        toast('恢复成功，即将刷新', 'ok'); setTimeout(() => location.reload(), 800);
      } catch (err) { toast('恢复失败：' + err.message, 'err'); }
    };
    rd.readAsText(f);
  });
  $('#dReimSave').addEventListener('click', async () => {
    const v = $('#dReimApi').value.trim().replace(/\/+$/, '');
    if (!v) { toast('请填写服务地址', 'err'); return; }
    ReimPay.setBase(v);
    try {
      const d = await ReimPay.load(true);
      toast('连接成功：发票 ' + (d.summary && d.summary.invoices != null ? d.summary.invoices : 0) + ' 张，已付 ' + fmtMoney((d.summary && d.summary.paid) || 0), 'ok');
    } catch (e) { toast('保存成功但连接失败：' + e.message, 'err'); }
  });
  $('#dReimReset').addEventListener('click', () => {
    ReimPay.setBase('http://127.0.0.1:8686');
    $('#dReimApi').value = ReimPay.base();
    toast('已恢复默认地址', 'ok');
  });
  $('#dClear').addEventListener('click', () => {
    if (!confirm('⚠️ 此操作将清空全部业务单据（合同/发货/收货/退货/发票/付款），且不可恢复！是否继续？')) return;
    if (!confirm('再次确认：请确保已备份！确定清空？')) return;
    DB.clearBiz(); toast('业务数据已清空', 'ok'); renderPage();
  });
}

initPage('admin', pageAdmin);
</script>
</body>
</html>
