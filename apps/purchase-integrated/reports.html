<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据统计 · 采购一体化系统</title>
<link rel="stylesheet" href="css/common.css">
</head>
<body>
<header>
  <div class="logo"><span class="mark"><svg width="18" height="18" viewBox="0 0 48 48"><use href="#rrlogo"/></svg></span>采购一体化系统</div>
  <div class="nav-wrap">
    <button class="nav-btn" id="navMenuBtn" type="button">菜单 <span class="caret">▾</span></button>
    <div class="nav-menu" id="navMenu"></div>
  </div>
  <span class="hspace"></span>
  <div class="company-select" id="companySelectWrap">
    <span>公司主体</span><select id="companySelect"></select>
  </div>
  <div class="userbox">
    <b class="uname" id="whoName">—</b>
    <button class="btn-exit" id="logoutBtn">退出</button>
  </div>
</header>
<div class="layout">
  <main id="main"></main>
</div>
<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toastBox"></div>
<div id="printArea"></div>
<script src="js/common.js"></script>
<script src="js/auth-guard.js"></script>
<script>
'use strict';
/* ==========================================================
   数据统计
   ========================================================== */
function pageReports(root) {
  const orders = Data.list('orders'), invs = Data.list('invoices'), pays = Data.list('payments');
  const totalAmount = orders.reduce((s, o) => s + (+o.totalAmount || 0), 0);
  const invoiced = invs.reduce((s, v) => s + (+v.amount || 0), 0);
  const paid = pays.reduce((s, p) => s + (+p.amount || 0), 0);
  const recvTotal = Data.list('receipts').reduce((s, r) => s + (+r.quantity || 0), 0);
  const retTotal = Data.list('returns').reduce((s, r) => s + (+r.quantity || 0), 0);
  root.innerHTML =
    '<div class="page-head"><h2>数据统计</h2><span class="desc">合同 · 开票 · 付款 · 供应商维度汇总</span><span class="spacer"></span>' +
    '<span id="repMoreWrap"></span></div>' +
    '<div class="stat-grid">' +
    '<div class="stat-card hl"><div class="l">合同总金额</div><div class="v">' + fmtMoney(totalAmount) + '</div><div class="s">' + orders.length + ' 份合同</div></div>' +
    '<div class="stat-card"><div class="l">开票总额</div><div class="v">' + fmtMoney(invoiced) + '</div><div class="s">开票率 ' + (totalAmount ? Math.round(invoiced / totalAmount * 100) : 0) + '%</div></div>' +
    '<div class="stat-card good"><div class="l">付款总额</div><div class="v">' + fmtMoney(paid) + '</div><div class="s">待付 ' + fmtMoney(Math.max(0, invoiced - paid)) + '</div></div>' +
    '<div class="stat-card"><div class="l">收退货数量</div><div class="v">' + fmtNum(recvTotal) + ' / ' + fmtNum(retTotal) + '</div><div class="s">累计收货 / 退货</div></div></div>' +
    '<div class="card"><h3>供应商维度汇总（按合同金额）</h3><div id="repSupBox"></div></div>' +
    '<div class="card"><h3>月度趋势</h3><div id="repMonthBox"></div></div>';
  // 供应商汇总
  const supMap = {};
  orders.forEach(o => {
    const k = o.supplier || '—';
    supMap[k] = supMap[k] || { amount: 0, inv: 0, pay: 0, cnt: 0 };
    supMap[k].amount += +o.totalAmount || 0; supMap[k].cnt++;
  });
  invs.forEach(v => { const k = v.supplier || '—'; (supMap[k] = supMap[k] || { amount: 0, inv: 0, pay: 0, cnt: 0 }).inv += +v.amount || 0; });
  pays.forEach(p => { const k = p.supplier || '—'; (supMap[k] = supMap[k] || { amount: 0, inv: 0, pay: 0, cnt: 0 }).pay += +p.amount || 0; });
  const rows = Object.keys(supMap).sort((a, b) => supMap[b].amount - supMap[a].amount);
  const maxAmt = Math.max(1, ...rows.map(k => supMap[k].amount));
  $('#repSupBox').innerHTML = rows.length ? rows.map(k => {
    const m = supMap[k];
    return '<div class="bar-row"><span class="name" title="' + esc(k) + '">' + esc(k) + '</span>' +
      '<div class="track"><div class="fill" style="width:' + Math.round(m.amount / maxAmt * 100) + '%"></div></div>' +
      '<span class="val">' + fmtMoney(m.amount) + ' · ' + m.cnt + '单</span></div>' +
      '<div style="font-size:11.5px;color:var(--muted);margin:-4px 0 8px 180px">开票 ' + fmtMoney(m.inv) + ' · 付款 ' + fmtMoney(m.pay) + ' · 待付 ' + fmtMoney(Math.max(0, m.inv - m.pay)) + '</div>';
  }).join('') : '<div class="empty">暂无数据</div>';
  // 月度
  const monthMap = {};
  orders.forEach(o => { const k = (o.orderDate || '').slice(0, 7); if (k) (monthMap[k] = monthMap[k] || { amt: 0, inv: 0, pay: 0 }).amt += +o.totalAmount || 0; });
  invs.forEach(v => { const k = (v.invoiceDate || '').slice(0, 7); if (k) (monthMap[k] = monthMap[k] || { amt: 0, inv: 0, pay: 0 }).inv += +v.amount || 0; });
  pays.forEach(p => { const k = (p.paymentDate || '').slice(0, 7); if (k) (monthMap[k] = monthMap[k] || { amt: 0, inv: 0, pay: 0 }).pay += +p.amount || 0; });
  const months = Object.keys(monthMap).sort().reverse().slice(0, 12);
  $('#repMonthBox').innerHTML = months.length ? '<div class="tbl-wrap"><table><thead><tr><th>月份</th><th class="num">合同金额</th><th class="num">开票金额</th><th class="num">付款金额</th></tr></thead><tbody>' +
    months.map(m => '<tr><td><b>' + m + '</b></td><td class="num">' + fmtMoney(monthMap[m].amt) + '</td><td class="num">' + fmtMoney(monthMap[m].inv) + '</td><td class="num">' + fmtMoney(monthMap[m].pay) + '</td></tr>').join('') +
    '</tbody></table></div>' : '<div class="empty">暂无数据</div>';
  /* 「更多」菜单：统计为派生视图，仅导出EXCEL */
  $('#repMoreWrap').innerHTML = moreMenuHTML('repMore', [{ m: 'export', label: '📤 导出EXCEL' }]);
  bindMoreMenu('repMore', { export: async () => {
    await exportCollExcel('供应商汇总', '供应商汇总_' + todayFileTag() + '.xlsx',
      ['供应商', '合同数', '合同金额', '开票金额', '付款金额', '待付金额'],
      rows.map(k => [k, supMap[k].cnt, +supMap[k].amount.toFixed(2), +supMap[k].inv.toFixed(2), +supMap[k].pay.toFixed(2), +Math.max(0, supMap[k].inv - supMap[k].pay).toFixed(2)]));
  } });
}

initPage('reports', pageReports);
</script>
</body>
</html>
