/* 云端数据（与其它应用同一套 cloudbase-sync 机制）：独立命名空间 purchase-integrated，

<script>
'use strict';
/* ==========================================================
   对账管理
   Tab1 合同对账总表：按合同把「货流（收货）/ 票流（开票）/ 款流（付款）」三流对齐，
        并严格区分合同执行状态：
          未执行  —— 合同已签订但尚未送货（无收货、无发票、无付款），
                      货/票/款列显示「—」，不参与应收应付差异计算，单独立组置底展示；
          执行中  —— 已发生收货/开票/付款，但尚未「三清」；
          已执行完 —— 货清（收齐）+ 票清（开票 ≥ 收货金额）+ 款清（付款 ≥ 开票）。
        三流差异：待开票（货到票未到）/ 待付款（票到款未付）/ 付款超票（预付预警）。
   Tab2 供应商对账单：按供应商 + 期间生成开票/付款流水对账单，支持 A4 打印。
   ========================================================== */

/* 合同已收货金额：Σ(净收货数量 × 合同单价)，按产品逐项计算（退货冲减） */
function recvAmtOfContract(o) {
  let sum = 0;
  orderProducts(o).forEach(p => {
    const q = receivedQty(o.contractNumber, p.name) - returnedQty(o.contractNumber, p.name);
    sum += Math.max(0, q) * (+p.price || 0);
  });
  return sum;
}
/* 合同对账数据：执行状态 + 三流进度 + 差异 */
function contractRecon(o) {
  const cno = o.contractNumber;
  const ordered = orderOrderedQty(o);
  const recv = Math.max(0, orderReceivedTotal(o) - orderReturnTotal(o));
  const recvAmt = recvAmtOfContract(o);
  const contractTotal = +o.totalAmount || orderProducts(o).reduce((s, p) => s + (+p.quantity || 0) * (+p.price || 0), 0);
  const invoiced = invoicedOfContract(cno);
  const paid = paidOfContract(cno);
  const idle = recv <= 0 && invoiced <= 0.005 && paid <= 0.005;              // 未执行：三无
  const done = !idle && ordered > 0 && recv >= ordered
    && invoiced >= recvAmt - 0.005 && paid >= invoiced - 0.005;              // 三清
  const status = idle ? 'idle' : (done ? 'done' : 'running');
  return {
    o, cno, supplier: o.supplier, contractTotal, ordered, recv, recvAmt, invoiced, paid, status,
    waitInv: Math.max(0, recvAmt - invoiced),   // 货到票未到 → 待开票
    waitPay: Math.max(0, invoiced - paid),      // 票到款未付 → 待付款
    overPay: Math.max(0, paid - invoiced)       // 款超票 → 预付/超付预警
  };
}
const flowBadge = (cur, total, noneText, partText, fullText) => {
  if (total <= 0.005 && cur <= 0.005) return '<span class="badge b-gray">' + noneText + '</span>';
  if (cur >= total - 0.005) return '<span class="badge b-green">' + fullText + '</span>';
  if (cur > 0.005) return '<span class="badge b-amber">' + partText + '</span>';
  return '<span class="badge b-gray">' + noneText + '</span>';
};

function pageRecon(root) {
  root.innerHTML =
    '<div class="page-head"><h2>对账管理</h2><span class="desc">合同三流对账（货 / 票 / 款）· 严格区分未执行合同 · 支持供应商对账单 A4 打印</span></div>' +
    '<div class="tabs" id="rcTabs" style="margin-bottom:12px"></div>' +
    '<div id="rcBody"></div>';
  const tabs = [
    { key: 'ledger', name: '合同对账总表' },
    { key: 'statement', name: '供应商对账单（A4）' }
  ];
  const renderTabs = () => {
    $('#rcTabs').innerHTML = tabs.map(t =>
      '<button class="tab' + ((State.reconTab || 'ledger') === t.key ? ' active' : '') + '" data-t="' + t.key + '">' + t.name + '</button>').join('');
    $('#rcTabs').querySelectorAll('button[data-t]').forEach(b => b.addEventListener('click', () => {
      State.reconTab = b.dataset.t;
      renderTabs();
      renderTab();
    }));
  };
  const renderTab = () => (State.reconTab || 'ledger') === 'ledger' ? renderLedger($('#rcBody')) : renderStatement($('#rcBody'));
  renderTabs();
  renderTab();
}

/* ================= Tab1：合同对账总表 ================= */
/* 导出EXCEL（数值列保留两位小数，EXCEL 中为数值类型可参与计算） */
async function exportReconExcel() {
  const all = Data.list('orders').map(contractRecon);
  const stName = { idle: '未执行', running: '执行中', done: '已执行完' };
  await exportCollExcel('合同对账总表', '合同对账总表_' + todayFileTag() + '.xlsx',
    ['合同号', '供应商', '合同金额', '执行状态', '订购数量', '已收数量', '已收货金额', '已开票金额', '已付款金额', '待开票', '待付款', '付款超票'],
    all.map(r => [r.cno, r.supplier, +r.contractTotal.toFixed(2), stName[r.status], r.ordered, r.recv,
      +r.recvAmt.toFixed(2), +r.invoiced.toFixed(2), +r.paid.toFixed(2), +r.waitInv.toFixed(2), +r.waitPay.toFixed(2), +r.overPay.toFixed(2)]));
}
function renderLedger(box) {
  const isSup = Session.isSupplier(), me = Session.mySupplier();
  box.innerHTML =
    '<div id="rcStats" class="stat-grid"></div>' +
    '<div class="card"><div class="row-flex" style="margin-bottom:12px">' +
    '<div style="flex:1;max-width:300px"><label>搜索</label><input id="rcSearch" placeholder="合同号 / 供应商"></div>' +
    '<div><label>执行状态</label><select id="rcStatus"><option value="">全部</option><option value="done">已执行完</option><option value="running">执行中</option><option value="idle">未执行</option></select></div>' +
    '<div style="align-self:flex-end"><span id="rcMoreWrap"></span></div>' +
    '</div><div id="rcLedgerBox"></div></div>';

  const statCard = (l, v, color, sub) =>
    '<div class="stat-card"><div class="l">' + esc(l) + '</div><div class="v" style="color:' + color + '">' + v + '</div>' +
    (sub ? '<div class="l" style="margin-top:4px">' + esc(sub) + '</div>' : '') + '</div>';
  const statusBadge = st =>
    st === 'idle' ? '<span class="badge b-gray">未执行</span>'
      : st === 'done' ? '<span class="badge b-green">已执行完</span>'
      : '<span class="badge b-amber">执行中</span>';
  let expanded = {};   // cno -> bool

  const draw = () => {
    const kw = ($('#rcSearch').value || '').trim().toLowerCase();
    const stf = $('#rcStatus').value;
    let all = Data.list('orders').map(contractRecon);
    if (kw) all = all.filter(r => (r.cno + ' ' + r.supplier).toLowerCase().includes(kw));
    if (stf) all = all.filter(r => r.status === stf);
    /* 统计卡（全量口径，不随筛选变化） */
    const base = Data.list('orders').map(contractRecon);
    const idleAll = base.filter(r => r.status === 'idle');
    const runAll = base.filter(r => r.status === 'running');
    const doneAll = base.filter(r => r.status === 'done');
    $('#rcStats').innerHTML =
      statCard('合同总数', base.length + ' 份', 'var(--primary)', '金额 ' + fmtMoney(base.reduce((s, r) => s + r.contractTotal, 0))) +
      statCard('未执行', idleAll.length + ' 份', 'var(--muted, #888)', '金额 ' + fmtMoney(idleAll.reduce((s, r) => s + r.contractTotal, 0)) + ' · 未送货未开票未付款') +
      statCard('执行中', runAll.length + ' 份', '#b45309', '金额 ' + fmtMoney(runAll.reduce((s, r) => s + r.contractTotal, 0))) +
      statCard('已执行完', doneAll.length + ' 份', 'var(--green)', '金额 ' + fmtMoney(doneAll.reduce((s, r) => s + r.contractTotal, 0))) +
      statCard('待开票（货到票未到）', fmtMoney(base.reduce((s, r) => s + r.waitInv, 0)), 'var(--red)', '仅统计执行中/已执行完合同') +
      statCard('待付款（票到款未付）', fmtMoney(base.reduce((s, r) => s + r.waitPay, 0)), 'var(--red)', '仅统计执行中/已执行完合同');
    /* 分组渲染：已执行完 → 执行中 → 未执行（置底，独立提示） */
    const order = [['done', '已执行完（货清 · 票清 · 款清）'], ['running', '执行中（已发生收货 / 开票 / 付款）'], ['idle', '未执行（已签订合同，尚未送货、未开票、未付款——不参与应收应付对账）']];
    const html = order.map(([st, label]) => {
      let rows = all.filter(r => r.status === st);
      if (!rows.length) return '';
      const trs = rows.map(r => {
        const open = !!expanded[r.cno];
        const dim = st === 'idle' ? ' style="color:var(--muted,#888)"' : '';
        const dash = '<td' + dim + ' style="text-align:center;color:var(--muted,#888)">—</td>';
        const diffCell = st === 'idle' ? dash :
          (r.overPay > 0.005 ? '<td><span class="badge b-red">付款超票 ' + fmtMoney(r.overPay) + '</span></td>'
            : r.waitPay > 0.005 ? '<td><span class="badge b-amber">待付款 ' + fmtMoney(r.waitPay) + '</span></td>'
            : r.waitInv > 0.005 ? '<td><span class="badge b-blue">待开票 ' + fmtMoney(r.waitInv) + '</span></td>'
            : '<td><span class="badge b-green">三流一致</span></td>');
        const goodsCell = st === 'idle' ? dash :
          '<td' + dim + '>' + flowBadge(r.recv, r.ordered, '未收货', '部分收货 ' + r.recv + '/' + r.ordered, '已收齐 ' + r.recv + '/' + r.ordered) + '</td>';
        const invCell = st === 'idle' ? dash :
          '<td' + dim + '>' + flowBadge(r.invoiced, r.recvAmt, '未开票', '部分开票', '票齐') +
          (r.recvAmt > 0.005 ? '<div style="font-size:11.5px;color:var(--muted,#888)">应收票 ' + fmtMoney(r.recvAmt) + ' / 已开 ' + fmtMoney(r.invoiced) + '</div>' : '') + '</td>';
        const payCell = st === 'idle' ? dash :
          '<td' + dim + '>' + flowBadge(r.paid, r.invoiced, '未付款', '部分付款', '款清') +
          (r.invoiced > 0.005 ? '<div style="font-size:11.5px;color:var(--muted,#888)">已开 ' + fmtMoney(r.invoiced) + ' / 已付 ' + fmtMoney(r.paid) + '</div>' : '') + '</td>';
        const parent = '<tr' + (open ? ' style="background:rgba(0,0,0,0.03)"' : '') + (st === 'idle' ? ' class="rc-idle"' : '') + '>' +
          '<td class="mono"><b>' + esc(r.cno) + '</b></td>' +
          '<td' + dim + '>' + esc(r.supplier) + '</td>' +
          '<td class="num"' + dim + '>' + fmtMoney(r.contractTotal) + '</td>' +
          '<td>' + statusBadge(r.status) + '</td>' +
          goodsCell + invCell + payCell + diffCell +
          '<td><button class="link-op" data-cno="' + esc(r.cno) + '" data-a="x">' + (open ? '收起▲' : '明细▼') + '</button></td></tr>';
        return open ? [parent, expandRow(r, st)] : [parent];
      }).flat().join('');
      return '<h3 style="margin:14px 0 8px;font-size:14px">' + label + '<span style="color:var(--muted,#888);font-weight:400">　' + rows.length + ' 份 · ' + fmtMoney(rows.reduce((s, r) => s + r.contractTotal, 0)) + '</span></h3>' +
        '<div class="tbl-wrap" style="max-height:40vh;margin-bottom:6px"><table><thead><tr>' +
        '<th>合同号</th><th>供应商</th><th class="num">合同金额</th><th>执行状态</th><th>货流（收货）</th><th>票流（开票）</th><th>款流（付款）</th><th>对账差异</th><th>操作</th>' +
        '</tr></thead><tbody>' + trs + '</tbody></table></div>';
    }).join('');
    $('#rcLedgerBox').innerHTML = html || '<div class="empty">没有符合条件的合同</div>';
    $('#rcLedgerBox').querySelectorAll('button[data-a="x"]').forEach(b => b.addEventListener('click', () => {
      expanded[b.dataset.cno] = !expanded[b.dataset.cno];
      draw();
    }));
  };
  /* 展开明细：未执行 → 产品清单；执行中/完 → 发票清单 + 付款清单 */
  const expandRow = (r, st) => {
    let inner;
    if (st === 'idle') {
      const ps = orderProducts(r.o).map(p => {
        const q = receivedQty(r.cno, p.name) - returnedQty(r.cno, p.name);
        return '<tr><td>' + esc(p.name) + '</td><td class="num">' + (+p.quantity || 0) + '</td><td class="num">' + fmtMoney(p.price) + '</td>' +
          '<td class="num">' + fmtMoney((+p.quantity || 0) * (+p.price || 0)) + '</td><td class="num">' + Math.max(0, q) + '</td>' +
          '<td><span class="badge b-gray">未发货</span></td></tr>';
      }).join('');
      inner = '<table style="font-size:12.5px"><thead><tr><th>产品</th><th class="num">订购数量</th><th class="num">单价</th><th class="num">金额</th><th class="num">已收数量</th><th>发货状态</th></tr></thead><tbody>' +
        (ps || '<tr><td colspan="6" class="empty">合同无产品明细</td></tr>') + '</tbody></table>' +
        '<div class="hint">该合同已签订但尚未执行：无收货、无发票、无付款，因此不产生应收应付，不参与三流对账。</div>';
    } else {
      const invList = Data.list('invoices').filter(v => splitMulti(v.contractNumber).includes(r.cno));
      const invs = invList.map(v => '<tr><td class="mono">' + esc(v.invoiceNumber) + '</td><td>' + esc(v.invoiceDate || '') + '</td>' +
        '<td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(v.itemName || '') + '</td>' +
        '<td class="num">' + fmtMoney(v.amount) + '</td></tr>').join('');
      // 付款流水取自报销系统（ReimPay 桥，按合同号命中 project 或本地发票合同号）
      const payList = ReimPay.payRows(r.cno);
      const pays = payList.map(p => '<tr><td>' + esc(p.paymentDate || '') + '</td><td class="mono">' + esc(p.paymentNumber || '') + '</td>' +
        '<td class="mono" style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(p.invoiceNumbers || '') + '</td>' +
        '<td>' + esc(p.method || '') + '</td><td class="num">' + fmtMoney(p.amount) + '</td></tr>').join('');
      inner = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' +
        '<div><b style="font-size:12.5px">发票清单（' + invList.length + ' 张）</b>' +
        '<table style="font-size:12.5px"><thead><tr><th>发票号码</th><th>开票日期</th><th>品名</th><th class="num">价税合计</th></tr></thead><tbody>' +
        (invs || '<tr><td colspan="4" class="empty">暂无发票</td></tr>') + '</tbody></table></div>' +
        '<div><b style="font-size:12.5px">付款清单（' + payList.length + ' 笔，来自报销系统）</b>' +
        '<table style="font-size:12.5px"><thead><tr><th>付款日期</th><th>付款单号</th><th>关联发票</th><th>方式</th><th class="num">金额</th></tr></thead><tbody>' +
        (pays || '<tr><td colspan="5" class="empty">暂无付款</td></tr>') + '</tbody></table></div></div>' +
        (r.overPay > 0.005 ? '<div class="hint" style="color:var(--red)">注意：该合同付款已超过开票金额（超付 ' + fmtMoney(r.overPay) + '），请核对是否存在预付或重复付款。</div>' : '');
    }
    return '<tr><td colspan="9" style="padding:0"><div style="max-height:300px;overflow:auto;border-top:1px dashed var(--border);background:var(--bg,#fafafa);padding:8px">' + inner + '</div></td></tr>';
  };
  /* 行展开需要插在父行后，重构 trs 生成逻辑：先算行 HTML 数组再 join */
  $('#rcSearch').addEventListener('input', draw);
  $('#rcStatus').addEventListener('change', draw);
  /* 「更多」菜单：对账为派生视图（数据来自订单/收货/发票/付款），仅导出，无导入/清空 */
  $('#rcMoreWrap').innerHTML = moreMenuHTML('rcMore', [
    { m: 'export', label: '📤 导出EXCEL' }
  ]);
  bindMoreMenu('rcMore', { export: exportReconExcel });
  draw();
}

/* ================= Tab2：供应商对账单（A4 打印） ================= */
function renderStatement(box) {
  const sups = Array.from(new Set(Data.list('orders').map(o => o.supplier).concat(Data.list('suppliers').map(s => s.supplierName)))).filter(Boolean);
  const selSup = Session.isSupplier() ? Session.mySupplier() : '';
  box.innerHTML =
    '<div class="card"><div class="row-flex">' +
    (Session.isSupplier() ? '' : '<div style="min-width:220px"><label class="req">供应商</label><select id="rcSup"><option value="">请选择供应商</option>' + sups.map(s => '<option>' + esc(s) + '</option>').join('') + '</select></div>') +
    '<div><label>开始日期</label><input id="rcStart" type="date"></div>' +
    '<div><label>结束日期</label><input id="rcEnd" type="date"></div>' +
    '<div style="align-self:flex-end"><button class="btn btn-primary" id="rcGen">生成对账单</button></div>' +
    '<div style="align-self:flex-end;display:none" id="rcPrintWrap"><button class="btn btn-outline" id="rcPrint">🖨 A4 打印 / 导出PDF</button></div>' +
    '</div><div id="rcResult" style="margin-top:14px"></div></div>';
  $('#rcGen').addEventListener('click', () => {
    const sup = Session.isSupplier() ? Session.mySupplier() : $('#rcSup').value;
    if (!sup) { toast('请选择供应商', 'err'); return; }
    drawRecon(sup, $('#rcStart').value, $('#rcEnd').value);
  });
  if (Session.isSupplier() && selSup) drawRecon(selSup, '', '');
  function drawRecon(sup, start, end) {
    const invs = Data.list('invoices').filter(v => v.supplier === sup && (!start || v.invoiceDate >= start) && (!end || v.invoiceDate <= end));
    // 付款流水取自报销系统（ReimPay 桥，已自动套用供应商/公司隔离），按付款日期过滤期间
    const pays = ReimPay.payRows().filter(p => p.supplier === sup &&
      (!start || (p.paymentDate || '') >= start) && (!end || (p.paymentDate || '') <= end));
    const lines = [];
    invs.forEach(v => lines.push({ date: v.invoiceDate, type: '开票', doc: v.invoiceNumber, cno: v.contractNumber, amt: +v.amount || 0 }));
    pays.forEach(p => lines.push({ date: p.paymentDate, type: '付款', doc: p.paymentNumber, cno: p.contractNumber, amt: -(+p.amount || 0) }));
    lines.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    let run = 0; const totalInv = lines.filter(l => l.amt > 0).reduce((s, l) => s + l.amt, 0);
    const totalPay = -lines.filter(l => l.amt < 0).reduce((s, l) => s + l.amt, 0);
    lines.forEach(l => { run += l.amt; l.run = run; });
    $('#rcPrintWrap').style.display = lines.length ? 'block' : 'none';
    $('#rcResult').innerHTML =
      '<div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">' +
      '<div class="stat-card hl"><div class="l">开票合计（应付）</div><div class="v">' + fmtMoney(totalInv) + '</div><div class="s">' + invs.length + ' 张发票</div></div>' +
      '<div class="stat-card good"><div class="l">付款合计（已付）</div><div class="v">' + fmtMoney(totalPay) + '</div><div class="s">' + pays.length + ' 笔付款</div></div>' +
      '<div class="stat-card ' + (totalInv - totalPay > 0.005 ? 'bad' : 'good') + '"><div class="l">未付余额</div><div class="v">' + fmtMoney(totalInv - totalPay) + '</div><div class="s">开票 − 付款</div></div></div>' +
      (lines.length ? '<div class="tbl-wrap" style="max-height:46vh"><table><thead><tr><th>序号</th><th>日期</th><th>类型</th><th>单据号</th><th>合同号</th><th class="num">开票金额</th><th class="num">付款金额</th><th class="num">累计余额</th></tr></thead><tbody>' +
        lines.map((l, i) => '<tr><td>' + (i + 1) + '</td><td>' + esc(l.date) + '</td>' +
          '<td><span class="recon-line-typed ' + (l.amt > 0 ? 'recon-inv' : 'recon-pay') + '"><span class="badge ' + (l.amt > 0 ? 'b-purple' : 'b-green') + '">' + l.type + '</span></span></td>' +
          '<td class="mono">' + esc(l.doc) + '</td><td class="mono">' + esc(l.cno || '') + '</td>' +
          '<td class="num">' + (l.amt > 0 ? fmtMoney(l.amt) : '') + '</td><td class="num">' + (l.amt < 0 ? fmtMoney(-l.amt) : '') + '</td>' +
          '<td class="num"><b>' + fmtMoney(l.run) + '</b></td></tr>').join('') +
        '</tbody></table></div>' : '<div class="empty">该期间内暂无开票 / 付款记录</div>');
    $('#rcPrint').onclick = () => reconPrint(sup, start, end, lines, totalInv, totalPay);
  }
}
function reconPrint(sup, start, end, lines, totalInv, totalPay) {
  const no = nextNo('DZ-');
  const rows = lines.map((l, i) => '<tr><td>' + (i + 1) + '</td><td>' + esc(l.date) + '</td><td>' + l.type + '</td><td>' + esc(l.doc) + '</td><td>' + esc(l.cno || '') + '</td>' +
    '<td style="text-align:right">' + (l.amt > 0 ? fmtMoney(l.amt).slice(1) : '') + '</td><td style="text-align:right">' + (l.amt < 0 ? fmtMoney(-l.amt).slice(1) : '') + '</td><td style="text-align:right">' + fmtMoney(l.run).slice(1) + '</td></tr>').join('');
  $('#printArea').innerHTML = '<div class="a4">' +
    '<div class="info-grid" style="justify-content:space-between"><span style="font-size:15px;font-weight:700">对 账 单</span><span>编号：' + esc(no) + '</span></div>' +
    '<div class="info-grid"><span>需方（对账方）：' + esc(curCoName()) + '</span><span>供方（供应商）：' + esc(sup) + '</span></div>' +
    '<div class="info-grid"><span>对账期间：' + esc(start || '起始') + ' 至 ' + esc(end || todayStr()) + '</span><span>制单日期：' + todayStr() + '</span></div>' +
    '<table><thead><tr><th style="width:6%">序号</th><th style="width:13%">日期</th><th style="width:9%">类型</th><th style="width:18%">单据号</th><th style="width:16%">合同号</th><th style="width:13%">开票金额(元)</th><th style="width:13%">付款金额(元)</th><th style="width:12%">累计余额(元)</th></tr></thead><tbody>' +
    rows + '</tbody></table>' +
    '<div class="summary-bar"><span>开票合计：<b>' + fmtMoney(totalInv) + '</b></span><span>付款合计：<b>' + fmtMoney(totalPay) + '</b></span><span>未付余额：<b>' + fmtMoney(totalInv - totalPay) + '</b></span></div>' +
    '<div class="hint" style="color:#000">经双方核对，以上数据与双方账目相符。如有异议，请于收到本对账单后 5 个工作日内书面提出。</div>' +
    '<div class="sign-row"><div class="sign-box">需方确认（盖章）：　　　　　　日期：</div><div class="sign-box">供方确认（盖章）：　　　　　　日期：</div></div></div>';
  window.print();
}

initPage('recon', pageRecon);
</script>
</body>
</html>
