<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Method Patch Test</title></head>
<body>
<pre id="o">running...</pre>
<script>
var out = [];
function log(m) { out.push(m); document.getElementById('o').textContent = out.join('\n'); }

log('1. keys before: ' + JSON.stringify(Object.keys(localStorage)));
log('2. typeof getItem: ' + typeof localStorage.getItem);

localStorage.setItem('k1', 'v1');
log('3. native getItem works: ' + localStorage.getItem('k1'));

// patch assignment (same as supabase-sync.js)
var _orig = localStorage.getItem.bind(localStorage);
localStorage.getItem = function (key) { return 'PATCHED:' + key; };

log('4. after assign, typeof: ' + typeof localStorage.getItem);
try { log('5. patched call: ' + localStorage.getItem('k1')); } catch (e) { log('5. patched call THREW: ' + e.message); }
log('6. keys after assign: ' + JSON.stringify(Object.keys(localStorage)));
try { log('7. hasOwn getItem: ' + Object.prototype.hasOwnProperty.call(localStorage, 'getItem')); } catch (e) { log('7. hasOwn THREW: ' + e.message); }

// now defineProperty on 'getItem' (what defineKeyAccessor does if 'getItem' appears as a key)
try {
  Object.defineProperty(localStorage, 'getItem', {
    configurable: true, enumerable: true,
    get: function () { return localStorage.getItem('getItem'); },
    set: function (v) { localStorage.setItem('getItem', v); }
  });
  log('8. defineProperty getItem: OK');
  try { var t = localStorage.getItem; log('9. read getItem: ' + String(t).slice(0, 40)); } catch (e) { log('9. read getItem RECURSED: ' + e.message); }
} catch (e) { log('8. defineProperty getItem THREW: ' + e.message); }

log('DONE');
</script>
</body>
</html>
