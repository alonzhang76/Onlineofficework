<!-- ===== 登录视图 ===== -->
<div class="login-view" id="loginView">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">
        <img src="cat.jpg" alt="Logo">
      </div>
      <div class="brand-title">应用门户</div>
      <div class="brand-subtitle">App Portal · 一站式访问所有应用</div>
    </div>
    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="roleSelect">登录身份</label>
        <select class="form-select" id="roleSelect">
          <option value="user">普通用户</option>
          <option value="admin">管理员</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="email">邮箱</label>
        <input type="email" class="form-input" id="email" name="email"
               placeholder="请输入邮箱地址" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <input type="password" class="form-input" id="password" name="password"
               placeholder="请输入密码" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">登 录</button>
      <div class="login-message" id="loginMessage" role="status" aria-live="polite"></div>
      <div class="debug-panel" id="debugPanel"></div>
    </form>
  </div>
</div>

<!-- ===== Dashboard 视图 ===== -->

/* ===== 判断是否为管理员 ===== */
function checkIsAdmin(user) {

  return user.email.toLowerCase() === (APP_CONFIG.admin_email || 'alonzhang76@outlook.com').toLowerCase();
}

/* ===== 消息提示 ===== */
function setMessage(text, type) {
  loginMessage.textContent = text || '';
  loginMessage.style.color = type === 'error' ? '#dc2626'
    : type === 'success' ? '#059669'
    : type === 'info' ? '#2563eb'
    : 'rgba(255,255,255,0.9)';
}

function setDebug(text) {
  debugPanel.style.display = text ? 'block' : 'none';
  debugPanel.textContent = text || '';
}

/* ===== 登录 ===== */
async function handleLogin(event) {
  if (event && event.preventDefault) event.preventDefault();

  const role = roleSelect.value;
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    setMessage('请输入邮箱和密码', 'error');
    return false;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    setMessage('请输入正确的邮箱地址', 'error');
    return false;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = '登录中…';
  setMessage('');
  setDebug('');

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      const em = (error.message || '').toLowerCase();
      if (em.includes('invalid login') || em.includes('invalid_credentials')) {
        setMessage('邮箱或密码错误', 'error');
      } else if (em.includes('email not confirmed') || em.includes('not confirmed')) {
        setMessage('邮箱尚未验证，请先去邮箱确认', 'error');
      } else if (em.includes('rate limit') || em.includes('too many')) {
        setMessage('尝试次数过多，请稍后再试', 'error');
      } else if (em.includes('fetch') || em.includes('network') || em.includes('abort')) {
        setMessage('网络错误，请检查网络连接', 'error');
        setDebug('网络请求失败：\n' + error.message);
      } else {
        setMessage(error.message || '登录失败，请稍后重试', 'error');
        setDebug('完整错误信息：\n' + (error.message || String(error)));
      }
      loginBtn.disabled = false;
      loginBtn.textContent = '登 录';
      return false;
    }

    if (!data || !data.user) {
      setMessage('登录失败，请稍后重试', 'error');
      loginBtn.disabled = false;
      loginBtn.textContent = '登 录';
      return false;
    }

    // 管理员身份校验
    const userIsAdmin = checkIsAdmin(data.user);
    if (role === 'admin' && !userIsAdmin) {
      setMessage('该账号没有管理员权限', 'error');
      await supabaseClient.auth.signOut();
      loginBtn.disabled = false;
      loginBtn.textContent = '登 录';
      return false;
    }

    setMessage('登录成功，正在跳转…', 'success');
    setTimeout(() => showDashboard(data.user), 300);
    return false;
  } catch (err) {
    console.error('[login] exception:', err);
    const msg = err && err.message
      ? (err.message.includes('Failed to fetch') || err.message.toLowerCase().includes('network')
          ? '网络错误，请检查网络连接' : err.message)
      : '网络错误，请检查网络连接';
    setMessage(msg, 'error');
    setDebug('异常详情：\n' + (err && err.stack ? err.stack : String(err)));
    loginBtn.disabled = false;
    loginBtn.textContent = '登 录';
    return false;
  }
}

/* ===== 退出登录 ===== */
async function handleLogout() {
  closeAdminPanel();
  try {
    await supabaseClient.auth.signOut();
  } catch (e) { /* 忽略 */ }
  try {
    const keys = Object.keys(localStorage);
    keys.forEach(k => {
      if (k && k.indexOf('sb-') === 0 && k.indexOf('-auth-token') >= 0) {
        localStorage.removeItem(k);
      }
    });
  } catch (e) { /* 忽略 */ }
  currentUser = null;
  isAdmin = false;
  showLogin();
}

/* ===== 视图切换 ===== */
function showLogin() {
  loginView.style.display = 'flex';
  dashboardView.style.display = 'none';
  document.getElementById('email').value = '';
  document.getElementById('password').value = '';
  loginBtn.disabled = false;
  loginBtn.textContent = '登 录';
  setMessage('');
  setDebug('');
}

function showDashboard(user) {
  currentUser = user;
  isAdmin = checkIsAdmin(user);

  loginView.style.display = 'none';
  dashboardView.style.display = 'block';

  const email = user.email || 'user@example.com';
  userEmail.textContent = email;
  userAvatar.textContent = email.charAt(0).toUpperCase();

  // 管理员按钮
  adminBtn.style.display = isAdmin ? 'block' : 'none';

  // 欢迎语
  const hour = new Date().getHours();
  const greeting = hour < 6 ? '凌晨好'
    : hour < 12 ? '早上好'
    : hour < 14 ? '中午好'
    : hour < 18 ? '下午好'
    : '晚上好';
  const roleText = isAdmin ? '（管理员）' : '';
  welcomeTitle.textContent = `${greeting}，${email.split('@')[0]}${roleText}`;

  // 加载应用列表
  loadUserApps(user);
}

/* ===== 加载用户应用列表 ===== */
async function loadUserApps(user) {
  const apps = APP_CONFIG.apps || [];
  if (apps.length === 0) {
    renderEmpty();
    return;
  }

  // 管理员默认看到所有应用，权限都是 write
  if (isAdmin) {
    renderApps(apps.map(a => ({ ...a, permission: 'write' })));
    return;
  }

  // 普通用户从数据库读取权限
  try {
    const { data, error } = await supabase
      .from('user_app_permissions')
      .select('app_id, permission')
      .eq('user_id', user.id);

    if (error) {
      console.warn('[perms] 读取权限失败，显示所有应用:', error.message);
      renderApps(apps.map(a => ({ ...a, permission: 'write' })));
      return;
    }

    // 构建权限映射
    const permMap = {};
    (data || []).forEach(item => {
      permMap[item.app_id] = item.permission;
    });

    // 过滤出有权限的应用（排除 none）
    const visibleApps = apps
      .filter(app => {
        const perm = permMap[app.id];
        return perm === 'read' || perm === 'write';
      })
      .map(app => ({ ...app, permission: permMap[app.id] || 'write' }));

    if (visibleApps.length === 0) {
      renderEmpty();
    } else {
      renderApps(visibleApps);
    }
  } catch (err) {
    console.error('[perms] 加载失败:', err);
    renderApps(apps.map(a => ({ ...a, permission: 'write' })));
  }
}

/* ===== 渲染应用卡片 ===== */
function renderApps(apps) {
  if (!apps || apps.length === 0) {
    renderEmpty();
    return;
  }

  const sorted = [...apps].sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

  appsContainer.innerHTML = '<div class="apps-grid">' +
    sorted.map(app => {
      const permBadge = app.permission === 'read'
        ? '<span style="display:inline-block; font-size:11px; padding:2px 8px; background:#e0f2fe; color:#0284c7; border-radius:20px; margin-left:6px; vertical-align:middle;">只读</span>'
        : '';
      return `
      <div class="app-card" style="--card-accent:${app.color};--icon-bg:${hexToRgba(app.color, 0.1)};--icon-color:${app.color};"
           onclick="openApp('${app.url}', '${app.name}', '${app.permission}')">
        <div class="app-icon">${app.icon}</div>
        <div class="app-name">${escapeHtml(app.name)}${permBadge}</div>
        <div class="app-desc">${escapeHtml(app.description || '')}</div>
        <div class="app-arrow">
          打开应用
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
      </div>
    `;}).join('') +
    '</div>';
}

/* ===== 空状态 ===== */
function renderEmpty() {
  appsContainer.innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">📭</div>
      <div class="empty-title">暂无可用应用</div>

/* ===== 打开应用 ===== */
function openApp(url, name, permission) {
  if (!url) return;
  // 在 URL 上附带权限参数，子应用可自行读取判断
  const separator = url.includes('?') ? '&' : '?';
  const fullUrl = `${url}${separator}perm=${permission || 'write'}`;
  window.open(fullUrl, '_blank');
}

/* ===== 管理员面板 ===== */
async function openAdminPanel() {

/* ===== 加载用户列表 ===== */
async function loadUserList() {
  userListEl.innerHTML = `
    <div class="skeleton" style="height:64px; margin-bottom:8px;"></div>
    <div class="skeleton" style="height:64px; margin-bottom:8px;"></div>
    <div class="skeleton" style="height:64px;"></div>
  `;

  try {
    // 方式1：尝试从自定义表读取（需要建表 + RLS）
    // 方式2：用 RPC 函数（更安全）
    // 方式3：从 auth.users 读取（需要 service_role，前端不行）
    // 折中方案：从 user_app_permissions 表中收集已出现过的用户 + 手动添加
    // 但最实用的是：提供一个输入框让管理员输入用户邮箱来添加
    
    // 先查已有权限的用户
    const { data: permData, error } = await supabase
      .from('user_app_permissions')
      .select('user_id')
      .eq('user_id', currentUser.id); // 占位：实际需要能读所有用户

    // 由于 RLS 限制，前端 anon key 无法读所有用户

    renderUserListInputMode();
  } catch (e) {
    console.error('[admin] 加载用户列表失败:', e);
    renderUserListInputMode();
  }

/* ===== 用户列表：输入邮箱模式 ===== */
function renderUserListInputMode() {
  userListEl.innerHTML = `
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <input type="email" class="form-input" id="userEmailInput" 
             placeholder="输入用户邮箱后按回车" 
             style="flex:1; background:#fff; border:1px solid #cbd5e1; color:#1e293b; font-size:14px;"
             onkeydown="if(event.key==='Enter'){event.preventDefault(); findUserByEmail();}">
      <button class="admin-btn-primary" onclick="findUserByEmail()" style="padding:10px 16px; white-space:nowrap;">查找</button>
    </div>
    <div style="font-size:12px; color:#64748b; margin-bottom:8px;">
      💡 提示：输入用户邮箱来设置其权限。用户需已在 Supabase Auth 中注册。
    </div>
  `;
}

/* ===== 根据邮箱查找用户并读取权限 ===== */
async function findUserByEmail() {
  const emailInput = document.getElementById('userEmailInput');
  const email = emailInput.value.trim();
  if (!email) return;

  adminStatus.textContent = '查找用户中…';
  adminStatus.className = 'admin-footer-status';

  try {
    // 调用 RPC 函数读取用户权限
    const { data, error } = await supabaseClient.rpc('portal_get_user_permissions', {
      p_user_email: email
    });

    if (error) {
      // 如果函数不存在，可能是还没执行 SQL 脚本
      if (error.message && error.message.includes('function') && error.message.includes('does not exist')) {
        adminStatus.textContent = '请先在 Supabase 中执行 setup_portal.sql';
        adminStatus.className = 'admin-footer-status error';
        showSetupHint();
      } else if (error.message && error.message.includes('User not found')) {
        adminStatus.textContent = '未找到该用户，请确认邮箱是否正确';
        adminStatus.className = 'admin-footer-status error';
      } else if (error.message && error.message.includes('Permission denied')) {
        adminStatus.textContent = '无管理员权限';
        adminStatus.className = 'admin-footer-status error';
      } else {
        adminStatus.textContent = '查找失败：' + (error.message || '未知错误');
        adminStatus.className = 'admin-footer-status error';
      }
      return;
    }

    // 构建权限缓存
    const permMap = {};
    (data || []).forEach(item => {
      permMap[item.app_id] = item.permission;
    });
    permissionCache[email] = permMap;

    showPermissionEditorForEmail(email);
    adminStatus.textContent = '已加载权限设置';
    adminStatus.className = 'admin-footer-status success';

    // 1.5 秒后清除成功提示
    setTimeout(() => {
      if (adminStatus.textContent === '已加载权限设置') {
        adminStatus.textContent = '';
        adminStatus.className = 'admin-footer-status';
      }
    }, 1500);

  } catch (e) {
    console.error('[admin] 查找失败:', e);
    adminStatus.textContent = '查找失败：' + (e.message || '未知错误');
    adminStatus.className = 'admin-footer-status error';
  }
}

/* ===== 显示配置提示 ===== */
function showSetupHint() {
  permSectionEl.innerHTML = `
    <div style="padding:20px; background:#fef3c7; border:1px solid #fcd34d; border-radius:12px;">
      <div style="font-weight:600; color:#92400e; margin-bottom:8px;">⚠ 需要完成数据库配置</div>
      <div style="font-size:13px; color:#78350f; line-height:1.6;">
        管理员面板需要在 Supabase 中创建一个 RPC 函数来管理权限。<br>
        请将 setup_portal.sql 底部的"管理员写权限策略"取消注释后，在 SQL Editor 中执行。
      </div>
    </div>
  `;
}

/* ===== 显示指定邮箱的权限编辑器 ===== */
function showPermissionEditorForEmail(email) {
  selectedUserId = email; // 临时用邮箱当标识
  selectedUserLabel.textContent = `— ${email}`;

  const apps = APP_CONFIG.apps || [];
  const cached = permissionCache[email] || {};

  permSectionEl.innerHTML = `
    <table class="perm-table">
      <thead>
        <tr>
          <th style="width:50%;">应用</th>
          <th>权限设置</th>
        </tr>
      </thead>
      <tbody>
        ${apps.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0)).map(app => {
          const perm = cached[app.id] || 'none';
          return `
          <tr>
            <td>
              <div class="perm-app-cell">
                <div class="perm-app-icon" style="background:${hexToRgba(app.color, 0.1)};">${app.icon}</div>
                <div>
                  <div class="perm-app-name">${escapeHtml(app.name)}</div>
                  <div style="font-size:12px; color:#64748b; margin-top:2px;">${escapeHtml(app.description || '')}</div>
                </div>
              </div>
            </td>
            <td style="text-align:right;">
              <select class="perm-select ${perm}" data-app-id="${app.id}" onchange="onPermissionChange(this)">
                <option value="none" ${perm === 'none' ? 'selected' : ''}>不显示</option>
                <option value="read" ${perm === 'read' ? 'selected' : ''}>只读</option>
                <option value="write" ${perm === 'write' ? 'selected' : ''}>读写</option>
              </select>
            </td>
          </tr>
        `;}).join('')}
      </tbody>
    </table>
  `;

  hasUnsavedChanges = false;
  savePermBtn.disabled = true;
}

/* ===== 权限变更回调 ===== */
function onPermissionChange(selectEl) {
  const appId = selectEl.dataset.appId;
  const perm = selectEl.value;

  // 更新样式类
  selectEl.className = 'perm-select ' + perm;

  // 缓存
  if (!permissionCache[selectedUserId]) {
    permissionCache[selectedUserId] = {};
  }
  permissionCache[selectedUserId][appId] = perm;

  hasUnsavedChanges = true;
  savePermBtn.disabled = false;
  adminStatus.textContent = '有未保存的更改';
  adminStatus.className = 'admin-footer-status';
}

/* ===== 保存权限 ===== */
async function savePermissions() {
  if (!selectedUserId || !permissionCache[selectedUserId]) return;

  savePermBtn.disabled = true;
  savePermBtn.textContent = '保存中…';
  adminStatus.textContent = '正在保存…';
  adminStatus.className = 'admin-footer-status';

  try {
    const email = selectedUserId;
    const perms = permissionCache[email] || {};

    const { data, error } = await supabaseClient.rpc('portal_set_app_permissions_batch', {
      p_user_email: email,
      p_perms: perms
    });

    if (error) {
      throw new Error(error.message || '保存失败');
    }

    hasUnsavedChanges = false;
    savePermBtn.disabled = true;
    savePermBtn.textContent = '保存更改';
    adminStatus.textContent = '✓ 保存成功';
    adminStatus.className = 'admin-footer-status success';

    setTimeout(() => {
      if (adminStatus.textContent === '✓ 保存成功') {
        adminStatus.textContent = '';
        adminStatus.className = 'admin-footer-status';
      }
    }, 2000);

  } catch (err) {
    console.error('[admin] 保存失败:', err);
    adminStatus.textContent = '保存失败：' + (err.message || '未知错误');
    adminStatus.className = 'admin-footer-status error';
    savePermBtn.textContent = '保存更改';
    savePermBtn.disabled = false;
  }
}

/* ===== 工具函数 ===== */
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ===== 初始检查 ===== */
(async function init() {
  await loadAppConfig();
  try {
    const { data, error } = await supabaseClient.auth.getUser();
    if (data && data.user && !error) {
      showDashboard(data.user);
    } else {
      showLogin();
    }
  } catch (e) {
    showLogin();
  }
})();

// 监听认证状态变化
supabaseClient.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT') {
    currentUser = null;
    isAdmin = false;
    showLogin();
  }
});
</script>
